<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>刷题防线 · 选择科目</title>
<style>
:root{
  --bg:#060f0b;
  --panel:#0b1a13;
  --panel2:#0e2018;
  --line:rgba(90,210,150,.22);
  --line2:rgba(90,210,150,.12);
  --ink:#c9e8d8;
  --dim:#5f8172;
  --green:#5fe08a;
  --cyan:#7fd6ff;
  --gold:#ffd166;
  --red:#ff6b6b;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%}
body{
  background:radial-gradient(1200px 700px at 50% -20%,#0d2018,#050a08 65%);
  color:var(--ink);
  font-family:"Cascadia Code","Consolas","Microsoft YaHei",monospace;
  padding:20px;display:flex;justify-content:center;
  min-height:100vh;align-items:flex-start;
}
.app{
  width:100%;max-width:1080px;
  background:linear-gradient(180deg,#0b1912,#070e0a);
  border:1px solid var(--line);border-radius:6px;
  box-shadow:0 30px 90px -30px #000;
  overflow:hidden;
}

.top{
  display:flex;align-items:center;gap:14px;
  padding:11px 20px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,#0e2018,#0a1510);
}
.top a{
  color:var(--dim);text-decoration:none;font-size:11.5px;
  padding:4px 9px;border:1px solid transparent;border-radius:2px;transition:.15s;
}
.top a:hover{color:var(--green);border-color:var(--line)}
.top .name{font-size:13px;letter-spacing:.22em;color:var(--green);text-shadow:0 0 14px rgba(95,224,138,.4)}
.top .sp{flex:1}
.top .total{font-size:11px;color:var(--dim)}
.top .total b{color:var(--gold);font-size:14px}

.head{padding:28px 28px 8px}
.head h1{
  font-size:22px;letter-spacing:.14em;font-weight:400;color:#e2f5ea;
  margin-bottom:8px;
}
.head p{font-size:11.5px;color:var(--dim);line-height:1.9}

.grid{
  padding:20px 28px 30px;
  display:grid;grid-template-columns:repeat(2,1fr);gap:14px;
}
@media(max-width:760px){ .grid{grid-template-columns:1fr} }

.card{
  position:relative;
  display:flex;align-items:center;gap:16px;
  padding:18px 20px;
  background:linear-gradient(150deg,#0d1f16,#0a1610);
  border:1px solid #1a3324;border-radius:5px;
  cursor:pointer;transition:.18s;
  text-decoration:none;color:inherit;
  overflow:hidden;
}
.card:hover{border-color:rgba(95,224,138,.5);background:linear-gradient(150deg,#11291c,#0c1c14);transform:translateY(-2px);box-shadow:0 12px 28px -14px rgba(95,224,138,.35)}
.card.lock{opacity:.42;cursor:not-allowed;background:#08120d}
.card.lock:hover{transform:none;border-color:#1a3324;box-shadow:none;background:#08120d}

.card .em{
  flex:0 0 46px;height:46px;border-radius:4px;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;border:1px solid currentColor;
}
.card .body{flex:1;min-width:0}
.card .nm{
  font-size:15px;letter-spacing:.06em;margin-bottom:5px;color:#dcefe4;
}
.card .meta{
  font-size:10.5px;color:#5d7f6e;display:flex;gap:12px;flex-wrap:wrap;
}
.card .meta b{color:#8fb8a2;font-weight:400}

.card .stars{
  flex:0 0 auto;text-align:right;
}
.card .stars .n{font-size:17px;color:var(--gold);line-height:1}
.card .stars .s{font-size:9px;color:#4d6b5c;margin-top:3px}

.card .badge{
  position:absolute;top:0;right:0;
  font-size:9px;padding:2px 8px;
  background:rgba(95,224,138,.15);color:var(--green);
  border-left:1px solid rgba(95,224,138,.3);border-bottom:1px solid rgba(95,224,138,.3);
}
.card.lock .badge{background:rgba(120,140,130,.1);color:#5d7f6e;border-color:#25382d}

.foot{
  padding:0 28px 26px;font-size:10.5px;color:#3f5a4c;line-height:1.9;
}
</style>
</head>
<body>

<div class="app">
  <div class="top">
    <a href="index.html">← 返回笔记</a>
    <span class="name">刷题防线</span>
    <span class="sp"></span>
    <span class="total">总星数 <b id="totalStars">0</b> / 210</span>
  </div>

  <div class="head">
    <h1>选择科目</h1>
    <p>每个科目一章 10 关，每关最高 3 星。<br>星星只看答对率：通关 1 星、正确率 70% 2 星、90% 3 星。</p>
  </div>

  <div class="grid" id="grid"></div>

  <div class="foot" id="foot"></div>
</div>

<script>
const SUBJECTS = [
  {id:'ds',  name:'数据结构',      icon:'◈', col:'#7fd6ff', chapters:6, ready:true,  desc:'线性表、栈队列、树、图、查找、排序'},
  {id:'coa', name:'计算机组成原理', icon:'▤', col:'#c77dff', chapters:7, ready:false, desc:'数据表示、存储、指令、CPU、总线、I/O'},
  {id:'os',  name:'操作系统',      icon:'⬢', col:'#5fe08a', chapters:5, ready:false, desc:'进程、内存、文件、I/O'},
  {id:'net', name:'计算机网络',    icon:'⌁', col:'#ffd166', chapters:6, ready:false, desc:'体系结构、物理层、链路层、网络层、传输层、应用层'},
  {id:'math',name:'数学一',        icon:'∑', col:'#ff9f68', chapters:3, ready:false, desc:'高等数学、线性代数、概率统计'},
  {id:'en',  name:'英语一',        icon:'A', col:'#a8e6ff', chapters:4, ready:false, desc:'词汇语法、阅读理解、其他题型、写作'},
  {id:'pol', name:'政治',          icon:'★', col:'#ff8fa3', chapters:5, ready:false, desc:'马原、毛中特、史纲、思修、时政'}
];

const KEY_PROG = 'qz:progress';

function loadProg(){
  try{ return JSON.parse(localStorage.getItem(KEY_PROG) || '{}'); }catch(e){ return {}; }
}

/* 某科已得星数：key 形如 ds-1-3 */
function subjectStars(prog, id){
  let sum = 0;
  for(const k in prog){
    if(k.startsWith(id + '-')) sum += prog[k].stars || 0;
  }
  return sum;
}

function render(){
  const prog = loadProg();
  let total = 0;
  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  SUBJECTS.forEach(s => {
    const got = subjectStars(prog, s.id);
    total += got;
    const max = 30;

    const el = document.createElement(s.ready ? 'a' : 'div');
    el.className = 'card' + (s.ready ? '' : ' lock');
    if(s.ready) el.href = 'hub.html?subject=' + s.id;

    el.innerHTML =
      '<div class="em" style="color:' + s.col + '">' + s.icon + '</div>' +
      '<div class="body">' +
        '<div class="nm">' + s.name + '</div>' +
        '<div class="meta">' +
          '<span>' + s.chapters + ' 章</span>' +
          '<span>' + (s.ready ? '第 1 章已开放' : '题库建设中') + '</span>' +
        '</div>' +
      '</div>' +
      '<div class="stars">' +
        '<div class="n">' + got + '</div>' +
        '<div class="s">/ ' + max + ' ★</div>' +
      '</div>' +
      '<div class="badge">' + (s.ready ? '可进入' : '待开放') + '</div>';

    grid.appendChild(el);
  });

  document.getElementById('totalStars').textContent = total;

  const readyN = SUBJECTS.filter(s => s.ready).length;
  document.getElementById('foot').innerHTML =
    '当前开放 ' + readyN + ' / ' + SUBJECTS.length + ' 个科目。' +
    '其余科目的战斗内容相同（敌人、特性、关卡结构），差异只在题库——补齐题库即可开放。';
}

render();
</script>
</body>
</html>
