  {tag:'E3',subj:'en',q:'阅读中「例子」的作用通常是？',o:['支撑前面的论点', '提出新观点', '反驳作者', '补充背景'],a:0,why:'例子（for example/for instance）是为了证明前面的观点。问「举例的目的」，答案往往在例子**前面**那句。'},
  {tag:'E3',subj:'en',q:'「The author mentions X in order to ...」这类题考的是？',o:['X 的定义', '作者的背景', '举例/引用在文中的作用', 'X 的历史'],a:2,why:'考「作用」而不是「内容」。要看 X 出现的位置：通常在论点之后（支撑）或之前（引出）。'},
  {tag:'E3',subj:'en',q:'阅读中遇到生词，最有效的应对是？',o:['查字典', '放弃', '跳过，靠上下文推断大意', '死记'],a:2,why:'考研阅读允许有 3% 生词。关键是抓句子主干和逻辑，个别词不认识不影响做题。查字典会浪费时间。'},
  {tag:'E4',subj:'en',q:'英语一「七选五」题型的核心技巧是？',o:['逐句翻译', '找上下文的衔接词和复现词', '随机选', '先做难的'],a:1,why:'七选五看三点：① 代词指代（this/these 指前文什么）；② 逻辑连接词（however/therefore）；③ 词汇复现（同词/同义替换）。'},
  {tag:'E4',subj:'en',q:'七选五中，如果空格在段首，通常填入？',o:['细节例子', '结论', '过渡句', '主题句（概括本段）'],a:3,why:'段首填主题句，段中填细节/例子，段尾填总结或过渡。位置决定功能，这是七选五的基本规律。'},
  {tag:'E4',subj:'en',q:'「排序题」的解题关键是？',o:['按字母顺序', '找首段（通常无指代、引出话题）和逻辑链', '看长度', '随机'],a:1,why:'排序：先定首段（无代词指代前面、提出话题），再找衔接（时间顺序、因果、指代）。首段常有背景介绍或现象描述。'},
  {tag:'E4',subj:'en',q:'新题型中，出现「For example」的段落通常？',o:['紧跟在提出论点的段落后', '独立成章', '是首段', '是末段'],a:0,why:'举例段要跟在论点段后。如果某个选项以 For example 开头，它前面必有一段提出观点，这就是衔接线索。'},
  {tag:'E4',subj:'en',q:'七选五的干扰项通常有什么特征？',o:['完全无关', '有生词', '太长', '与上下文话题相关但逻辑不衔接'],a:3,why:'干扰项往往「看起来相关」（同话题、同词汇），但代词指代不上或逻辑关系不对。所以要逐项验证衔接。'},
  {tag:'E4',subj:'en',q:'「小标题题」的解题方法是？',o:['看首句即可', '选最长的', '概括每段大意，找能覆盖全段的选项', '选最短的'],a:2,why:'小标题要概括整段（不是某句）。技巧：读段落后自己先用中文总结，再找最接近的英文标题。'},
  {tag:'E4',subj:'en',q:'新题型中，段落之间的因果关系通常由什么词提示？',o:['for instance', 'in addition', 'therefore / consequently / as a result', 'however'],a:2,why:'因果：therefore/consequently/as a result/thus。转折：however/nevertheless。举例：for instance。递进：in addition/moreover。'},
  {tag:'E4',subj:'en',q:'七选五做完后必须做什么？',o:['检查拼写', '数词数', '直接提交', '代入原文通读，检查连贯性'],a:3,why:'代入检查是必须的：读一遍看逻辑是否通顺、代词是否有指代、时态是否一致。很多错误靠通读能发现。'},
  {tag:'E5',subj:'en',q:'考研英语翻译（英译汉）的评分重点是？',o:['逐词直译', '准确传达意思，汉语通顺', '文学性', '字数'],a:1,why:'翻译看两点：① 意思准确（不漏、不错）；② 汉语通顺（符合中文表达习惯，不拗口）。逐词直译往往得低分。'},
  {tag:'E5',subj:'en',q:'翻译中遇到长难句，第一步应该？',o:['逐词翻译', '跳过', '拆分句子，找主谓宾', '猜意思'],a:2,why:'长难句先找主干（主谓宾），再处理修饰成分（定语从句、状语）。拆成短句翻译，最后按中文习惯重组。'},
  {tag:'E5',subj:'en',q:'「It is widely believed that ...」的翻译是？',o:['它被广泛相信', '这是广泛信仰', '人们普遍认为……', '广泛地相信它'],a:2,why:'被动语态常译为主动（「人们认为/据认为」），更符合中文习惯。类似：It is said that（据说）、It is reported that（据报道）。'},
  {tag:'E5',subj:'en',q:'小作文（应用文）最重要的是？',o:['使用难词', '字数多', '格式正确 + 要点齐全', '辞藻华丽'],a:2,why:'小作文（书信/通知）评分看格式（称呼、落款）和要点（题目要求的信息是否都写到）。语言准确即可，不必华丽。'},
  {tag:'E5',subj:'en',q:'大作文（图画作文）的常见结构是？',o:['只描述', '只议论', '只举例', '描述图画 → 分析原因 → 给出建议/结论'],a:3,why:'三段式：① 描述图画（what）；② 分析深层原因或寓意（why）；③ 提出建议或展望（how）。这是最稳的结构。'},
  {tag:'E5',subj:'en',q:'写作中，连接词「What is more」表示？',o:['因果', '转折', '举例', '递进（而且）'],a:3,why:'递进：What is more / Moreover / Furthermore / In addition。转折：However / Nevertheless。因果：Therefore / Consequently。'},
  {tag:'E5',subj:'en',q:'考研写作中，模板句应该如何使用？',o:['只用模板', '原封不动抄', '完全不用', '改造后融入，避免千篇一律'],a:3,why:'模板给结构，但要有自己的内容和表达。完全套模板容易被判「雷同卷」，得分低。建议背句型而非整段。'},
  {tag:'E5',subj:'en',q:'大作文结尾段常用的表达是？',o:['To begin with ...', 'Once upon a time ...', 'First and foremost ...', 'Only in this way can we ...'],a:3,why:'结尾常用倒装句：Only in this way can we...（只有这样我们才能…）。First/To begin with 是开头，Once upon a time 是故事开头。'},
  {tag:'P1',subj:'pol',q:'马克思主义哲学的直接理论来源是？',o:['古希腊哲学', '法国空想社会主义', '英国古典政治经济学', '德国古典哲学'],a:3,why:'马克思主义三大来源：德国古典哲学（黑格尔辩证法 + 费尔巴哈唯物主义）、英国古典政治经济学（劳动价值论）、法国空想社会主义。'},
  {tag:'P1',subj:'pol',q:'哲学的基本问题是？',o:['思维和存在的关系问题', '世界的本质是什么', '物质和意识谁更重要', '人能否认识世界'],a:0,why:'恩格斯提出：哲学基本问题是思维和存在的关系问题，包括两个方面——① 谁是第一性（划分唯物/唯心）；② 是否可知（划分可知论/不可知论）。'},
  {tag:'P1',subj:'pol',q:'物质的唯一特性是？',o:['可知性', '运动性', '客观实在性', '多样性'],a:2,why:'列宁的定义：物质是标志客观实在的哲学范畴。**客观实在性**是物质的唯一特性。运动是物质的存在方式（根本属性）。'},
  {tag:'P1',subj:'pol',q:'「量变引起质变」体现的辩证法原理是？',o:['质量互变规律', '对立统一规律', '否定之否定规律', '联系与发展'],a:0,why:'三大规律：对立统一（核心）、质量互变（发展的状态）、否定之否定（发展的方向）。量变是质变的必要准备，质变是量变的必然结果。'},
  {tag:'P1',subj:'pol',q:'辩证法的实质和核心是？',o:['普遍联系', '对立统一规律', '质量互变规律', '否定之否定规律'],a:1,why:'对立统一规律是辩证法的实质和核心，因为它揭示了事物发展的源泉和动力（矛盾是事物发展的根本原因）。'},
  {tag:'P1',subj:'pol',q:'实践和认识的辩证关系中，实践是？',o:['与认识无关', '认识的来源、动力、目的和检验标准', '认识的结果', '认识的附属'],a:1,why:'实践决定认识：是认识的来源、发展的动力、最终目的、检验真理的唯一标准。认识对实践有反作用（正确认识指导实践）。'},
  {tag:'P1',subj:'pol',q:'真理的绝对性和相对性的关系是？',o:['两者对立', '辩证统一，绝对真理寓于相对真理之中', '绝对真理更重要', '相对真理更重要'],a:1,why:'任何真理都是绝对性和相对性的统一：绝对性指客观性和无限发展性，相对性指近似性和条件性。绝对真理通过相对真理表现出来。'},
  {tag:'P1',subj:'pol',q:'社会存在和社会意识的关系是？',o:['互不影响', '社会意识决定社会存在', '两者平行', '社会存在决定社会意识，社会意识有相对独立性'],a:3,why:'历史唯物主义的基本原理：社会存在（物质生活条件）决定社会意识，社会意识反作用于社会存在，并具有相对独立性（可能超前或滞后）。'},
  {tag:'P2',subj:'pol',q:'毛泽东思想活的灵魂是？',o:['实事求是', '实事求是、群众路线、独立自主', '共同富裕', '改革开放'],a:1,why:'毛泽东思想活的灵魂有三个基本方面：实事求是（精髓）、群众路线（根本工作路线）、独立自主（基本立足点）。'},
  {tag:'P2',subj:'pol',q:'中国革命的三大法宝是？',o:['土地革命、武装斗争、根据地建设', '实事求是、群众路线、独立自主', '统一战线、武装斗争、党的建设', '自力更生、艰苦奋斗、勤俭建国'],a:2,why:'毛泽东在《〈共产党人〉发刊词》中提出：统一战线、武装斗争、党的建设，是中国共产党在中国革命中战胜敌人的三个法宝。'},
  {tag:'P2',subj:'pol',q:'新民主主义革命的领导力量是？',o:['知识分子', '无产阶级', '农民阶级', '资产阶级'],a:1,why:'新民主主义革命由无产阶级领导（通过共产党），这是它区别于旧民主主义革命的根本标志。农民是主力军，资产阶级是动力之一但非领导。'},
  {tag:'P2',subj:'pol',q:'我国社会主义改造基本完成后，国内的主要矛盾是？',o:['人民对于经济文化迅速发展的需要同当前经济文化不能满足人民需要的状况之间的矛盾', '城乡矛盾', '生产力与生产关系的矛盾', '无产阶级和资产阶级的矛盾'],a:0,why:'1956 年八大提出：主要矛盾是人民对于经济文化迅速发展的需要同当前经济文化不能满足人民需要的状况之间的矛盾。'},
  {tag:'P2',subj:'pol',q:'党的十一届三中全会的历史意义是？',o:['完成了社会主义改造', '建立了新中国', '确立了市场经济体制', '实现了党和国家工作中心的转移，开启改革开放'],a:3,why:'1978 年十一届三中全会：停止「以阶级斗争为纲」，把工作中心转移到经济建设上来，作出改革开放的伟大决策。是新中国成立以来党的历史上具有深远意义的伟大转折。'},
  {tag:'P2',subj:'pol',q:'社会主义的本质是？',o:['解放生产力，发展生产力，消灭剥削，消除两极分化，最终达到共同富裕', '按劳分配', '公有制', '计划经济'],a:0,why:'邓小平 1992 年南方谈话概括：社会主义的本质是解放生产力、发展生产力，消灭剥削、消除两极分化，最终达到共同富裕。'},
  {tag:'P2',subj:'pol',q:'我国社会主要矛盾在新时代转化为？',o:['经济发展与环境保护的矛盾', '人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾', '人民日益增长的物质文化需要同落后的社会生产之间的矛盾', '无产阶级和资产阶级的矛盾'],a:1,why:'党的十九大作出重大判断：中国特色社会主义进入新时代，社会主要矛盾已经转化为人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾。'},
  {tag:'P2',subj:'pol',q:'「两个一百年」奋斗目标中，第一个百年目标是？',o:['实现共同富裕', '建成社会主义现代化强国', '消除绝对贫困', '全面建成小康社会'],a:3,why:'第一个百年（建党一百年）：全面建成小康社会（2021 年已实现）。第二个百年（建国一百年）：建成富强民主文明和谐美丽的社会主义现代化强国。'},
  {tag:'P3',subj:'pol',q:'中国近代史的开端是？',o:['1840 年鸦片战争', '1919 年五四运动', '1911 年辛亥革命', '1949 年新中国成立'],a:0,why:'1840 年鸦片战争后，中国开始沦为半殖民地半封建社会，是中国近代史的开端。1919 年五四运动是新民主主义革命的开端。'},
  {tag:'P3',subj:'pol',q:'近代中国社会的性质是？',o:['资本主义社会', '社会主义社会', '半殖民地半封建社会', '封建社会'],a:2,why:'鸦片战争后，中国逐步沦为半殖民地半封建社会。这是近代中国最基本的国情，决定了革命的任务是反帝反封建。'},
  {tag:'P3',subj:'pol',q:'辛亥革命的历史功绩是？',o:['完成了反帝反封建任务', '实现了民族独立', '推翻了清王朝统治，结束了君主专制制度', '建立了社会主义制度'],a:2,why:'辛亥革命推翻了统治中国几千年的君主专制制度，建立了中华民国。但没有改变中国半殖民地半封建的社会性质，没有完成反帝反封建的任务。'},
  {tag:'P3',subj:'pol',q:'五四运动的历史意义是？',o:['标志着改革开放的开端', '标志着旧民主主义革命的开端', '标志着新民主主义革命的开端', '标志着社会主义革命的开端'],a:2,why:'1919 年五四运动：彻底反帝反封建的爱国运动，促进了马克思主义在中国的传播，标志着新民主主义革命的开端。'},
  {tag:'P3',subj:'pol',q:'中国共产党成立的标志是？',o:['1949 年新中国成立', '1927 年南昌起义', '1921 年中共一大召开', '1919 年五四运动'],a:2,why:'1921 年 7 月，中共一大在上海召开（后转移至嘉兴南湖），标志着中国共产党正式成立。这是中国历史上开天辟地的大事变。'},
  {tag:'P3',subj:'pol',q:'红军长征胜利结束的标志是？',o:['1934 年长征开始', '1936 年三大主力红军会师', '1937 年抗战爆发', '1935 年遵义会议'],a:1,why:'1936 年 10 月，红一、二、四方面军在甘肃会宁会师，标志着长征胜利结束。遵义会议（1935）是长征途中的转折点。'},
  {tag:'P3',subj:'pol',q:'抗日战争胜利的意义是？',o:['标志着新中国的成立', '结束了半殖民地半封建社会', '开始了社会主义建设', '是近代以来中国抗击外敌入侵的第一次完全胜利'],a:3,why:'1945 年抗战胜利：近代以来中国人民反抗外敌入侵第一次取得完全胜利的民族解放战争，重新确立了中国在世界上的大国地位。'},
  {tag:'P3',subj:'pol',q:'新中国成立的历史意义是？',o:['完成了社会主义改造', '建成了小康社会', '实现了民族独立和人民解放，开辟了中国历史新纪元', '开始了改革开放'],a:2,why:'1949 年 10 月 1 日新中国成立：结束了半殖民地半封建社会，实现了民族独立和人民解放，开辟了中国历史的新纪元。'},
  {tag:'P4',subj:'pol',q:'社会主义核心价值观在国家层面的内容是？',o:['爱国、敬业、诚信、友善', '富强、民主、文明、和谐', '自由、平等、公正、法治', '和平、发展、合作、共赢'],a:1,why:'三个层面：国家（富强民主文明和谐）、社会（自由平等公正法治）、个人（爱国敬业诚信友善）。'},
  {tag:'P4',subj:'pol',q:'理想信念的作用是？',o:['保证成功', '指引人生方向，提供精神动力', '决定物质条件', '替代实际行动'],a:1,why:'理想信念是精神之钙：指引方向（灯塔）、提供动力（引擎）、凝聚力量、提升境界。但理想不能代替现实，需要实践。'},
  {tag:'P4',subj:'pol',q:'中国精神的核心是？',o:['艰苦奋斗', '集体主义', '改革创新', '爱国主义'],a:3,why:'中国精神：以爱国主义为核心的民族精神 + 以改革创新为核心的时代精神。爱国主义是民族精神的核心。'},
  {tag:'P4',subj:'pol',q:'我国宪法的地位是？',o:['普通法律', '地方性法规', '国家的根本法，具有最高法律效力', '行政法规'],a:2,why:'宪法是国家的根本法，是治国安邦的总章程，具有最高法律效力。一切法律、行政法规都不得同宪法相抵触。'},
  {tag:'P4',subj:'pol',q:'全面依法治国的总目标是？',o:['完善法律条文', '加强执法', '普及法律知识', '建设中国特色社会主义法治体系、建设社会主义法治国家'],a:3,why:'十八届四中全会提出：全面推进依法治国，总目标是建设中国特色社会主义法治体系、建设社会主义法治国家。'},
  {tag:'P4',subj:'pol',q:'道德的功能不包括？',o:['认识功能', '调节功能', '导向功能', '强制约束'],a:3,why:'道德靠舆论、习惯、信念维持，**没有强制力**（那是法律的特征）。道德的功能：认识、调节、导向、激励、教化。'},
  {tag:'P4',subj:'pol',q:'个人理想和社会理想的关系是？',o:['互不相干', '个人理想更重要', '社会理想更重要', '相互依存，社会理想规定个人理想的方向'],a:3,why:'个人理想以社会理想为指引，社会理想以个人理想为基础。两者辩证统一，把个人理想融入社会理想才有价值。'},
  {tag:'P4',subj:'pol',q:'法律面前人人平等的含义是？',o:['任何组织和个人都必须遵守法律，不得有超越法律的特权', '人人法律知识相同', '人人守法程度相同', '人人立法权相同'],a:0,why:'法律面前人人平等：① 权利能力平等；② 平等地受法律保护；③ 平等地承担法律责任。任何组织和个人都不得有超越宪法法律的特权。'},
  {tag:'P5',subj:'pol',q:'党的二十大报告指出，中国式现代化的本质要求包括？',o:['只追求经济增长', '照搬西方模式', '坚持中国共产党领导，坚持中国特色社会主义', '优先发展工业'],a:2,why:'中国式现代化的本质要求：坚持中国共产党领导，坚持中国特色社会主义，实现高质量发展，发展全过程人民民主，丰富人民精神世界，实现全体人民共同富裕，促进人与自然和谐共生，推动构建人类命运共同体，创造人类文明新形态。'},
  {tag:'P5',subj:'pol',q:'新发展理念的内容是？',o:['高速、均衡、环保、开放、共享', '改革、发展、稳定、和谐、共享', '科技、教育、人才、创新、开放', '创新、协调、绿色、开放、共享'],a:3,why:'五大新发展理念：创新（动力）、协调（内在要求）、绿色（必要条件）、开放（必由之路）、共享（本质要求）。'},
  {tag:'P5',subj:'pol',q:'「双碳」目标是指？',o:['2035 年碳达峰、2060 年碳中和', '2030 年前碳达峰、2060 年前碳中和', '2030 年碳中和、2060 年碳达峰', '2025 年碳达峰、2050 年碳中和'],a:1,why:'中国承诺：力争 2030 年前实现碳达峰，2060 年前实现碳中和。这是应对气候变化的国家战略。'},
  {tag:'P5',subj:'pol',q:'构建新发展格局的关键是？',o:['减少投资', '扩大出口', '畅通国内大循环', '增加进口'],a:2,why:'新发展格局：以国内大循环为主体、国内国际双循环相互促进。关键在畅通国内大循环，依托强大国内市场。'},
  {tag:'P5',subj:'pol',q:'总体国家安全观的核心是？',o:['文化安全为基础', '军事安全为核心', '经济安全为根本', '人民安全为宗旨，政治安全为根本'],a:3,why:'总体国家安全观：以人民安全为宗旨，以政治安全为根本，以经济安全为基础，以军事、科技、文化、社会安全为保障，以促进国际安全为依托。'},
  {tag:'P5',subj:'pol',q:'人类命运共同体的核心理念是？',o:['零和博弈', '建设持久和平、普遍安全、共同繁荣、开放包容、清洁美丽的世界', '一国主导', '文明冲突'],a:1,why:'人类命运共同体：建设持久和平、普遍安全、共同繁荣、开放包容、清洁美丽的世界。这是中国对全球治理的主张。'},
  {tag:'P5',subj:'pol',q:'乡村振兴战略的总要求是？',o:['农业现代化', '农村城镇化', '生产发展、生活宽裕、乡风文明、村容整洁、管理民主', '产业兴旺、生态宜居、乡风文明、治理有效、生活富裕'],a:3,why:'乡村振兴总要求：产业兴旺、生态宜居、乡风文明、治理有效、生活富裕。注意与旧版「社会主义新农村」的表述区分。'},
  {tag:'P5',subj:'pol',q:'「四个全面」战略布局的内容是？',o:['全面小康、全面富裕、全面民主、全面法治', '全面开放、全面创新、全面协调、全面共享', '全面建成小康社会、全面深化改革、全面依法治国、全面从严治党', '全面建设社会主义现代化国家、全面深化改革、全面依法治国、全面从严治党'],a:3,why:'「四个全面」战略布局（2020 年后更新）：全面建设社会主义现代化国家、全面深化改革、全面依法治国、全面从严治党。原表述第一个是「全面建成小康社会」。'},
  {tag:'O6',subj:'os',q:'生产者-消费者问题中，信号量 empty 和 full 的初值分别是？',o:['empty = 缓冲区大小，full = 0', 'empty = 0，full = 缓冲区大小', '两者都是缓冲区大小', '两者都是 0'],a:0,why:'empty 表示空槽数（初始全空 = n），full 表示满槽数（初始无数据 = 0）。生产者 P(empty) 后 V(full)，消费者相反。'},
  {tag:'O6',subj:'os',q:'读者-写者问题中，「读者优先」可能导致？',o:['写者饥饿', '读者饥饿', '活锁', '死锁'],a:0,why:'读者优先：只要有读者在读，后续读者都能进，写者一直等。反过来「写者优先」可能导致读者饥饿。这是经典的公平性问题。'},
  {tag:'O6',subj:'os',q:'哲学家进餐问题的核心矛盾是？',o:['叉子太多', '每个哲学家需要两把叉子，可能互相等待形成死锁', '桌子太小', '哲学家太多'],a:1,why:'5 个哲学家 5 把叉子，每人拿左右两把。如果同时拿起左边的，就都在等右边 → 死锁。解法：最多允许 4 人同时取、奇偶编号不同顺序、一次性拿两把。'},
  {tag:'O6',subj:'os',q:'管程（Monitor）相比信号量的优势是？',o:['把互斥和同步封装起来，不易出错', '更快', '更省内存', '不需要锁'],a:0,why:'管程把共享数据和操作封装，同一时刻只允许一个进程进入（自动互斥）。用条件变量 wait/signal 做同步。程序员不用手动 P/V，减少出错。'},
  {tag:'O6',subj:'os',q:'「互斥」和「同步」的区别是？',o:['两者一样', '互斥是顺序', '互斥是排他访问，同步是按规定顺序执行', '同步是排他'],a:2,why:'互斥：同一时刻只允许一个进程访问临界资源（排他）。同步：多个进程按约定的先后顺序执行（协作）。生产者消费者既有互斥（缓冲区）又有同步（不能满了还生产）。'},
  {tag:'O6',subj:'os',q:'PV 操作中，V 操作（signal）的作用是？',o:['阻塞自己', '加锁', '申请资源', '释放资源，唤醒等待进程'],a:3,why:'V：S++，若 S ≤ 0 则唤醒一个等待进程。P：S--，若 S < 0 则阻塞。P 是「申请」，V 是「释放」。'},
  {tag:'O6',subj:'os',q:'用信号量实现互斥时，信号量的初值应该是？',o:['-1', '0', 'n', '1'],a:3,why:'互斥信号量 mutex 初值 1（一把锁）。P(mutex) 加锁，V(mutex) 解锁。初值为 0 是用于同步（等待某个事件）。'},
  {tag:'O6',subj:'os',q:'「忙等」（自旋）的含义是？',o:['进程在循环中反复检查条件，占着 CPU 不释放', '进程睡眠', '进程阻塞', '进程退出'],a:0,why:'忙等不放弃 CPU，一直空转检查。优点是响应快（不用切换），缺点是浪费 CPU。适合临界区很短、多核的场景。'},
  {tag:'O7',subj:'os',q:'进程间通信（IPC）的方式不包括？',o:['共享内存', '管道', '消息传递', '寄存器直接传递'],a:3,why:'IPC 三种主要方式：共享内存（最快，但需同步）、消息传递（send/receive）、管道（半双工）。寄存器是 CPU 内部的，不能跨进程共享。'},
  {tag:'O7',subj:'os',q:'共享内存通信的优点和缺点是？',o:['最慢但安全', '速度最快，但需要额外的同步机制', '不能传大数据', '不需要同步'],a:1,why:'共享内存直接读写同一块内存，不用拷贝，所以最快。但多个进程同时读写会冲突，必须配合信号量等同步机制。'},
  {tag:'O7',subj:'os',q:'匿名管道（pipe）的特点是？',o:['全双工', '半双工，只能用于有亲缘关系的进程', '可跨机器', '不需要缓冲区'],a:1,why:'匿名管道：单向（半双工）、只能父子/兄弟进程间用、基于内存缓冲区。命名管道（FIFO）可以用于任意进程。'},
  {tag:'O7',subj:'os',q:'消息传递中，「直接通信」和「间接通信」的区别是？',o:['两者一样', '直接发给指定进程，间接通过信箱（端口）', '间接不能跨机器', '直接更快'],a:1,why:'直接：send(P, msg) 明确指定接收者。间接：send(mailbox, msg) 发到信箱，接收者从信箱取。间接更灵活（解耦）。'},
  {tag:'O7',subj:'os',q:'信号（signal）机制的作用是？',o:['创建进程', '传输大量数据', '共享内存', '通知进程发生了某个事件（如 Ctrl+C）'],a:3,why:'信号是软件中断，用于事件通知（SIGINT、SIGKILL、SIGSEGV）。它传递的信息量很小（只是一个编号），不适合传数据。'},
  {tag:'O7',subj:'os',q:'管道通信的本质是？',o:['网络连接', '磁盘上的文件', '内核维护的一块缓冲区', '共享内存'],a:2,why:'管道是内核中的环形缓冲区，写进程写入、读进程读出。读写要互斥同步（空则读阻塞，满则写阻塞）。'},
  {tag:'O7',subj:'os',q:'套接字（socket）通信的特点是？',o:['速度最快', '不需要协议', '可以跨主机通信', '只能本机'],a:2,why:'socket 是网络通信的端点（IP + 端口），可以跨主机。本机也可以用（localhost）。是分布式系统的基础。'},
  {tag:'O7',subj:'os',q:'「零拷贝」技术主要解决什么问题？',o:['加密数据', '减少内存', '减少数据在用户态和内核态之间的复制次数', '加快 CPU'],a:2,why:'传统 IO 要多次拷贝（磁盘→内核缓冲区→用户缓冲区→socket 缓冲区）。零拷贝（sendfile、mmap）让数据在内核内直接传输，减少 CPU 拷贝和上下文切换。'},
  {tag:'O8',subj:'os',q:'用户级线程（ULT）的调度由谁负责？',o:['硬件', '编译器', '操作系统内核', '用户空间的线程库'],a:3,why:'用户级线程由线程库管理，内核看不到（只知道一个进程）。优点是切换快（不用进内核），缺点是一个线程阻塞会导致整个进程阻塞。'},
  {tag:'O8',subj:'os',q:'内核级线程（KLT）的优点是？',o:['切换更快', '一个线程阻塞不影响其他线程，可多核并行', '不需要内核', '更省内存'],a:1,why:'内核级线程由 OS 调度，一个阻塞不影响其他，且能在多核上真正并行。缺点是创建和切换开销大（要进内核）。'},
  {tag:'O8',subj:'os',q:'「多对一」线程模型的缺点是？',o:['一个线程阻塞会导致整个进程阻塞', '不能创建线程', '占用内存多', '切换慢'],a:0,why:'多对一：多个用户线程映射到一个内核线程。优点是不用进内核、快；缺点是一个阻塞全阻塞，且不能多核并行。'},
  {tag:'O8',subj:'os',q:'「一对一」线程模型的缺点是？',o:['不能并行', '不能多核', '每个用户线程对应一个内核线程，开销大', '一个阻塞全阻塞'],a:2,why:'一对一（如 Linux）：每个用户线程都有内核线程支持，能并行、不互相阻塞。缺点是线程数受内核限制，创建开销大。'},
  {tag:'O8',subj:'os',q:'同一进程的多个线程共享什么？',o:['线程 ID', '程序计数器', '地址空间、全局变量、打开的文件', '寄存器和栈'],a:2,why:'线程共享：代码段、数据段、堆、文件描述符。线程私有：寄存器、栈、程序计数器、线程 ID。这是线程切换比进程快的原因。'},
  {tag:'O8',subj:'os',q:'线程切换比进程切换快的原因是？',o:['线程在用户态', '线程不需要保存现场', '线程更小', '不用切换地址空间（页表）'],a:3,why:'进程切换要换页表（TLB 失效、缓存失效），开销大。同进程的线程切换只换寄存器和栈，地址空间不变，所以快。'},
  {tag:'O8',subj:'os',q:'多线程编程中，「竞态条件」是指？',o:['线程太多', '死锁', '多个线程访问共享数据，结果依赖执行顺序', '内存不足'],a:2,why:'竞态条件（race condition）：结果取决于线程的调度顺序，可能出错。解决靠互斥锁、原子操作、无共享设计。'},
  {tag:'O8',subj:'os',q:'线程池的作用是？',o:['节省内存', '限制线程数', '加快 CPU', '预先创建线程复用，避免频繁创建销毁的开销'],a:3,why:'线程池维护一组空闲线程，任务来了就分配，用完归还。避免每次创建/销毁线程的开销，还能控制并发数防止资源耗尽。'},
  {tag:'O9',subj:'os',q:'「周转时间」的定义是？',o:['服务时间', '等待时间', '作业完成时间 − 提交时间', '响应时间'],a:2,why:'周转时间 = 完成时间 − 到达时间（从提交到完成的总时间）。带权周转时间 = 周转时间 / 服务时间（越接近 1 越好）。'},
  {tag:'O9',subj:'os',q:'FCFS（先来先服务）调度算法的缺点是？',o:['对短作业不利（长作业先到会阻塞后面）', '不能抢占', '实现复杂', '平均周转时间最长'],a:0,why:'FCFS 简单公平，但如果一个长作业先到，后面的短作业都要等（护航效应）。SJF 能降低平均周转时间但有饥饿问题。'},
  {tag:'O9',subj:'os',q:'SJF（短作业优先）的平均周转时间相比 FCFS 是？',o:['更短（理论最优）', '相同', '更长', '不确定'],a:0,why:'SJF 的平均周转时间在所有非抢占算法中最短（可证明）。但需要预知作业长度，实际中常用估计值，且有长作业饥饿问题。'},
  {tag:'O9',subj:'os',q:'时间片轮转（RR）中，时间片过大和过小分别会导致？',o:['都变快', '没有影响', '都变慢', '退化成 FCFS / 切换开销过大'],a:3,why:'时间片太大：每个进程都跑完才切换，退化成 FCFS。时间片太小：频繁切换，开销占比高。通常取 20-50ms。'},
  {tag:'O9',subj:'os',q:'「响应时间」和「周转时间」的区别是？',o:['响应是从提交到首次响应，周转是从提交到完成', '周转更短', '两者一样', '响应更长'],a:0,why:'响应时间：提交到**第一次**被响应（对交互式系统重要）。周转时间：提交到**完全完成**（对批处理重要）。'},
  {tag:'O9',subj:'os',q:'优先级调度中，「老化」（aging）技术的作用是？',o:['逐渐提高等待久的进程优先级，防止饥饿', '加快 CPU', '随机调整', '降低优先级'],a:0,why:'低优先级进程可能永远得不到 CPU（饥饿）。老化：每等待一段时间就提高优先级，最终能被执行。这是解决饥饿的通用方法。'},
  {tag:'O9',subj:'os',q:'多级反馈队列（MLFQ）的特点是？',o:['多个优先级队列，时间片逐级增大，新进程进最高级', '只有一个队列', '按作业长度排队', '随机调度'],a:0,why:'MLFQ：新进程进最高优先级（时间片最短），用完没完成就降级。兼顾响应时间（短作业快）和吞吐量（长作业也能跑），是最通用的调度算法。'},
  {tag:'O9',subj:'os',q:'实时调度中，「EDF」（最早截止期优先）属于？',o:['先来先服务', '轮转调度', '静态优先级调度', '动态优先级调度'],a:3,why:'EDF：按截止期排序，越早到期优先级越高（动态变化）。RMS（速率单调）是静态优先级（周期越短优先级越高）。'},
  {tag:'O10',subj:'os',q:'死锁检测的常用工具是？',o:['资源分配图（找环）', '甘特图', '状态图', '流程图'],a:0,why:'资源分配图：进程和资源画成图，如果存在环且环上每类资源只有一个实例，就死锁。多实例要用「化简」判断。'},
  {tag:'O10',subj:'os',q:'死锁解除的常用方法是？',o:['加快 CPU', '重启系统之外的等待', '终止进程或剥夺资源', '增加内存'],a:2,why:'解除死锁：① 终止进程（全部或逐个）；② 剥夺资源（回滚）；③ 进程回退。选择代价最小的方案。'},
  {tag:'O10',subj:'os',q:'「死锁避免」和「死锁预防」的区别是？',o:['预防是动态', '避免是静态', '两者一样', '避免是动态检查（分配前试算），预防是静态破坏条件'],a:3,why:'预防：破坏四个必要条件之一（如资源一次性分配）。避免：每次分配前用银行家算法检查是否安全。检测：允许发生，定期检查。'},
  {tag:'O10',subj:'os',q:'银行家算法中，「安全状态」的含义是？',o:['进程都就绪', '存在一个安全序列，所有进程都能按序完成', '没有死锁', '资源充足'],a:1,why:'安全状态：存在一个进程序列，按此顺序分配资源，每个进程都能获得所需资源并完成。不安全状态**不一定**死锁，但可能死锁。'},
  {tag:'O10',subj:'os',q:'「饥饿」和「死锁」的区别是？',o:['两者一样', '饥饿是长期得不到资源但系统仍在运行，死锁是互相等待永久阻塞', '饥饿更严重', '死锁会自己恢复'],a:1,why:'死锁：多个进程循环等待，永久阻塞，系统僵死。饥饿：某个进程长期得不到资源（其他进程一直抢占），但系统整体在运行。'},
  {tag:'O10',subj:'os',q:'「活锁」是指？',o:['资源耗尽', 'CPU 空闲', '进程死掉', '进程不断改变状态但无法推进（互相礼让）'],a:3,why:'活锁：进程没阻塞，一直在运行，但做的都是无用功（如两人在走廊互相让路，都往同一边让）。解决靠随机化退避。'},
  {tag:'O10',subj:'os',q:'资源分配图中，如果每个资源类只有一个实例，存在环意味着？',o:['资源不足', '可能死锁', '一定死锁', '不会死锁'],a:2,why:'单实例：有环 ⟺ 死锁。多实例：有环只是「可能」死锁，还要看能否化简（消去非阻塞进程）。这是重要区别。'},
  {tag:'O10',subj:'os',q:'「可剥夺资源」和「不可剥夺资源」的区别是？',o:['资源类型', '能否从进程手中强行收回', '资源速度', '资源大小'],a:1,why:'可剥夺：CPU、内存（可以换出）。不可剥夺：打印机、磁带机（正在用不能抢）。死锁的四个条件之一是「不可剥夺」，所以破坏它就能预防死锁。'},
  {tag:'N6',subj:'net',q:'奈奎斯特定理（无噪声）给出的极限速率是？',o:['2W', 'W·log₂V', '2W·log₂V（W 是带宽，V 是码元种类）', 'W·V'],a:2,why:'奈奎斯特：理想无噪声信道的极限码元速率是 2W 波特，数据率 = 2W·log₂V。注意它只考虑带宽，不考虑噪声。'},
  {tag:'N6',subj:'net',q:'香农定理中，信道容量与什么有关？',o:['带宽和信噪比', '只有噪声', '只有带宽', '带宽和码元数'],a:0,why:'香农：C = W·log₂(1 + S/N)。带宽越宽、信噪比越高，容量越大。它给出的是「有噪声时的理论上限」。'},
  {tag:'N6',subj:'net',q:'曼彻斯特编码的特点是？',o:['编码效率 100%', '每个比特中间都有跳变，自带时钟同步', '不需要时钟', '只能用于光纤'],a:1,why:'曼彻斯特编码用「高到低」表示 0、「低到高」表示 1（或相反），每个比特中间必有一次跳变，所以接收方能提取时钟。代价是波特率是数据率的 2 倍。'},
  {tag:'N6',subj:'net',q:'差分曼彻斯特编码相比曼彻斯特编码的优势是？',o:['抗干扰能力更强（看跳变而非电平）', '不需要时钟', '编码效率更高', '速度更快'],a:0,why:'差分曼彻斯特看的是「比特开始处有没有跳变」，而不是绝对电平高低。所以极性接反了也能正确解码，抗干扰更强。'},
  {tag:'N6',subj:'net',q:'基带传输和频带传输的区别是？',o:['基带直接传数字信号，频带要调制到载波上', '频带不需要调制', '两者一样', '基带更快'],a:0,why:'基带传输：数字信号直接送上线路（如以太网双绞线）。频带传输：把数字信号调制到模拟载波上（如 ADSL、WiFi）。'},
  {tag:'N6',subj:'net',q:'双绞线相比同轴电缆的优势是？',o:['带宽更高', '传输距离更远', '抗干扰更强', '成本低、易安装'],a:3,why:'双绞线便宜、柔软、易布线，是局域网主流。同轴抗干扰强、带宽高但贵且硬。光纤则是带宽和抗干扰都最强。'},
  {tag:'N6',subj:'net',q:'光纤通信的主要优势是？',o:['成本最低', '带宽极高、抗电磁干扰', '易弯曲', '不需要光源'],a:1,why:'光纤用光信号，带宽可达 Tbps，完全不受电磁干扰，传输距离远。缺点是接口贵、弯折半径有限。'},
  {tag:'N6',subj:'net',q:'信道复用技术中，TDM 是指？',o:['波分复用', '时分复用（不同时隙轮流用同一信道）', '码分复用', '频分复用'],a:1,why:'TDM 时分：把时间划成时隙，各用户轮流占用。FDM 频分：不同频段。WDM 波分：光纤里的不同波长。CDM 码分：不同编码序列。'},
  {tag:'N7',subj:'net',q:'数据链路层的三个基本功能是？',o:['封装成帧、差错控制、流量控制', '路由选择、拥塞控制、分片', '编码、调制、解调', '加密、压缩、认证'],a:0,why:'链路层负责「把网络层交下来的包变成帧发出去」，核心是三件事：加帧头帧尾（成帧）、检错（CRC）、控制发送速率（流量控制）。'},
  {tag:'N7',subj:'net',q:'「透明传输」中的「透明」是指？',o:['数据不可见', '加密传输', '数据里出现控制字符也不会被误判为帧边界', '无需校验'],a:2,why:'如果数据里恰好有和帧定界符相同的字节，会被误认为帧结束。解决办法：字节填充（加转义字符）或比特填充（插 0）。'},
  {tag:'N7',subj:'net',q:'PPP 协议主要用于？',o:['点对点链路（如拨号、专线）', '卫星通信', '局域网', '无线网络'],a:0,why:'PPP（点对点协议）用于两个节点之间的直连链路，如家庭宽带拨号。它支持多种网络层协议、有差错检测，但**不提供可靠传输**（不重传）。'},
  {tag:'N7',subj:'net',q:'HDLC 协议的帧定界方式是？',o:['特殊字符', '字节计数', '标志字段 01111110 + 比特填充', '长度字段'],a:2,why:'HDLC 用 01111110 作为帧的开始和结束标志。为了避免数据里出现同样的模式，发送方每遇到 5 个连续的 1 就插入一个 0（比特填充）。'},
  {tag:'N7',subj:'net',q:'停止-等待协议的效率低的原因是？',o:['每发一帧都要等确认，信道利用率低', '实现复杂', '不能检错', '不支持长距离'],a:0,why:'停止-等待：发一帧、等 ACK、再发下一帧。如果传播延迟大（如卫星链路），大部分时间都在等，利用率极低。改进：滑动窗口。'},
  {tag:'N7',subj:'net',q:'滑动窗口协议中，窗口大小的作用是？',o:['决定传输速率', '控制未确认帧的数量，实现流量控制', '决定重传次数', '决定帧长度'],a:1,why:'发送窗口 = 最多可以发多少帧还没被确认。窗口越大，吞吐量越高（流水线），但需要更多缓冲和序号空间。'},
  {tag:'N7',subj:'net',q:'后退 N 帧（GBN）和选择重传（SR）的区别是？',o:['两者一样', 'SR 不需要窗口', 'GBN 重传所有未确认帧，SR 只重传出错的帧', 'GBN 更快'],a:2,why:'GBN：一旦某帧超时，它之后的全部重传（简单但浪费）。SR：只重传出错的那一帧（高效但需要缓存和排序）。'},
  {tag:'N7',subj:'net',q:'CRC 能检测出什么类型的错误？',o:['不能检错', '只能检单比特', '所有错误', '突发长度不超过 r 的差错（r 是校验位长度）'],a:3,why:'CRC 的检错能力取决于生成多项式的阶数 r：能检出所有长度 ≤ r 的突发错误，以及大部分更长的错误。但理论上仍可能漏检。'},
  {tag:'N8',subj:'net',q:'CSMA/CD 中「冲突检测」的前提是？',o:['发送前先预约', '边发送边监听，信号强度异常就判定冲突', '接收方确认', '随机退避'],a:1,why:'CSMA/CD 要求收发共用一条总线，发送时同时监听线路。如果检测到的信号和自己发的不一致（叠加了别人的），就说明冲突。'},
  {tag:'N8',subj:'net',q:'CSMA/CA 与 CSMA/CD 的关键区别是？',o:['CA 更快', 'CA 是冲突避免（先预约/退避），CD 是冲突检测', '两者一样', 'CD 用于无线'],a:1,why:'无线网络无法边发边听（自己的信号会盖住别人的），所以改成「先避免冲突」：发送前先听、随机退避、用 RTS/CTS 预约信道。'},
  {tag:'N8',subj:'net',q:'二进制指数退避算法的作用是？',o:['冲突后随机等待，降低再次冲突的概率', '提高优先级', '减少延迟', '加快发送'],a:0,why:'冲突后随机等 0 到 2^k−1 个时隙（k 是重传次数），冲突越多等待范围越大，避免多个站点再次同时发送。'},
  {tag:'N8',subj:'net',q:'令牌环网中，「令牌」的作用是？',o:['同步时钟', '错误检测', '代表发送权，持有令牌才能发数据', '加密密钥'],a:2,why:'令牌环里只有一个令牌在环上转，谁拿到谁才能发。这样就从根本上避免了冲突（无冲突协议），但令牌丢失或重复会导致网络故障。'},
  {tag:'N8',subj:'net',q:'以太网使用的介质访问控制方法是？',o:['CSMA/CA', 'CSMA/CD', '令牌传递', 'TDMA'],a:1,why:'传统共享式以太网用 CSMA/CD。交换式以太网（现在的主流）每个端口独立冲突域，**不再需要 CSMA/CD**（全双工无冲突）。'},
  {tag:'N8',subj:'net',q:'为什么交换式以太网不需要 CSMA/CD？',o:['每个端口是独立冲突域，全双工时无冲突', '不需要 MAC', '交换机更快', '不需要帧'],a:0,why:'交换机为每个端口提供独立的冲突域，全双工模式下收发通道分离，不会冲突。所以现代以太网是「无冲突」的。'},
  {tag:'N8',subj:'net',q:'VLAN 之间通信需要什么设备？',o:['路由器或三层交换机', '集线器', '中继器', '二层交换机'],a:0,why:'VLAN 隔离了广播域，二层交换机不能跨 VLAN 转发。要让两个 VLAN 通信，需要三层设备（路由器或三层交换机）做路由。'},
  {tag:'N8',subj:'net',q:'STP（生成树协议）的作用是？',o:['分配 IP', '消除二层环路，防止广播风暴', '加密数据', '提高带宽'],a:1,why:'交换机之间如果有多条链路会形成环路，广播帧会无限循环（广播风暴）。STP 通过阻塞冗余链路，把网络变成无环的树。'},
  {tag:'N9',subj:'net',q:'以太网 MAC 帧的最小长度是？',o:['46 字节', '1518 字节', '64 字节', '18 字节'],a:2,why:'最小 64 字节（含 14 字节帧头 + 46 字节数据 + 4 字节 FCS）。这是 CSMA/CD 冲突检测的要求。最大 1518 字节（MTU 1500）。'},
  {tag:'N9',subj:'net',q:'以太网帧头中的「类型」字段的作用是？',o:['标识帧长度', '标识源地址', '标识优先级', '标识上层协议（如 IPv4、ARP）'],a:3,why:'类型字段（0x0800 = IPv4，0x0806 = ARP）告诉接收方把数据交给哪个上层协议。这是「多路复用/解复用」的体现。'},
  {tag:'N9',subj:'net',q:'交换机转发帧时，如果目的 MAC 不在转发表中，会？',o:['发给默认网关', '向除来源端口外的所有端口广播（泛洪）', '缓存等待', '丢弃'],a:1,why:'未知单播帧会泛洪（flooding）。交换机会学习源 MAC 建立转发表（源 MAC + 端口），下次就能直接转发。'},
  {tag:'N9',subj:'net',q:'交换机的「自学习」是指？',o:['学习路由协议', '自动协商速率', '记录源 MAC 和到达端口，建立转发表', '自动配置 IP'],a:2,why:'交换机收到帧时，把「源 MAC → 入端口」记入 MAC 地址表。之后收到发往该 MAC 的帧，就从这个端口转发，不用广播。'},
  {tag:'N9',subj:'net',q:'冲突域和广播域的区别是？',o:['冲突域更大', '冲突域是可能冲突的范围，广播域是广播帧能到达的范围', '广播域只在路由器上', '两者一样'],a:1,why:'集线器：所有端口一个冲突域。交换机：每个端口一个冲突域，但所有端口同一个广播域。路由器：每个接口一个广播域。'},
  {tag:'N9',subj:'net',q:'全双工以太网中，一对双绞线的作用是？',o:['一根发、一根收，可同时双向传输', '两根都发', '两根都收', '只用于供电'],a:0,why:'全双工需要收发分离的通道：1-2 用于发送，3-6 用于接收。半双工则共用一对线（所以会冲突）。'},
  {tag:'N9',subj:'net',q:'以太网使用什么编码方式（100BASE-TX）？',o:['4B/5B 或 MLT-3', '曼彻斯特编码', '差分曼彻斯特', 'NRZ'],a:0,why:'10BASE-T 用曼彻斯特编码。100BASE-TX 用 4B/5B + MLT-3（效率更高）。千兆以太网用 8B/10B 或 PAM-5。'},
  {tag:'N9',subj:'net',q:'网桥和交换机的区别是？',o:['网桥更快', '交换机不能隔离冲突域', '交换机是多端口的网桥，硬件转发更快', '网桥不需要 MAC'],a:2,why:'网桥（bridge）通常是 2 端口，软件转发。交换机（switch）是多端口网桥，用 ASIC 硬件转发，速度快得多。本质功能相同。'},
  {tag:'N10',subj:'net',q:'802.11 无线局域网使用的介质访问控制是？',o:['CSMA/CA', 'TDMA', 'CSMA/CD', '令牌传递'],a:0,why:'无线无法边发边听（自己的信号太强会盖住别人的），所以用 CSMA/CA：先听、随机退避、可选 RTS/CTS 预约。'},
  {tag:'N10',subj:'net',q:'802.11 中 RTS/CTS 机制解决什么问题？',o:['隐藏终端问题', '功耗问题', '路由问题', '加密问题'],a:0,why:'隐藏终端：A 和 C 都能和 B 通信，但彼此听不到，同时发送会在 B 处冲突。RTS/CTS 让 B 广播「我要占用信道」，A 和 C 都能听到。'},
  {tag:'N10',subj:'net',q:'无线网络的「隐藏终端」和「暴露终端」分别指？',o:['加密 / 解密', '上行 / 下行', '信号弱 / 信号强', '听不到发送方 / 误以为信道忙而不敢发'],a:3,why:'隐藏终端：听不到对方，会冲突。暴露终端：听到了但实际不会冲突，白白等待（浪费机会）。'},
  {tag:'N10',subj:'net',q:'802.11 帧的地址字段有几个？',o:['2 个', '最多 4 个（源、目的、AP 地址等）', '3 个', '1 个'],a:1,why:'802.11 帧有 4 个地址字段：源地址、目的地址、发送方 AP 地址、接收方 AP 地址。因为无线要经过 AP 转发，地址关系比以太网复杂。'},
  {tag:'N10',subj:'net',q:'蓝牙使用的拓扑结构是？',o:['主从式（微微网 piconet）', '环型', '网状', '总线型'],a:0,why:'蓝牙是主从结构：一个主设备最多连 7 个从设备，组成微微网（piconet）。多个微微网可以组成散射网（scatternet）。'},
  {tag:'N10',subj:'net',q:'无线网络的「漫游」是指？',o:['切换频段', '换 IP 地址', '重新拨号', '设备从一个 AP 切换到另一个 AP 而不断连接'],a:3,why:'漫游让移动设备在不同 AP 覆盖区之间平滑切换（同一 ESSID 下）。切换过程中连接会短暂中断，快速漫游协议（802.11r）可减少中断。'},
  {tag:'N10',subj:'net',q:'5GHz 相比 2.4GHz 的优势和劣势是？',o:['都更好', '都更差', '没有区别', '速率高、干扰少，但穿墙差、覆盖小'],a:3,why:'5GHz 频段宽、干扰源少 → 速率高。但波长短，穿透和绕射能力差 → 覆盖范围小。2.4GHz 相反：覆盖广但拥挤（微波炉、蓝牙都在这）。'},
  {tag:'N10',subj:'net',q:'无线信号强度通常用什么单位？',o:['Hz', 'V', 'bps', 'dBm'],a:3,why:'dBm 是相对于 1mW 的分贝值。−30dBm 很强，−90dBm 几乎连不上。每降 3dB 功率减半，每降 10dB 距离大约减到 1/3。'},
  {tag:'A6',subj:'coa',q:'Cache 容量 64KB，块大小 64B，采用直接映射，共有多少个块？',o:['1024', '16', '4096', '64'],a:0,why:'块数 = 容量 / 块大小 = 64KB / 64B = 1024 块。直接映射时，主存块号 mod 1024 决定放在 Cache 的哪一块。'},
  {tag:'A6',subj:'coa',q:'直接映射 Cache 的缺点是？',o:['冲突率高（多个主存块映射到同一 Cache 块）', '速度慢', '不能写', '容量小'],a:0,why:'直接映射：每个主存块只能放一个固定位置，多个块争同一位置就会互相替换（冲突缺失）。全相联没有这个问题但成本高。'},
  {tag:'A6',subj:'coa',q:'主存容量扩展到 4GB，需要多少根地址线？',o:['30', '32', '16', '34'],a:1,why:'4GB = 2^32 字节，按字节编址需要 32 根地址线。若按字（4B）编址则只需 30 根。'},
  {tag:'A6',subj:'coa',q:'DRAM 需要刷新的原因是？',o:['用电容存电荷，会逐渐漏电', '速度快', '容量小', '成本高'],a:0,why:'DRAM 每个存储单元是一个电容 + 一个晶体管，电容会漏电，必须周期性刷新（通常 2ms 一次）。这也是它比 SRAM 慢的原因。'},
  {tag:'A6',subj:'coa',q:'存储器芯片扩展中，「位扩展」是指？',o:['增加存储单元数', '增加刷新频率', '增加数据位数（字长），地址线共用', '增加芯片数量'],a:2,why:'位扩展：多片并联，地址线共用，数据线分别连不同位（如 8 片 1 位芯片组成 8 位）。字扩展：地址空间变大。'},
  {tag:'A6',subj:'coa',q:'Cache 的写回策略需要什么额外信息？',o:['有效位', '访问计数', '校验位', '脏位（dirty bit），标记该块是否被修改'],a:3,why:'写回法只在块被替换时才写回主存，所以要用脏位记录「这块改过没有」。写直达不需要（每次都写主存）。'},
  {tag:'A6',subj:'coa',q:'多体交叉存储器的作用是？',o:['减少刷新', '增加容量', '降低成本', '提高主存的带宽（并行访问多个体）'],a:3,why:'把主存分成多个体（bank），连续地址分布在不同体。CPU 可以并行访问不同体，提高吞吐量。注意：单次访问延迟不变。'},
  {tag:'A6',subj:'coa',q:'虚拟存储器和 Cache 的主要区别是？',o:['Cache 由硬件管理，虚存由 OS 管理', '速度不同', '都用 SRAM', '容量不同'],a:0,why:'Cache 全硬件实现（对程序员透明），虚存靠 OS + MMU（页表、缺页中断）。两者的目标相同：用小的快存储模拟大的慢存储。'},
  {tag:'A7',subj:'coa',q:'某指令系统有 8 位操作码，最多能定义多少条指令？',o:['8', '64', '128', '256'],a:3,why:'8 位操作码可以表示 2^8 = 256 种不同的操作。实际设计中会用扩展操作码技术，让不同指令用不同长度的操作码。'},
  {tag:'A7',subj:'coa',q:'「扩展操作码」技术的作用是？',o:['加快译码', '在指令字长固定时，让不同指令有不同长度的操作码', '增加寻址方式', '减少指令数'],a:1,why:'短操作码给常用指令（留出更多地址位），长操作码给不常用指令。关键是保证「短操作码不能是长操作码的前缀」（否则译码有歧义）。'},
  {tag:'A7',subj:'coa',q:'一条 16 位指令，操作码 4 位，两个地址码各 6 位，能寻址多少种操作？',o:['8', '16', '64', '256'],a:1,why:'4 位操作码 → 2^4 = 16 种操作。地址码 6 位 → 每个地址能寻址 2^6 = 64 个单元。'},
  {tag:'A7',subj:'coa',q:'「一地址指令」通常隐含使用哪个寄存器？',o:['程序计数器 PC', '累加器 ACC', '指令寄存器 IR', '栈指针 SP'],a:1,why:'一地址指令如 `ADD X`，实际是 `ACC ← ACC + X`，另一个操作数和结果都在累加器里。这是早期计算机的典型设计。'},
  {tag:'A7',subj:'coa',q:'「零地址指令」的典型例子是？',o:['加载', '加法', '跳转', '堆栈操作（如 PUSH/POP、ADD 栈顶两元素）'],a:3,why:'零地址指令不需要地址码，操作数隐含在堆栈中。如栈顶两个元素相加，结果压回栈顶。RISC 和栈式计算机常用。'},
  {tag:'A7',subj:'coa',q:'指令的「地址码」字段长度决定了？',o:['指令长度', '操作种类', '能直接寻址的范围', '执行时间'],a:2,why:'n 位地址码能直接寻址 2^n 个单元。要访问更大空间需要间接寻址或基址寻址。'},
  {tag:'A7',subj:'coa',q:'「寄存器寻址」相比「直接寻址」的优势是？',o:['编码短', '精度高', '不用访存，速度快', '地址空间大'],a:2,why:'寄存器寻址的操作数在寄存器里，不需要访问内存（省一次访存）。这也是 RISC 强调「多寄存器」的原因。'},
  {tag:'A7',subj:'coa',q:'「相对寻址」的有效地址是？',o:['变址寄存器 + 偏移', '形式地址本身', 'PC 当前值 + 形式地址（偏移量）', '基址寄存器 + 偏移'],a:2,why:'相对寻址：EA = (PC) + A。常用于跳转指令（相对跳转），好处是程序整体搬迁后偏移量不变（位置无关代码）。'},
  {tag:'A8',subj:'coa',q:'CPU 中「数据通路」是指？',o:['时钟信号线', '控制信号的集合', '指令的存储位置', '数据在部件之间传输的路径'],a:3,why:'数据通路包括 ALU、寄存器、总线、多路选择器等，负责数据的流动和运算。控制器负责产生控制信号指挥数据通路。'},
  {tag:'A8',subj:'coa',q:'「硬布线控制器」和「微程序控制器」的区别是？',o:['硬布线更慢', '硬布线用组合逻辑电路，微程序用存储在 ROM 里的微指令', '微程序不能修改', '两者一样'],a:1,why:'硬布线：速度快但设计复杂、不易修改（RISC 常用）。微程序：用微指令序列实现，灵活易改但慢一些（CISC 常用）。'},
  {tag:'A8',subj:'coa',q:'「微指令」和「机器指令」的关系是？',o:['一条机器指令由若干条微指令解释执行', '两者相同', '微指令更高级', '机器指令由微指令组成一条'],a:0,why:'机器指令是程序员看到的指令（如 ADD），微指令是硬件级的控制信号组合。一条机器指令对应一段微程序（多条微指令）。'},
  {tag:'A8',subj:'coa',q:'「指令寄存器 IR」的作用是？',o:['存放下一条指令地址', '存放状态标志', '存放当前正在执行的指令', '存放运算结果'],a:2,why:'IR 保存从内存取出的当前指令，供译码器分析。PC 存的是下一条指令的地址（不是当前指令）。'},
  {tag:'A8',subj:'coa',q:'「标志寄存器（PSW）」中通常不包含？',o:['溢出标志 OF', '零标志 ZF', '指令操作码', '进位标志 CF'],a:2,why:'PSW 存的是「状态标志」（CF、ZF、OF、SF）和「控制位」（中断允许）。操作码在 IR 里，不在 PSW。'},
  {tag:'A8',subj:'coa',q:'CPU 执行指令的基本流程是？',o:['取指 → 执行 → 译码', '执行 → 取指 → 译码', '译码 → 取指 → 执行', '取指 → 译码 → 执行 → 访存 → 写回'],a:3,why:'经典五阶段：取指（IF）、译码（ID）、执行（EX）、访存（MEM）、写回（WB）。这也是五段流水线的基础。'},
  {tag:'A8',subj:'coa',q:'「中断」发生时，CPU 首先要做的是？',o:['执行中断服务程序', '返回主程序', '保存当前程序的现场（PC、寄存器）', '清除中断标志'],a:2,why:'中断响应：① 关中断；② 保存断点（PC）和现场；③ 查中断向量表；④ 转去执行中断服务程序。返回时恢复现场。'},
  {tag:'A8',subj:'coa',q:'「DMA」方式下，数据传送的控制者是？',o:['中断服务程序', 'CPU', '操作系统', 'DMA 控制器（不经过 CPU）'],a:3,why:'DMA 控制器接管总线，直接在设备和内存之间传数据。CPU 只在开始（设置参数）和结束（处理中断）时参与。'},
  {tag:'A9',subj:'coa',q:'五段流水线执行 100 条指令，理想情况下需要多少个时钟周期？',o:['100', '500', '104', '105'],a:2,why:'公式：k + (n−1) = 5 + 99 = 104 个周期。前 5 个周期流水线被填满，之后每个周期完成一条。加速比 = 500/104 ≈ 4.8。'},
  {tag:'A9',subj:'coa',q:'流水线的「结构冒险」是指？',o:['多条指令同时争用同一硬件资源', '分支跳转', '数据依赖', '中断'],a:0,why:'结构冒险（资源冲突）：如只有一套存储器，取指和访存同时要用。解决办法：分离指令/数据 Cache（哈佛结构）、增加资源。'},
  {tag:'A9',subj:'coa',q:'「转发（旁路）」技术解决什么冒险？',o:['数据冒险（RAW）', '控制冒险', '结构冒险', '中断'],a:0,why:'数据冒险：后一条指令要用前一条还没写回的结果。转发让 ALU 的输出直接送给下一条指令的输入，不用等写回寄存器。'},
  {tag:'A9',subj:'coa',q:'「分支预测」的作用是？',o:['提高时钟频率', '增加缓存', '减少指令数', '减少控制冒险带来的流水线停顿'],a:3,why:'分支指令要等结果才知道下一条取哪。分支预测猜一个方向继续取指，猜对了流水线不断，猜错了要清空（冲刷）。'},
  {tag:'A9',subj:'coa',q:'「超标量」处理器是指？',o:['每个周期可以发射多条指令', '缓存超大', '时钟频率超高', '指令字超长'],a:0,why:'超标量：一个周期内并行发射多条指令（多条流水线）。需要硬件动态调度（乱序执行）来发现并行性。'},
  {tag:'A9',subj:'coa',q:'「流水线深度增加」的代价是？',o:['流水寄存器开销增加、冒险惩罚变大', '缓存变小', '指令变多', '速度变慢'],a:0,why:'段数越多，每段做的事越少（时钟可以更快），但流水寄存器开销占比上升，且分支预测失败时要冲刷更多段（惩罚更大）。'},
  {tag:'A9',subj:'coa',q:'「乱序执行」的目的是？',o:['在等待某条指令时先执行后面不相关的指令', '打乱程序语义', '减少指令数', '提高时钟频率'],a:0,why:'乱序执行让 CPU 在等待（如访存）时执行后面没有依赖的指令，提高利用率。但必须保证「最终结果」和顺序执行一致（用重排序缓冲）。'},
  {tag:'A9',subj:'coa',q:'流水线的「吞吐率」和「延迟」的关系是？',o:['没有关系', '只降低延迟', '两者都提高', '流水线提高吞吐率，但不降低单条指令的延迟'],a:3,why:'流水线让多条指令重叠执行，单位时间完成更多（吞吐率高）。但单条指令从进入到完成的时间（延迟）没变，甚至因流水寄存器略增。'},
  {tag:'A10',subj:'coa',q:'总线的「带宽」是指？',o:['单位时间传输的数据量', '总线的长度', '时钟频率', '连接的设备数'],a:0,why:'带宽 = 总线宽度（字节）× 频率。如 32 位总线 @ 100MHz，带宽 = 4B × 100M = 400MB/s。'},
  {tag:'A10',subj:'coa',q:'「同步总线」和「异步总线」的区别是？',o:['异步不需要协议', '两者一样', '同步用统一时钟，异步用握手信号', '同步更快'],a:2,why:'同步总线：所有设备按同一时钟节拍通信（简单快，但受最慢设备限制）。异步总线：用请求/应答握手（灵活，适应不同速度设备）。'},
  {tag:'A10',subj:'coa',q:'「总线仲裁」的作用是？',o:['加密数据', '分配中断号', '分配内存', '决定哪个设备获得总线使用权'],a:3,why:'多个设备同时请求总线时，需要仲裁决定谁先用。方式：链式查询、计数器定时查询、独立请求。'},
  {tag:'A10',subj:'coa',q:'「集中式仲裁」的三种方式是？',o:['串行、并行、混合', '链式查询、计数器定时查询、独立请求', '同步、异步、半同步', '轮询、中断、DMA'],a:1,why:'链式查询：简单但优先级固定、对故障敏感。计数器定时：较公平。独立请求：最快但线多。'},
  {tag:'A10',subj:'coa',q:'「中断向量」的作用是？',o:['记录中断次数', '提供中断服务程序的入口地址', '设置优先级', '屏蔽中断'],a:1,why:'每个中断号对应一个向量（入口地址），CPU 响应中断后查表跳转。向量表通常放在内存低地址区。'},
  {tag:'A10',subj:'coa',q:'「中断嵌套」是指？',o:['中断反复发生', '中断被屏蔽', '多个中断同时发生', '高优先级中断可以打断低优先级的中断服务'],a:3,why:'中断嵌套需要：① 中断优先级；② 响应高优先级时允许再中断（开中断）。这样紧急事件能得到及时处理。'},
  {tag:'A10',subj:'coa',q:'「程序查询（轮询）」方式的缺点是？',o:['速度太快', '不能传数据', 'CPU 一直忙等，利用率低', '需要中断'],a:2,why:'轮询：CPU 反复检查设备状态，直到就绪。CPU 全程被占用（忙等），效率极低。改进：中断方式、DMA。'},
  {tag:'A10',subj:'coa',q:'「通道（I/O 处理器）」相比 DMA 的优势是？',o:['不需要 CPU', '能执行通道程序，控制多台设备的复杂 I/O', '不需要内存', '速度更快'],a:1,why:'通道是一个小型的 I/O 处理器，能执行通道程序（一组 I/O 指令），管理多台设备。DMA 只能传数据块，通道能处理更复杂的 I/O 流程。'},
  {tag:'A6',subj:'coa',q:'存储器的层次结构中，速度从快到慢、容量从小到大依次是？',o:['寄存器 → Cache → 主存 → 辅存', '辅存 → 主存 → Cache', '主存 → Cache → 寄存器', 'Cache → 寄存器 → 主存 → 辅存'],a:0,why:'越靠近 CPU 越快越贵越小。寄存器 > Cache > 主存 > 磁盘 > 磁带。上一层是下一层的缓存，靠局部性原理提升整体性能。'},
  {tag:'A6',subj:'coa',q:'程序访问的局部性原理包括？',o:['快和慢', '读和写', '时间局部性和空间局部性', '顺序性和随机性'],a:2,why:'时间局部性：刚访问的很快会再访问（循环变量）。空间局部性：相邻地址会被访问（数组遍历）。这是 Cache 和虚拟存储的理论基础。'},
  {tag:'A6',subj:'coa',q:'存储器的「存取周期」是指？',o:['连续两次访问所需的最小时间间隔', '刷新周期', '读写一次的时间', '容量/带宽'],a:0,why:'存取时间（访问时间）是读一次的时间，存取周期是两次访问之间的最小间隔（含恢复时间）。所以 存取周期 > 存取时间。'},
  {tag:'A6',subj:'coa',q:'DRAM 需要刷新的原因是？',o:['电压不稳', '元件发热', '用电容存电荷，会漏电', '时钟不同步'],a:2,why:'DRAM 的存储单元是电容，电荷会泄漏（毫秒级）。必须周期性刷新（读出再写回）才能保持数据。这也是 DRAM 比 SRAM 慢的原因之一。'},
  {tag:'A6',subj:'coa',q:'存储器带宽的单位通常是？',o:['Hz', '字节/秒或位/秒', '秒', '字节'],a:1,why:'带宽 = 数据宽度 / 存取周期。比如 64 位宽、存取周期 10ns，带宽 = 8B / 10ns = 800MB/s。'},
  {tag:'A6',subj:'coa',q:'「多体交叉存储」的作用是？',o:['增加容量', '降低成本', '提高存储器的带宽（并行访问多个体）', '减少功耗'],a:2,why:'把存储器分成多个体，连续地址分布在不同体上。CPU 连续访问时，可以流水线地并行读多个体，带宽成倍提升。'},
  {tag:'A6',subj:'coa',q:'CPU 访问存储器时，「字」和「字节」的关系是？',o:['没有关系', '字通常是字节的整数倍（如 4 字节或 8 字节）', '字比字节小', '字等于字节'],a:1,why:'字是 CPU 一次处理的数据单位（字长），通常是字节的 2/4/8 倍。按字编址和按字节编址的地址换算要注意。'},
  {tag:'A6',subj:'coa',q:'为什么 Cache 能提升性能但成本高？',o:['用磁盘', '用 DRAM', '用寄存器', '用 SRAM（快但贵），只存常用数据'],a:3,why:'Cache 用 SRAM（速度快、不需刷新、贵、密度低）。如果全用 SRAM 做主存成本太高，所以只做小容量缓存，靠局部性覆盖大部分访问。'},
  {tag:'A7',subj:'coa',q:'直接映射 Cache 的特点是？',o:['组内任意', '按需分配', '每个主存块只能放到固定的一个 Cache 行', '任意位置'],a:2,why:'直接映射：Cache 行号 = 主存块号 % Cache 行数。简单、快、成本低，但冲突率高（多个块争同一行会互相替换）。'},
  {tag:'A7',subj:'coa',q:'全相联映射的优缺点分别是？',o:['不需要标记', '速度最快', '冲突率最低，但比较器多、成本高', '最简单但冲突多'],a:2,why:'全相联：主存块可以放任意 Cache 行。灵活、命中率高，但查找时要和所有标记并行比较（硬件成本高），只适合小容量 Cache。'},
  {tag:'A7',subj:'coa',q:'组相联映射是哪种方式的折中？',o:['完全是直接映射', '完全是全相联', '组间直接映射，组内全相联', '组间全相联，组内直接'],a:2,why:'组相联：先按「组号 = 块号 % 组数」定位到组（直接映射），再在组内找空位或替换（全相联）。4 路组相联就是每组 4 行。'},
  {tag:'A7',subj:'coa',q:'Cache 中「标记（tag）」的作用是？',o:['判断 Cache 行里存的是不是要找的主存块', '存储地址', '存储数据', '存储状态'],a:0,why:'标记存的是主存块号的高位部分。查找时比较标记：相等且有效位为 1，才算命中。低位（块内偏移）用来定位块内字节。'},
  {tag:'A7',subj:'coa',q:'Cache 替换算法中，FIFO 的缺点是？',o:['实现复杂', '命中率最高', '需要额外空间', '可能替换掉常用的块（不反映访问频率）'],a:3,why:'FIFO 按进入顺序替换，不考虑访问频率。刚进来的块可能马上被换掉（即使它很常用）。LRU 更符合局部性，但实现开销大。'},
  {tag:'A7',subj:'coa',q:'写回法（Write Back）需要什么额外位？',o:['校验位', '脏位（Dirty Bit）', '标记位', '有效位'],a:1,why:'写回法只写 Cache，块被替换时才写回主存。脏位记录「这个块被改过没有」——改过才需要写回，没改过直接丢弃。'},
  {tag:'A7',subj:'coa',q:'Cache 命中率的计算公式是？',o:['1 / 访问时间', 'Cache 容量 / 主存容量', '命中次数 / 总访问次数', '命中次数 / 未命中次数'],a:2,why:'命中率 H = 命中次数 / 总次数。平均访问时间 = H×Tc + (1−H)×Tm（Tc 是 Cache 时间，Tm 是主存时间）。'},
  {tag:'A7',subj:'coa',q:'如果 Cache 命中率 95%，Cache 访问 1ns，主存访问 100ns，平均访问时间约是？',o:['约 100ns', '约 50ns', '约 6ns', '约 1ns'],a:2,why:'平均 = 0.95×1 + 0.05×100 = 0.95 + 5 = 5.95ns ≈ 6ns。注意未命中的 5% 贡献了大部分时间——这就是为什么命中率要尽量高。'},
  {tag:'A8',subj:'coa',q:'存储器扩展中，位扩展和字扩展的区别是？',o:['位扩展增加容量', '位扩展增加字长，字扩展增加存储单元数', '两者一样', '字扩展增加字长'],a:1,why:'位扩展：多片并联，每片贡献几位（如 8 片 1 位芯片组成 8 位字长）。字扩展：用高位地址译码选片，增加存储单元数。'},
  {tag:'A8',subj:'coa',q:'用 2K×4 位芯片组成 8K×8 位存储器，需要几片？',o:['8 片', '4 片', '16 片', '2 片'],a:0,why:'位方向：8/4 = 2 片并联。字方向：8K/2K = 4 组。共 2×4 = 8 片。这是「先位扩展再字扩展」的典型计算。'},
  {tag:'A8',subj:'coa',q:'内存条上的「双通道」是指？',o:['两个 CPU', '两条内存条', '两个内存控制器并行工作，带宽翻倍', '两种频率'],a:2,why:'双通道让两个内存控制器同时读写不同的内存条，理论带宽翻倍。需要成对安装（同容量同频率）才能生效。'},
  {tag:'A8',subj:'coa',q:'DRAM 的刷新方式中，「集中刷新」的缺点是？',o:['刷新期间不能访问存储器（死区）', '实现复杂', '刷新太频繁', '功耗高'],a:0,why:'集中刷新：在一段时间内集中刷新所有行，期间 CPU 不能访存（死时间）。分散刷新：每个存取周期后刷新一行（无死区但周期变长）。'},
  {tag:'A8',subj:'coa',q:'存储器芯片的「地址线」和「数据线」分别决定？',o:['速度', '字长和容量', '容量（多少单元）和字长（每单元几位）', '功耗'],a:2,why:'n 根地址线 → 2^n 个单元。m 根数据线 → 每单元 m 位。所以芯片容量 = 2^n × m 位。'},
  {tag:'A8',subj:'coa',q:'ROM 和 RAM 的关键区别是？',o:['RAM 不能读', '断电后 ROM 数据不丢失，RAM 丢失', 'ROM 更快', 'ROM 不能写'],a:1,why:'RAM 是易失性存储器（断电丢失），ROM 是非易失的（断电保留）。Flash 介于两者之间：可读写、断电保留，但有擦写次数限制。'},
  {tag:'A8',subj:'coa',q:'「存储周期」和「总线周期」的关系是？',o:['没有关系', '存储周期通常大于等于总线周期', '存储周期更小', '两者相等'],a:1,why:'存储器存取周期可能比总线周期长，这时 CPU 要插入等待周期（wait state）来匹配速度。这是「存储器慢」的直接体现。'},
  {tag:'A8',subj:'coa',q:'闪存（Flash）的擦写单位是？',o:['字节', '位', '字', '块（Block），不能单字节改写'],a:3,why:'Flash 读可以按字节，但写之前必须先擦除整块（几十到几百 KB）。这是 SSD 需要「垃圾回收」和「磨损均衡」的原因。'},
  {tag:'A9',subj:'coa',q:'虚拟存储中，「页表」的作用是？',o:['记录虚拟页到物理页的映射', '记录文件', '记录程序代码', '记录中断'],a:0,why:'页表把虚拟地址的页号映射到物理内存的页框号。每个进程一张页表，由操作系统维护，硬件（MMU）查表转换。'},
  {tag:'A9',subj:'coa',q:'TLB 未命中时，地址转换需要几次访存？',o:['两次（查页表一次 + 取数据一次）', '三次', '零次', '一次'],a:0,why:'TLB 未命中：先访问内存中的页表（1 次），拿到物理地址后再访问数据（1 次），共 2 次。TLB 命中则只需 1 次。'},
  {tag:'A9',subj:'coa',q:'「缺页」发生时，CPU 会？',o:['终止程序', '触发缺页异常，操作系统从磁盘调入页面后重新执行指令', '继续执行', '跳过这条指令'],a:1,why:'缺页是「要访问的页不在内存」。OS 从磁盘读入（可能还要换出一页），更新页表，然后**重新执行**那条引发缺页的指令。'},
  {tag:'A9',subj:'coa',q:'页表项中「有效位」的作用是？',o:['标识读写权限', '标识该页是否在内存中', '标识是否被修改', '标识是否被访问'],a:1,why:'有效位（存在位）= 1 表示页在内存，= 0 表示在磁盘（访问会触发缺页）。还有访问位（给 LRU 用）和脏位（给写回用）。'},
  {tag:'A9',subj:'coa',q:'「多级页表」的作用是？',o:['增加容量', '简化实现', '减少页表占用的内存（只存用到的部分）', '加快转换'],a:2,why:'单级页表要为整个虚拟地址空间建表（很大且大部分不用）。多级页表按需分配：只有用到的二级页表才存在，大幅节省内存。'},
  {tag:'A9',subj:'coa',q:'虚拟存储中，「工作集」是指？',o:['页表大小', '磁盘上的页面', '所有页面', '进程在一段时间内频繁访问的页面集合'],a:3,why:'工作集（Working Set）是最近 Δ 时间内访问过的页集合。如果分配的页框少于工作集，就会频繁缺页（抖动）。'},
  {tag:'A9',subj:'coa',q:'「写时复制」（Copy-on-Write）的作用是？',o:['加密', '加快读', '节省磁盘', 'fork 时共享页面，真正写入时才复制'],a:3,why:'fork 创建子进程时不立即复制地址空间，而是共享同一份（只读）。当任一进程要写某页时，才复制该页。大幅加快 fork 速度。'},
  {tag:'A9',subj:'coa',q:'虚拟地址空间的大小由什么决定？',o:['磁盘大小', '物理内存大小', 'CPU 的地址位数（如 32 位 → 4GB）', '页表大小'],a:2,why:'32 位 CPU 的虚拟地址空间是 2^32 = 4GB（每进程）。物理内存可以比这少（靠虚拟存储），也可以比这多（多进程共享）。'},
  {tag:'A10',subj:'coa',q:'磁盘的存取时间由哪几部分组成？',o:['只有寻道', '寻道时间 + 旋转延迟 + 传输时间', '只有传输', '只有旋转'],a:1,why:'寻道时间（磁头移动到磁道）通常最长（毫秒级），旋转延迟（等扇区转到磁头下）平均是半圈时间，传输时间最短。'},
  {tag:'A10',subj:'coa',q:'磁盘转速 7200rpm，平均旋转延迟约是？',o:['约 8.3ms', '约 1ms', '约 16ms', '约 4.2ms'],a:3,why:'7200 转/分 = 120 转/秒，一圈 8.33ms。平均旋转延迟 = 半圈 = 4.17ms。这是「平均」而非最坏情况。'},
  {tag:'A10',subj:'coa',q:'RAID 0 的特点是？',o:['最可靠', '镜像', '校验盘', '条带化，速度快但无冗余（坏一块全丢）'],a:3,why:'RAID 0 把数据分散到多块盘（条带），并行读写速度最快，容量利用率 100%。但没有任何冗余，任何一块坏了数据全丢。'},
  {tag:'A10',subj:'coa',q:'RAID 5 相比 RAID 1 的优势是？',o:['更快', '空间利用率高（校验分布在各盘）', '更简单', '更安全'],a:1,why:'RAID 1 镜像：利用率 50%。RAID 5：N 块盘用 1 块的容量存校验（分布式），利用率 (N−1)/N，且能容忍 1 块盘故障。'},
  {tag:'A10',subj:'coa',q:'SSD 相比 HDD 的优势和劣势是？',o:['随机读写快、无噪音，但写入寿命有限、单位容量贵', '全面更好', '没有区别', '全面更差'],a:0,why:'SSD 无机械部件，随机访问快（微秒级 vs 毫秒级）。但 Flash 有擦写次数限制（需要磨损均衡），且大容量时价格高。'},
  {tag:'A10',subj:'coa',q:'磁盘调度算法中，SCAN（电梯算法）的特点是？',o:['按请求顺序', '随机', '总是选最近的', '磁头单向移动到底再反向，像电梯'],a:3,why:'SCAN 沿一个方向服务所有请求，到头后反向。避免了 SSTF 的饥饿问题，但中间磁道被服务次数多（边缘等待久）。'},
  {tag:'A10',subj:'coa',q:'磁盘的「格式化容量」小于「非格式化容量」的原因是？',o:['需要存储扇区头尾、校验码、间隙等控制信息', '厂商虚标', '单位换算', '压缩'],a:0,why:'非格式化容量是磁介质理论能存的数据量。格式化要划分扇区，每个扇区要留出间隙、地址标记、校验码，所以实际可用容量更小。'},
  {tag:'A10',subj:'coa',q:'「磁盘缓存」的作用是？',o:['降低噪音', '缓冲读写，减少机械操作次数', '增加容量', '提高转速'],a:1,why:'磁盘控制器有缓存（几 MB 到几百 MB），预读相邻扇区、延迟写入。能大幅减少机械寻道和旋转等待的次数。'},
  {tag:'A10',subj:'coa',q:'固态硬盘的「磨损均衡」是为了解决？',o:['发热', '速度慢', 'Flash 块擦写次数有限，要均匀使用', '容量小'],a:2,why:'每个 Flash 块的擦写次数有限（几千到几万次）。磨损均衡让写入分散到不同块，避免某些块先坏。分动态和静态两种策略。'},
  {tag:'M6',subj:'math',q:'二元函数 z=f(x,y) 在某点可微的充分条件是？',o:['函数有界', '函数连续', '偏导数存在', '偏导数在该点连续'],a:3,why:'可微的必要条件：连续、偏导存在。充分条件：**偏导数连续** → 一定可微。注意偏导存在不等于可微。'},
  {tag:'M6',subj:'math',q:'二元函数极值的必要条件是？',o:['二阶导为 0', '两个偏导数都为 0（或不存在）', '函数连续', '只有一个偏导为 0'],a:1,why:'极值点的必要条件：f_x = 0 且 f_y = 0（驻点）。但驻点不一定是极值点，还要用二阶判别式判断。'},
  {tag:'M6',subj:'math',q:'二元函数极值的充分条件中，AC − B² < 0 表示？',o:['极大值', '无法判断', '不是极值点（鞍点）', '极小值'],a:2,why:'设 A=f_xx, B=f_xy, C=f_yy。AC−B²>0 且 A>0 → 极小；A<0 → 极大。AC−B²<0 → 鞍点（不是极值）。=0 时要另判。'},
  {tag:'M6',subj:'math',q:'条件极值常用的方法是？',o:['泰勒展开', '分部积分', '拉格朗日乘数法', '洛必达法则'],a:2,why:'求 z=f(x,y) 在约束 g(x,y)=0 下的极值：构造 L = f + λg，对各变量求偏导为 0，解出驻点。λ 叫拉格朗日乘数。'},
  {tag:'M6',subj:'math',q:'全微分 dz 的定义是？',o:['f_x + f_y', 'f_x·dx + f_y·dy', 'dx·dy', 'f_xx·dx + f_yy·dy'],a:1,why:'全微分 dz = f_x dx + f_y dy（对二元）。它描述函数值的线性主部，可微时 dz 与 Δz 的差是高阶无穷小。'},
  {tag:'M6',subj:'math',q:'隐函数求导中，F(x,y)=0 确定的 y=f(x)，dy/dx 等于？',o:['−F_x / F_y', '−F_y / F_x', 'F_y / F_x', 'F_x / F_y'],a:0,why:'隐函数求导公式：dy/dx = −F_x/F_y（F_y ≠ 0）。注意有负号，这是最容易错的符号问题。'},
  {tag:'M6',subj:'math',q:'二元函数 z=xy 在点 (1,1) 处的两个偏导数是？',o:['f_x=0, f_y=0', 'f_x=1, f_y=1', 'f_x=y, f_y=x', 'f_x=1, f_y=0'],a:1,why:'f_x = y（对 x 求导时 y 当常数），在 (1,1) 处 = 1。f_y = x，也是 1。偏导就是「固定其他变量求导」。'},
  {tag:'M6',subj:'math',q:'方向导数的最大值出现在？',o:['沿 x 轴方向', '沿梯度的方向', '沿等高线方向', '任意方向'],a:1,why:'方向导数 = 梯度与单位方向向量的点积。当方向与梯度同向时取最大值，且最大值等于梯度的模。'},
  {tag:'M7',subj:'math',q:'二重积分化为累次积分时，积分次序的选择依据是？',o:['随便选', '先 x 后 y 总是对的', '看被积函数', '看积分区域的形状，哪个方向更好描述'],a:3,why:'选次序要让「内层积分的上下限是常数或简单函数」。区域是 X 型（竖条）就先对 y 积，Y 型（横条）就先对 x 积。'},
  {tag:'M7',subj:'math',q:'极坐标下二重积分的面积元素是？',o:['r²·dr·dθ', 'dr/dθ', 'r·dr·dθ', 'dr·dθ'],a:2,why:'极坐标 x=r cosθ, y=r sinθ，雅可比行列式 = r，所以 dxdy = r dr dθ。**那个 r 不能丢**，这是最常见的错误。'},
  {tag:'M7',subj:'math',q:'三重积分在柱坐标下的体积元素是？',o:['r²·dr·dθ·dz', 'dr·dθ·dz', 'r·dr·dθ·dz', 'r·dr·dθ'],a:2,why:'柱坐标 (r, θ, z)：x=r cosθ, y=r sinθ, z=z，雅可比 = r，所以 dV = r dr dθ dz。和极坐标类似，也别忘了 r。'},
  {tag:'M7',subj:'math',q:'第一类曲线积分（对弧长）与路径方向的关系是？',o:['与方向相同', '与方向相反', '只与起点有关', '与方向无关'],a:3,why:'第一类（对弧长 ds）：与方向无关，从 A 到 B 和从 B 到 A 结果一样。第二类（对坐标 dx, dy）：换方向要变号。'},
  {tag:'M7',subj:'math',q:'格林公式把什么转化为什么？',o:['二重积分 → 三重积分', '曲线积分 → 曲面积分', '平面曲线积分 → 二重积分', '面积分 → 体积分'],a:2,why:'格林公式：∮(P dx + Q dy) = ∬(∂Q/∂x − ∂P/∂y) dxdy。把闭曲线上的积分转成区域上的二重积分。'},
  {tag:'M7',subj:'math',q:'格林公式成立的前提是？',o:['曲线可以不闭合', '区域可以无界', '曲线是闭曲线且取正向，P、Q 有连续偏导', '函数只要连续'],a:2,why:'要求：① L 是**闭曲线**（否则要补线）；② 取**正向**（逆时针，区域在左侧）；③ P、Q 在区域内有连续一阶偏导。'},
  {tag:'M7',subj:'math',q:'高斯公式把什么转化为什么？',o:['曲线积分 → 二重积分', '曲面积分 → 三重积分', '三重积分 → 曲面积分', '二重积分 → 曲线积分'],a:1,why:'高斯公式：∯(P dydz + Q dzdx + R dxdy) = ∭(∂P/∂x + ∂Q/∂y + ∂R/∂z) dV。闭曲面上的积分转成体积分。'},
  {tag:'M7',subj:'math',q:'斯托克斯公式把什么转化为什么？',o:['曲面积分 → 三重积分', '体积分 → 面积分', '空间曲线积分 → 曲面积分', '二重积分 → 曲线积分'],a:2,why:'斯托克斯公式是格林公式在空间中的推广：∮(P dx+Q dy+R dz) = ∬ rot(F)·n dS。把空间闭曲线积分转成曲面积分。'},
  {tag:'M8',subj:'math',q:'级数收敛的必要条件是？',o:['通项有界', '通项单调', '通项趋于 0', '部分和有界'],a:2,why:'若 Σaₙ 收敛，则 aₙ → 0（通项趋于零）。**反之不成立**（调和级数 Σ1/n 通项趋于 0 但发散）。这是必要条件，常用来快速判断发散。'},
  {tag:'M8',subj:'math',q:'p 级数 Σ1/n^p 收敛的条件是？',o:['p ≥ 1', 'p ≤ 1', 'p < 1', 'p > 1'],a:3,why:'p>1 收敛（如 Σ1/n²），p≤1 发散（如 Σ1/n 是调和级数、p=1 发散）。这是最常用的判据基准。'},
  {tag:'M8',subj:'math',q:'比值判别法（达朗贝尔）中，若 lim|aₙ₊₁/aₙ| = ρ < 1，则级数？',o:['无法判断', '发散', '条件收敛', '绝对收敛'],a:3,why:'ρ<1 → 绝对收敛；ρ>1 → 发散；ρ=1 → **无法判断**（要用其他方法）。注意 ρ=1 时比值法失效。'},
  {tag:'M8',subj:'math',q:'交错级数 Σ(−1)ⁿaₙ 收敛的条件是？',o:['aₙ 有界', 'aₙ 单调递减且趋于 0', 'aₙ 趋于 0 即可', 'aₙ 单调递增'],a:1,why:'莱布尼茨判别法：① aₙ 单调递减；② aₙ → 0。两条同时满足则收敛。注意这是「条件收敛」，不是绝对收敛。'},
  {tag:'M8',subj:'math',q:'绝对收敛和条件收敛的关系是？',o:['绝对收敛可能发散', '条件收敛更强', '两者一样', '绝对收敛必收敛，条件收敛只是收敛'],a:3,why:'绝对收敛（Σ|aₙ| 收敛）→ 一定收敛。条件收敛（Σaₙ 收敛但 Σ|aₙ| 发散）→ 只是收敛。如 Σ(−1)ⁿ/n 是条件收敛。'},
  {tag:'M8',subj:'math',q:'幂级数 Σaₙxⁿ 的收敛半径 R 的计算公式是？',o:['R = lim|aₙ₊₁/aₙ|', 'R = lim|aₙ|', 'R = 1 / lim|aₙ₊₁/aₙ|', 'R = 1/lim|aₙ|'],a:2,why:'用比值法：R = lim|aₙ/aₙ₊₁|（即 1/lim|aₙ₊₁/aₙ|）。在 |x|<R 内绝对收敛，|x|>R 发散，|x|=R 要单独判定。'},
  {tag:'M8',subj:'math',q:'泰勒级数展开中，f(x) 在 x₀ 处的展开式系数是？',o:['f(x₀)/n', 'f⁽ⁿ⁾(x₀)/n!', 'f⁽ⁿ⁾(x₀)', 'n·f⁽ⁿ⁾(x₀)'],a:1,why:'泰勒级数：f(x) = Σ f⁽ⁿ⁾(x₀)/n! · (x−x₀)ⁿ。x₀=1 时就是麦克劳林级数，如 e^x = Σxⁿ/n!。'},
  {tag:'M8',subj:'math',q:'傅里叶级数把一个函数展开成什么？',o:['指数函数', '幂函数的和', '多项式', '正弦和余弦函数的和'],a:3,why:'傅里叶级数：f(x) = a₀/2 + Σ(aₙcos nx + bₙsin nx)。用于周期函数的分解，是信号处理的基础。'},
  {tag:'M9',subj:'math',q:'一阶微分方程 y′ + P(x)y = Q(x) 的通解公式中，积分因子是？',o:['e^∫Q(x)dx', '1/P(x)', 'e^∫P(x)dx', 'P(x)'],a:2,why:'一阶线性方程用积分因子 μ = e^∫Pdx，两边乘上它后左边变成 (μy)′。这是标准解法，记住公式即可。'},
  {tag:'M9',subj:'math',q:'可分离变量方程 dy/dx = f(x)g(y) 的解法是？',o:['用拉格朗日', '直接积分', '把含 y 的和含 x 的分到两边再积分', '先求导'],a:2,why:'dy/g(y) = f(x)dx，两边各自积分。注意 g(y)=0 的情况（可能是特解，容易漏）。'},
  {tag:'M9',subj:'math',q:'二阶常系数齐次方程 y″ + py′ + qy = 0 的特征方程是？',o:['r + p + q = 0', 'r² + q = 0', 'pr + q = 0', 'r² + pr + q = 0'],a:3,why:'设 y = e^(rx)，代入得特征方程 r²+pr+q=0。两个不同的实根 → 两个指数解；重根 → e^(rx) 和 x·e^(rx)；复根 → 指数乘三角。'},
  {tag:'M9',subj:'math',q:'特征方程有两个相等实根 r 时，通解是？',o:['C₁e^(rx) + C₂e^(rx)', 'C₁e^(rx) + C₂x', 'C₁ + C₂x', '(C₁ + C₂x)e^(rx)'],a:3,why:'重根时只能得到一个解 e^(rx)，第二个解要靠「乘以 x」构造：x·e^(rx)。通解是 (C₁+C₂x)e^(rx)。'},
  {tag:'M9',subj:'math',q:'特征方程有复根 α±iβ 时，通解是？',o:['C₁e^(αx) + C₂e^(βx)', 'e^(βx)(C₁+C₂x)', 'C₁cos βx + C₂sin βx', 'e^(αx)(C₁cos βx + C₂sin βx)'],a:3,why:'复根 → 解含 e^(αx)（衰减/增长）和三角函数（振荡）。这是「阻尼振动」的数学形式。'},
  {tag:'M9',subj:'math',q:'非齐次方程 y″ + py′ + qy = f(x) 的通解是？',o:['齐次通解', '两个特解相加', '齐次通解 + 非齐次特解', '只有特解'],a:2,why:'非齐次通解 = 齐次通解 + 一个特解。求特解用待定系数法（f 是多项式/指数/三角）或常数变易法。'},
  {tag:'M9',subj:'math',q:'微分方程的「阶」是指？',o:['自变量个数', '解的个数', '最高次幂', '方程中出现的最高阶导数'],a:3,why:'阶 = 最高阶导数的阶数。y″ 是二阶，y‴ 是三阶。阶决定了通解中独立常数的个数（n 阶有 n 个）。'},
  {tag:'M9',subj:'math',q:'欧拉方程 x²y″ + axy′ + by = 0 的常用解法是？',o:['直接积分', '用幂级数', '令 x = e^t 化为常系数', '分离变量'],a:2,why:'欧拉方程通过代换 x=e^t（t=ln x）把变系数化成常系数方程。或者直接设 y=x^r，得特征方程 r(r−1)+ar+b=0。'},
  {tag:'M10',subj:'math',q:'两个向量垂直的充要条件是？',o:['叉积为 0', '方向相同', '模相等', '点积为 0'],a:3,why:'a·b = 0 ⟺ 垂直（a、b 非零）。a×b = 0 ⟺ 平行。这是向量运算最基础的两个判据。'},
  {tag:'M10',subj:'math',q:'两个向量平行的充要条件是？',o:['点积为 0', '叉积为零向量', '模相等', '夹角 90°'],a:1,why:'a×b = 0 ⟺ 平行（共线）。也可以说存在 λ 使 a = λb。点积为 0 才是垂直。'},
  {tag:'M10',subj:'math',q:'平面的点法式方程需要什么条件？',o:['三个点', '一个点和方向向量', '一个点和法向量', '两个点'],a:2,why:'点法式：n·(r − r₀) = 0，即 A(x−x₀)+B(y−y₀)+C(z−z₀)=0。n=(A,B,C) 是法向量，垂直于平面。'},
  {tag:'M10',subj:'math',q:'直线与平面平行的条件是？',o:['两者平行', '直线方向向量与平面法向量垂直', '点积为 0 且点不在平面上', '叉积为 0'],a:1,why:'直线平行于平面 ⟺ 方向向量 s ⊥ 法向量 n ⟺ s·n = 0。还要确认直线不在平面上（点不满足平面方程）。'},
  {tag:'M10',subj:'math',q:'旋转曲面 z = x² + y² 是什么曲面？',o:['圆锥面', '圆柱面', '旋转抛物面', '球面'],a:2,why:'z = x²+y² 是开口朝上的旋转抛物面（碗状）。x²+y²=z² 是圆锥面，x²+y²=R² 是圆柱面。'},
  {tag:'M10',subj:'math',q:'椭球面的标准方程是？',o:['x²/a² + y²/b² + z²/c² = 1', 'x²/a² − y²/b² = 1', 'x²/a² + y²/b² = z', 'x²+y²+z²=1'],a:0,why:'椭球面：三项系数为正且等于 1。若有两项为负则是单叶双曲面，一项为负是双叶双曲面。'},
  {tag:'M10',subj:'math',q:'空间曲线在坐标面上的投影怎么求？',o:['直接取坐标', '求导', '积分', '消去一个变量得到投影柱面方程'],a:3,why:'如求在 xOy 面的投影：从方程组中消去 z，得到只含 x、y 的方程（投影柱面），再联立 z=0。'},
  {tag:'M10',subj:'math',q:'向量的混合积 [a b c] 的几何意义是？',o:['以 a、b、c 为棱的平行六面体的体积', '向量的长度', '平行四边形的面积', '三角形的面积'],a:0,why:'混合积 = (a×b)·c，绝对值等于平行六面体体积。等于 0 说明三向量共面。'},
  {tag:'M10',subj:'math',q:'直线 x/1 = y/2 = z/3 的方向向量是？',o:['(1, 2, 3)', '(3, 2, 1)', '(1, 1, 1)', '(0, 0, 0)'],a:0,why:'对称式 x/a = y/b = z/c 中，分母就是方向向量 (a,b,c)。这是直线方程最直观的形式。'},
  {tag:'E6',subj:'en',q:'分析长难句的第一步应该是？',o:['找生词', '看标点', '逐词翻译', '找主谓宾（句子主干）'],a:3,why:'长难句的破解顺序：① 找主句的主谓宾；② 识别从句和修饰成分；③ 理清修饰关系；④ 再翻译。先抓主干，细节才有落脚点。'},
  {tag:'E6',subj:'en',q:'「The book that I bought yesterday is interesting.」中 that 引导的是？',o:['主语从句', '宾语从句', '状语从句', '定语从句，修饰 book'],a:3,why:'that I bought yesterday 修饰 the book（限定它是哪本书）。判断方法：去掉 that 从句，句子主干「The book is interesting」仍然完整。'},
  {tag:'E6',subj:'en',q:'「What he said surprised us.」中 What 引导的是？',o:['定语从句', '主语从句', '宾语从句', '状语从句'],a:1,why:'What he said 整个作主语（「他说的话」）。主语从句常用 what/that/whether 引导，谓语用单数。'},
  {tag:'E6',subj:'en',q:'「It is said that he is rich.」中的 it 是？',o:['强调句', '代词（指代前文）', '形式主语', '无实义'],a:2,why:'it 是形式主语，真正的主语是 that 从句。类似的还有 It is important that...、It seems that...。'},
  {tag:'E6',subj:'en',q:'强调句型「It is ... that ...」的判断方法是？',o:['去掉 It is 和 that，剩下部分仍能组成完整句子', '看谓语单复数', '看时态', '看有没有 that'],a:0,why:'强调句：It is + 被强调部分 + that + 其余部分。去掉框架后句子仍完整（如 It was yesterday that he left → He left yesterday）。定语从句则不能。'},
  {tag:'E6',subj:'en',q:'「Not until he came back did I leave.」这个句子用了什么结构？',o:['被动语态', '强调句', '定语从句', 'not until 置于句首引起的部分倒装'],a:3,why:'否定词（not until/never/hardly）置于句首时，主句要部分倒装：助动词提前。所以是 did I leave 而不是 I left。'},
  {tag:'E6',subj:'en',q:'「The more you read, the more you know.」的结构是？',o:['虚拟语气', '并列句', 'the + 比较级, the + 比较级（越…越…）', '定语从句'],a:2,why:'「the + 比较级 + 主语 + 谓语, the + 比较级 + 主语 + 谓语」表示「越…越…」。前句是从句，后句是主句。'},
  {tag:'E6',subj:'en',q:'「Given that he is young, he did well.」中 Given that 的意思是？',o:['虽然', '考虑到（引导原因状语）', '被给予', '如果'],a:1,why:'Given that = considering that（考虑到）。注意 given 在这里是介词/连词用法，不是被动语态的「被给予」。'},
  {tag:'E7',subj:'en',q:'英译汉中，「定语从句」最常见的处理方式是？',o:['拆成独立的短句（分译）', '译成状语', '省略不译', '一律前置成「的」'],a:0,why:'英语定语从句长，中文习惯短句。所以常把从句拆出来单独成句（如 which 指代前句时）。短定语才前置成「…的」。'},
  {tag:'E7',subj:'en',q:'「This is the house where he lived.」译为中文时，where 从句通常？',o:['译成原因', '译成「这就是房子，他住在那里」', '译成「他住过的房子」（前置定语）', '省略'],a:2,why:'where 引导的定语从句较短时，前置成「他住过的」。如果从句很长，才拆成两句。判断依据是长度和流畅度。'},
  {tag:'E7',subj:'en',q:'英译汉中「名词化结构」的常见处理是？',o:['译成形容词', '转译成动词（汉语多动词）', '保留名词', '省略'],a:1,why:'英语爱用名词（the implementation of the plan），汉语爱用动词（实施这个计划）。所以常把英语名词转成汉语动词，更通顺。'},
  {tag:'E7',subj:'en',q:'「It is universally acknowledged that ...」的推荐译法是？',o:['人们普遍认为……', '这是普遍的认知', '它被普遍承认', '普遍承认它'],a:0,why:'英语被动 + 形式主语，译成中文的主动式「人们认为/据认为」更自然。直译「被普遍承认」显得生硬。'},
  {tag:'E7',subj:'en',q:'翻译中「词性转换」最常见的是？',o:['名词↔连词', '动词↔介词', '只有一种', '名词↔动词、形容词↔副词'],a:3,why:'英译汉最常见的转换：名词→动词（implementation→实施）、形容词→副词（quick→迅速地）、介词→动词（with→用）。目的是符合汉语表达习惯。'},
  {tag:'E7',subj:'en',q:'遇到不认识的生词，翻译时应该？',o:['根据上下文和构词法推测，保证句子通顺', '跳过整句', '留空', '音译'],a:0,why:'考研翻译按「意思准确 + 汉语通顺」评分。个别词不认识时，靠上下文推大意，保证整体通顺比卡在一个词上好。'},
  {tag:'E7',subj:'en',q:'「as ... as」结构在翻译中常译为？',o:['「除非」', '「虽然」', '「因为」', '「和…一样」或「既…又…」'],a:3,why:'as...as 表示同级比较。但在不同语境下也可能是「随着」（as 引导时间状语）或「因为」（as 引导原因）。要看句子结构。'},
  {tag:'E7',subj:'en',q:'翻译评分中最容易失分的是？',o:['用词不够华丽', '漏译或错译关键信息', '字数不够', '标点'],a:1,why:'考研翻译按「信息点」给分。漏掉一个要点就扣分，用词朴素不扣。所以**宁可朴素，不要漏译**。'},
  {tag:'E8',subj:'en',q:'小作文（书信）中，开头段的常用表达是？',o:['In conclusion ...', 'I am writing to ...', 'As we all know ...', 'Once upon a time ...'],a:1,why:'书信开头：I am writing to apply for / complain about / inquire about...（我写信是为了申请/投诉/询问）。直接说明目的。'},
  {tag:'E8',subj:'en',q:'小作文中「投诉信」的语气应该是？',o:['随意口语', '愤怒谩骂', '卑微恳求', '礼貌但明确（坚定而不失礼）'],a:3,why:'投诉信要「firm but polite」：说明问题、表达不满、提出要求，但保持礼貌。过于情绪化会失分（不符合书信规范）。'},
  {tag:'E8',subj:'en',q:'大作文描述图画时，常用的开头句式是？',o:['First of all ...', 'In my opinion ...', 'I think that ...', 'As is vividly depicted in the picture, ...'],a:3,why:'图画描述常用：As is vividly depicted/shown/illustrated in the picture, ...（如图所示）。这是「描述段」的标准开头。'},
  {tag:'E8',subj:'en',q:'大作文分析原因段，常用的过渡表达是？',o:['All in all ...', 'To sum up ...', 'Several factors contribute to this phenomenon.', 'In a word ...'],a:2,why:'原因分析段开头：Several factors contribute to / account for this phenomenon（几个因素造成了这个现象）。然后 First...Second...Finally。'},
  {tag:'E8',subj:'en',q:'写作中避免「中式英语」的关键是？',o:['多用长句', '用英语的句式和搭配，不逐字翻译中文', '多用成语', '多用难词'],a:1,why:'中式英语来自「中文思维直译」。改进方法：背地道搭配（make a decision 而非 do a decision）、用简单句保证正确、少用没把握的长句。'},
  {tag:'E8',subj:'en',q:'大作文结尾段，除了建议还可以写？',o:['重复描述图画', '道歉', '列举数据', '展望未来或呼吁行动'],a:3,why:'结尾三选一：① 提出建议（we should...）；② 展望（only in this way can we...）；③ 呼吁（it is high time that...）。不重复描述。'},
  {tag:'E8',subj:'en',q:'写作中「it is high time that」后面的从句谓语用？',o:['过去式（虚拟语气）', '现在式', '将来式', '原形'],a:0,why:'It is high time that sb. did sth.（早就该做某事了）。这是虚拟语气，从句用过去式。类似的还有 would rather that...。'},
  {tag:'E8',subj:'en',q:'考研写作的字数要求大约是？',o:['都 200 词', '都 100 词', '不限', '小作文 100 词，大作文 160-200 词'],a:3,why:'英语一：小作文约 100 词，大作文 160-200 词。字数不足或过多都会影响分数。宁可写满要求，不要超太多。'},
  {tag:'E9',subj:'en',q:'阅读中「词汇题」问某词的意思，答案通常？',o:['无法判断', '就是词典第一个义项', '是熟词僻义之外的原义', '在该词前后的上下文里（解释、对比、举例）'],a:3,why:'考研阅读的词汇题 90% 是「熟词僻义」或「上下文定义」。找线索：破折号、冒号、such as、that is、or 后面的解释。'},
  {tag:'E9',subj:'en',q:'阅读中「推理题」的标志词是？',o:['infer / imply / suggest / learn', 'state / mention', 'list', 'define'],a:0,why:'infer/imply/suggest 都是「推断」，答案不能是原文照抄，要推一步。而 state/mention 问的是「文中说了什么」，可以直接对应原文。'},
  {tag:'E9',subj:'en',q:'「Which of the following is TRUE?」这类题的做法是？',o:['逐项回原文定位验证', '选最长的', '凭印象选', '选最抽象的'],a:0,why:'判断正误题必须逐项定位：找到原文对应句，看是否一致。注意「部分正确」「偷换概念」「过度推断」都是常见的错误项设计。'},
  {tag:'E9',subj:'en',q:'阅读中「指代题」问 it/they 指什么，应该？',o:['往前找最近的名词（单复数一致）', '指作者', '指读者', '往后找'],a:0,why:'代词指代通常在前文。找「最近的、数一致的、意义通顺的」名词短语。有时指代整个前句的意思（如 this means...）。'},
  {tag:'E9',subj:'en',q:'「The author’s attitude towards X is ...」选项中，objective 通常？',o:['是正确的（学术文章多客观）', '表示反对', '表示支持', '是干扰项'],a:0,why:'学术文章作者态度多为 objective（客观）、critical（批判）、supportive（支持）。indifferent（漠不关心）几乎总是错的。'},
  {tag:'E9',subj:'en',q:'阅读中「段落作用题」问某段的作用，应该看？',o:['该段的生词', '该段与前后段的逻辑关系', '该段的长度', '该段有几个词'],a:1,why:'段落作用：① 提出论点（首段）；② 提供论据（中间）；③ 转折/对比（But 开头）；④ 总结（末段）。看它和前后文的关系。'},
  {tag:'E9',subj:'en',q:'阅读时间不够时，最该优先做的是？',o:['先做细节题（好定位），主旨题最后', '先做主旨题', '按顺序做', '随机'],a:0,why:'细节题有定位词，能快速找到答案。主旨题要通读全文，耗时长。所以「先细节后主旨」是常见策略。'},
  {tag:'E9',subj:'en',q:'「干扰项」的常见特征不包括？',o:['过度推断', '答非所问', '与原文完全一致', '偷换概念（换主语/范围）'],a:2,why:'干扰项设计：① 偷换概念；② 过度推断（推两步）；③ 答非所问（回答了别的问题）；④ 绝对化。**与原文完全一致的是正确答案**。'},
  {tag:'E10',subj:'en',q:'affect 和 effect 的区别是？',o:['effect 是动词（影响）', 'affect 是名词', 'affect 是动词（影响），effect 是名词（效果）', '两者都是动词'],a:2,why:'affect（v. 影响）vs effect（n. 效果）。但 effect 也可作动词表示「实现」（effect a change）。考研最爱考 affect/effect 混用。'},
  {tag:'E10',subj:'en',q:'「considerable」和「considerate」的区别是？',o:['considerable 是「相当大的」，considerate 是「体贴的」', 'considerate 是相当大的', '两者一样', 'considerable 是体贴的'],a:0,why:'considerable（adj. 相当大的、可观的）vs considerate（adj. 体贴的、考虑周到的）。拼写只差一个字母，意思完全不同。'},
  {tag:'E10',subj:'en',q:'「economic」和「economical」的区别是？',o:['economic 是「经济的（学科的）」，economical 是「节约的」', 'economical 是经济学', 'economic 是节约的', '两者一样'],a:0,why:'economic（经济的，如 economic growth 经济增长）vs economical（节约的，如 an economical car 省油的车）。'},
  {tag:'E10',subj:'en',q:'「respectable / respectful / respective」分别指？',o:['都是「尊敬的」', '可敬的 / 恭敬的 / 各自的', '都是「各自的」', '可敬的 / 各自的 / 恭敬的'],a:1,why:'respectable（值得尊敬的）respectful（恭敬的，对人态度）respective（各自的）。三个词根相同但后缀决定意思。'},
  {tag:'E10',subj:'en',q:'「sensible」和「sensitive」的区别是？',o:['sensible 是「明智的」，sensitive 是「敏感的」', '两者一样', 'sensitive 是明智的', 'sensible 是敏感的'],a:0,why:'sensible（明智的、合理的）vs sensitive（敏感的、易受影响的）。a sensible decision（明智的决定）vs sensitive skin（敏感皮肤）。'},
  {tag:'E10',subj:'en',q:'「principal」和「principle」的区别是？',o:['principle 是主要的', 'principal 是「主要的/校长」，principle 是「原则」', '两者一样', 'principal 是原则'],a:1,why:'principal（adj. 主要的；n. 校长/本金）vs principle（n. 原则/原理）。拼写相近，词性不同。考研常考 in principle（原则上）。'},
  {tag:'E10',subj:'en',q:'「adapt / adopt / adept」分别指？',o:['都是「适应」', '适应 / 采用 / 熟练的', '适应 / 熟练的 / 采用', '采用 / 适应 / 熟练的'],a:1,why:'adapt（适应、改编）adopt（采用、收养）adept（熟练的）。adapt to（适应）、adopt a policy（采取政策）。'},
  {tag:'E10',subj:'en',q:'「complement」和「compliment」的区别是？',o:['complement 是赞美', 'complement 是「补充」，compliment 是「赞美」', 'compliment 是补充', '两者一样'],a:1,why:'complement（n./v. 补充、补足）vs compliment（n./v. 赞美、恭维）。拼写只差一个字母（e/i）。'},
  {tag:'P6',subj:'pol',q:'历史唯物主义认为，社会发展的根本动力是？',o:['阶级斗争', '科学技术', '人民群众的愿望', '社会基本矛盾'],a:3,why:'社会基本矛盾（生产力与生产关系、经济基础与上层建筑）是社会发展的根本动力。阶级斗争是阶级社会发展的直接动力。'},
  {tag:'P6',subj:'pol',q:'生产力中最活跃的因素是？',o:['生产工具', '劳动资料', '劳动对象', '劳动者'],a:3,why:'生产力三要素：劳动者（最活跃、起主导作用）、劳动资料（生产工具是标志）、劳动对象。劳动者是决定性因素。'},
  {tag:'P6',subj:'pol',q:'上层建筑的核心是？',o:['意识形态', '政治制度', '国家政权', '法律'],a:2,why:'上层建筑包括政治上层建筑（国家政权、政治制度等）和观念上层建筑（意识形态）。**国家政权是核心**。'},
  {tag:'P6',subj:'pol',q:'「人民群众是历史的创造者」这一观点的依据是？',o:['人口众多', '物质资料生产方式是社会发展的决定力量', '道德高尚', '掌握知识'],a:1,why:'人民群众是物质财富的创造者、精神财富的创造者、社会变革的决定力量。根本依据是「物质生产是社会发展的基础」。'},
  {tag:'P6',subj:'pol',q:'认识的两次飞跃是指？',o:['从感性到理性，再到感性', '从实践到认识，再从认识到实践', '从个别到一般', '从现象到本质'],a:1,why:'第一次飞跃：感性认识 → 理性认识（实践 → 认识）。第二次飞跃：理性认识 → 实践（指导实践、接受检验）。第二次更重要。'},
  {tag:'P6',subj:'pol',q:'「实践是检验真理的唯一标准」的原因是？',o:['大多数人认可', '实践更简单', '理论不可信', '真理的本性和实践的特点决定的'],a:3,why:'真理是主观与客观的符合，只有实践能把主观和客观联系起来对照。实践具有直接现实性，能把理论变成现实。'},
  {tag:'P6',subj:'pol',q:'商品的价值量由什么决定？',o:['社会必要劳动时间', '供求关系', '使用价值', '个别劳动时间'],a:0,why:'价值量由**社会必要劳动时间**决定（不是个别劳动时间）。个别劳动时间低于社会必要时间就有超额剩余价值。'},
  {tag:'P6',subj:'pol',q:'剩余价值的来源是？',o:['市场交换', '资本家的经营', '技术进步', '雇佣工人的剩余劳动'],a:3,why:'剩余价值是雇佣工人在剩余劳动时间创造的、被资本家无偿占有的价值。它揭示了资本主义剥削的秘密。'},
  {tag:'P7',subj:'pol',q:'「五位一体」总体布局的内容是？',o:['富强、民主、文明、和谐、美丽', '经济建设、政治建设、文化建设、社会建设、生态文明建设', '四个全面', '创新、协调、绿色、开放、共享'],a:1,why:'五位一体：经济、政治、文化、社会、生态文明。对应「富强民主文明和谐美丽」的现代化目标。'},
  {tag:'P7',subj:'pol',q:'「四个自信」是指？',o:['理论自信、制度自信、文化自信、科技自信', '道路自信、发展自信、制度自信、文化自信', '道路自信、理论自信、制度自信、文化自信', '经济自信、政治自信、文化自信、军事自信'],a:2,why:'四个自信：中国特色社会主义道路自信、理论自信、制度自信、文化自信。文化自信是更基础、更广泛、更深厚的自信。'},
  {tag:'P7',subj:'pol',q:'中国特色社会主义最本质的特征是？',o:['人民当家作主', '共同富裕', '中国共产党领导', '公有制为主体'],a:2,why:'中国共产党领导是中国特色社会主义最本质的特征，也是中国特色社会主义制度的最大优势。'},
  {tag:'P7',subj:'pol',q:'「以人民为中心」的发展思想，核心是？',o:['优先发展经济', '先富带动后富', '发展为了人民、发展依靠人民、发展成果由人民共享', '效率优先'],a:2,why:'以人民为中心：发展为了人民（目的）、发展依靠人民（动力）、发展成果由人民共享（归宿）。这是新发展理念的核心。'},
  {tag:'P7',subj:'pol',q:'全面深化改革的总目标是？',o:['建立市场经济', '完善和发展中国特色社会主义制度，推进国家治理体系和治理能力现代化', '提高 GDP', '扩大开放'],a:1,why:'十八届三中全会提出：全面深化改革的总目标是完善和发展中国特色社会主义制度，推进国家治理体系和治理能力现代化。'},
  {tag:'P7',subj:'pol',q:'「两个毫不动摇」是指？',o:['毫不动摇发展工业，毫不动摇发展农业', '毫不动摇坚持党的领导，毫不动摇改革开放', '毫不动摇发展经济，毫不动摇改革开放', '毫不动摇巩固和发展公有制经济，毫不动摇鼓励、支持、引导非公有制经济发展'],a:3,why:'两个毫不动摇：① 巩固和发展公有制经济；② 鼓励、支持、引导非公有制经济发展。这是基本经济制度的核心表述。'},
  {tag:'P7',subj:'pol',q:'我国的基本经济制度是？',o:['公有制为主体、多种所有制经济共同发展', '混合所有制', '完全的市场经济', '单一的公有制'],a:0,why:'基本经济制度包括：公有制为主体多种所有制共同发展、按劳分配为主体多种分配方式并存、社会主义市场经济体制。'},
  {tag:'P7',subj:'pol',q:'「全过程人民民主」的核心是？',o:['基层自治', '选举民主', '协商民主', '人民当家作主'],a:3,why:'全过程人民民主是社会主义民主政治的本质属性，核心是人民当家作主。它贯穿民主选举、协商、决策、管理、监督全过程。'},
  {tag:'P8',subj:'pol',q:'改革开放的起点是？',o:['1956 年三大改造完成', '1978 年党的十一届三中全会', '1992 年南方谈话', '1949 年新中国成立'],a:1,why:'1978 年十一届三中全会作出把工作中心转移到经济建设上来、实行改革开放的历史性决策，是改革开放的起点。'},
  {tag:'P8',subj:'pol',q:'「一国两制」构想最早是为解决什么问题提出的？',o:['香港问题', '西藏问题', '澳门问题', '台湾问题'],a:3,why:'「一国两制」最初是为解决台湾问题提出的构想，后来首先成功运用于香港（1997）和澳门（1999）。'},
  {tag:'P8',subj:'pol',q:'我国社会主义改造完成的时间是？',o:['1949 年', '1978 年', '1956 年', '1966 年'],a:2,why:'1956 年底，对农业、手工业、资本主义工商业的社会主义改造基本完成，标志着社会主义制度在我国基本确立。'},
  {tag:'P8',subj:'pol',q:'「真理标准问题大讨论」的意义是？',o:['完成了改造', '确立了市场经济', '冲破了两个凡是的思想束缚，为改革开放作了思想准备', '建立了特区'],a:2,why:'1978 年关于真理标准的大讨论，重新确立了实践是检验真理的唯一标准，冲破了「两个凡是」的束缚，为十一届三中全会作了思想准备。'},
  {tag:'P8',subj:'pol',q:'社会主义市场经济体制目标是在哪次会议上确立的？',o:['十五大', '十二大', '党的十四大', '十一届三中全会'],a:2,why:'1992 年党的十四大明确提出建立社会主义市场经济体制的改革目标。此前邓小平南方谈话为这一决策奠定了理论基础。'},
  {tag:'P8',subj:'pol',q:'「三步走」发展战略中，第一步是？',o:['达到小康', '建成现代化', '解决人民温饱问题', '实现共同富裕'],a:2,why:'三步走：① 解决温饱（1990）；② 达到小康（20 世纪末）；③ 基本实现现代化（21 世纪中叶）。后来发展为「两个一百年」。'},
  {tag:'P8',subj:'pol',q:'中国特色社会主义进入新时代的标志是？',o:['新中国成立', '十九大', '党的十八大以来', '改革开放'],a:2,why:'党的十八大以来，中国特色社会主义进入新时代。党的十九大正式作出「中国特色社会主义进入新时代」的重大政治判断。'},
  {tag:'P8',subj:'pol',q:'脱贫攻坚战取得全面胜利的时间是？',o:['2019 年', '2022 年', '2021 年', '2020 年'],a:2,why:'2021 年 2 月，全国脱贫攻坚总结表彰大会宣布：脱贫攻坚战取得全面胜利，现行标准下近 1 亿农村贫困人口全部脱贫。'},
  {tag:'P9',subj:'pol',q:'法治思维的基本内容不包括？',o:['权力制约', '人权保障', '法律至上', '道德感化'],a:3,why:'法治思维包括：法律至上、权力制约、公平正义、人权保障、正当程序。**道德感化是德治的方式**，不是法治思维。'},
  {tag:'P9',subj:'pol',q:'「依法治国」和「以德治国」的关系是？',o:['法治优先', '德治优先', '互相替代', '相辅相成，法治与德治相结合'],a:3,why:'法治是治国理政的基本方式，德治是重要支撑。两者相辅相成：法律是底线（他律），道德是高线（自律）。'},
  {tag:'P9',subj:'pol',q:'我国公民的基本权利中，「政治权利」包括？',o:['选举权和被选举权', '社会保障权', '受教育权', '劳动权'],a:0,why:'政治权利：选举权与被选举权、言论出版集会结社游行示威的自由。劳动权、受教育权属于社会经济文化权利。'},
  {tag:'P9',subj:'pol',q:'「正当程序」的核心要求是？',o:['效率优先', '成本最低', '结果正确', '程序公开、公正、参与'],a:3,why:'正当程序要求：信息公开、公众参与、回避制度、说明理由、救济途径。核心是「看得见的正义」。'},
  {tag:'P9',subj:'pol',q:'个人与社会的关系中，最根本的是？',o:['两者对立', '个人利益与社会利益的统一', '社会利益优先', '个人利益优先'],a:1,why:'个人与社会是辩证统一的：社会是个人生存发展的基础，个人是社会发展的动力。个人利益与社会利益根本一致。'},
  {tag:'P9',subj:'pol',q:'「时代新人」的要求是？',o:['有信仰、有热情、有干劲', '有道德、有文化、有纪律', '有知识、有能力、有财富', '有理想、有本领、有担当'],a:3,why:'时代新人：有理想（信念）、有本领（能力）、有担当（责任）。这是对青年一代的期望。'},
  {tag:'P9',subj:'pol',q:'「道德」与「法律」的共同点是？',o:['都由国家机关制定', '都靠舆论维持', '都是社会规范，都约束人的行为', '都有强制力'],a:2,why:'共同点：都是社会规范、都调整社会关系、都有规范作用。区别：法律有国家强制力，道德靠舆论和信念。'},
  {tag:'P9',subj:'pol',q:'「四个全面」战略布局中，「全面从严治党」的地位是？',o:['提供根本保证', '战略目标', '无关紧要', '战略举措之一'],a:0,why:'四个全面：全面建设社会主义现代化国家（战略目标）、全面深化改革、全面依法治国、全面从严治党（三者是战略举措，提供动力、保障、保证）。'},
  {tag:'P10',subj:'pol',q:'中国式现代化的五个特征是？',o:['富强、民主、文明、和谐、美丽', '高速增长、均衡发展、绿色发展、开放发展、共享发展', '人口规模巨大、全体人民共同富裕、物质文明和精神文明相协调、人与自然和谐共生、走和平发展道路', '工业化、信息化、城镇化、农业现代化'],a:2,why:'中国式现代化五大特征：人口规模巨大、全体人民共同富裕、物质文明和精神文明相协调、人与自然和谐共生、走和平发展道路。'},
  {tag:'P10',subj:'pol',q:'「共同富裕」的实现路径是？',o:['先富停止帮后富', '在高质量发展中促进共同富裕', '平均分配', '提高税收'],a:1,why:'共同富裕不是平均主义，而是在高质量发展中、通过制度安排逐步实现。要「把蛋糕做大」同时「把蛋糕分好」。'},
  {tag:'P10',subj:'pol',q:'「新发展格局」的内涵是？',o:['以国内大循环为主体、国内国际双循环相互促进', '扩大进口', '完全内循环', '完全依赖出口'],a:0,why:'新发展格局：以国内大循环为主体（依托强大国内市场）、国内国际双循环相互促进。不是封闭的内循环。'},
  {tag:'P10',subj:'pol',q:'「高质量发展」的核心是？',o:['扩大投资', 'GDP 高速增长', '增加出口', '体现新发展理念的发展'],a:3,why:'高质量发展是体现创新、协调、绿色、开放、共享新发展理念的发展，是能够很好满足人民日益增长的美好生活需要的发展。'},
  {tag:'P10',subj:'pol',q:'「科技自立自强」被确立为？',o:['国家发展的战略支撑', '企业的责任', '教育的目标', '次要目标'],a:0,why:'党的十九届五中全会提出：把科技自立自强作为国家发展的战略支撑。关键核心技术要自主可控。'},
  {tag:'P10',subj:'pol',q:'「人类文明新形态」的提出者是？',o:['西方国家', '学者', '联合国', '中国共产党'],a:3,why:'习近平在庆祝中国共产党成立 100 周年大会上提出：我们创造了中国式现代化新道路，创造了人类文明新形态。'},
  {tag:'P10',subj:'pol',q:'「绿水青山就是金山银山」体现的理念是？',o:['人与自然和谐共生', '经济优先', '环保优先', '先污染后治理'],a:0,why:'「两山」理念：绿水青山（生态）就是金山银山（经济价值），强调生态保护与经济发展的辩证统一，是生态文明建设的核心理念。'},
  {tag:'P10',subj:'pol',q:'「全过程人民民主」首次提出于？',o:['党的十八大', '2019 年习近平总书记在上海考察时', '党的二十大', '党的十九大'],a:1,why:'2019 年 11 月，习近平在上海考察时首次提出「人民民主是一种全过程的民主」。后来写入党的二十大报告。'},
  {tag:'A11',subj:'coa',q:'一条指令通常由哪两部分组成？',o:['控制码和时钟码', '操作码和地址码', '数据码和校验码', '指令码和状态码'],a:1,why:'操作码（OP）指明做什么操作，地址码指明操作数在哪里。定长指令格式简单但浪费，变长指令格式紧凑但译码复杂。'},
  {tag:'A11',subj:'coa',q:'指令字长和机器字长的关系是？',o:['指令字长一定更长', '可以相等，也可以不等（通常是整数倍）', '必须相等', '没有关系'],a:1,why:'指令字长是一条指令的二进制位数，机器字长是 CPU 一次处理的位数。半字长、单字长、双字长指令都很常见。'},
  {tag:'A11',subj:'coa',q:'零地址指令的典型应用是？',o:['立即数运算', '堆栈操作（操作数隐含在栈顶）', '内存寻址', '寄存器运算'],a:1,why:'零地址指令没有地址码，操作数隐含（如栈的 PUSH/POP、ADD 从栈顶取两个数）。堆栈型计算机大量使用。'},
  {tag:'A11',subj:'coa',q:'一地址指令通常隐含了哪个操作数？',o:['程序计数器', '栈顶', '累加器 ACC', '内存首地址'],a:2,why:'一地址指令如 ADD X：隐含一个操作数在累加器 ACC 中，另一个在 X，结果写回 ACC。早期计算机常见。'},
  {tag:'A11',subj:'coa',q:'扩展操作码技术的作用是？',o:['增加地址位数', '减少内存', '在指令字长固定时增加可表示的操作种类', '加快执行'],a:2,why:'固定字长时，操作码位数和地址码位数此消彼长。扩展操作码让「地址少的指令」用更多位表示操作码，从而增加指令种类。'},
  {tag:'A11',subj:'coa',q:'RISC 指令通常采用什么格式？',o:['定长格式（如 32 位）', '变长格式', '无固定格式', '混合格式'],a:0,why:'RISC 用定长指令（简化译码、利于流水线），操作码位置固定。CISC 常用变长指令（节省空间但译码复杂）。'},
  {tag:'A11',subj:'coa',q:'指令中的「形式地址」和「有效地址」的区别是？',o:['两者相同', '有效地址在指令中', '形式地址更大', '形式地址是指令中给出的值，有效地址是实际访存地址'],a:3,why:'形式地址（A）只是指令里的一个字段，要经过寻址方式计算才得到有效地址（EA）。如变址：EA = (IX) + A。'},
  {tag:'A11',subj:'coa',q:'指令的「地址码」个数通常受什么限制？',o:['指令字长和操作码长度的约束', '编译器', 'CPU 频率', '内存容量'],a:0,why:'一条指令的总位数固定时，操作码占得多，地址码就少。所以「三地址」「二地址」是设计取舍的结果。'},
  {tag:'A12',subj:'coa',q:'寄存器寻址和寄存器间接寻址的区别是？',o:['前者更慢', '前者操作数在寄存器，后者寄存器里存的是地址', '两者相同', '后者不需访存'],a:1,why:'寄存器寻址：EA = Ri，操作数就在寄存器（不访存）。寄存器间接：EA = (Ri)，要再访存一次取操作数。'},
  {tag:'A12',subj:'coa',q:'「基址寻址」主要用于？',o:['数组遍历', '函数调用', '程序重定位（多道程序浮动）', '循环计数'],a:2,why:'基址寄存器 BR 存程序的起始地址，EA = (BR) + A。程序换位置时只改 BR，指令不用变。这与「变址」正好相反。'},
  {tag:'A12',subj:'coa',q:'「相对寻址」的有效地址是？',o:['基址寄存器 + 形式地址', '形式地址本身', '变址寄存器 + 形式地址', 'PC + 形式地址'],a:3,why:'EA = (PC) + A，常用于转移指令（相对跳转）。优点是程序整体搬移后，相对跳转仍然正确（位置无关代码）。'},
  {tag:'A12',subj:'coa',q:'「堆栈寻址」中，操作数在哪里？',o:['寄存器', '程序区', '栈顶（由 SP 指向）', '栈底'],a:2,why:'堆栈寻址隐含使用栈指针 SP，操作数在栈顶。PUSH 时 SP 先减再存，POP 时先取再 SP 加（或相反，取决于设计）。'},
  {tag:'A12',subj:'coa',q:'「页面寻址」的特点是将地址分为？',o:['高位和低位', '页号和页内偏移', '块和字', '段和偏移'],a:1,why:'页面寻址把有效地址分成页号（高位）和页内地址（低位），通过页表转换。和虚拟存储的地址转换类似。'},
  {tag:'A12',subj:'coa',q:'立即寻址的操作数范围受什么限制？',o:['CPU 频率', '寄存器个数', '指令中地址码字段的位数', '内存大小'],a:2,why:'立即数直接放在指令里，只能用地址码字段的位数表示（如 16 位立即数）。所以立即数通常较小。'},
  {tag:'A12',subj:'coa',q:'「多次间接寻址」的问题是？',o:['访存次数多，速度慢（且可能陷入循环）', '无法实现', '占用寄存器', '不需要访存'],a:0,why:'每次间接都要访存一次，多次间接非常慢。而且如果没有终止标志，可能无限间接（死循环）。所以实际很少用多次间接。'},
  {tag:'A12',subj:'coa',q:'寻址方式中，哪种不需要访问内存？',o:['间接寻址', '变址寻址', '直接寻址', '立即寻址和寄存器寻址'],a:3,why:'立即寻址：操作数在指令中（取指时已读入）。寄存器寻址：操作数在寄存器。两者都不用额外访存，最快。'},
  {tag:'A13',subj:'coa',q:'RISC 的典型特征是？',o:['指令多、变长', '指令少、定长、寻址方式少、多寄存器', '微程序控制', '大量复杂指令'],a:1,why:'RISC 精简：指令数量少（通常 <100）、定长、寻址方式少（2-3 种）、寄存器多、硬布线控制、单周期执行（利于流水）。'},
  {tag:'A13',subj:'coa',q:'CISC 的主要优点是？',o:['单条指令功能强，程序代码短', '易于流水', '执行速度快', '硬件简单'],a:0,why:'CISC 一条指令能做很多事（如串操作、复杂寻址），所以程序短、占用内存少。但指令译码复杂，难以流水。'},
  {tag:'A13',subj:'coa',q:'RISC 为什么更适合流水线？',o:['频率更高', '指令定长、结构规整，各阶段时间均衡', '寄存器更多', '指令更少'],a:1,why:'定长指令使取指、译码简单；规整的格式让各流水段耗时接近，流水线效率高。CISC 变长指令会导致流水线停顿。'},
  {tag:'A13',subj:'coa',q:'「硬布线控制」和「微程序控制」的区别是？',o:['两者相同', '硬布线更慢', '微程序更简单', '硬布线用逻辑电路直接产生信号，微程序用存储在控存中的微指令'],a:3,why:'硬布线：速度快但不灵活（改设计要改电路）。微程序：用微指令序列实现，灵活（改微程序即可）但慢（要读控存）。RISC 多用硬布线。'},
  {tag:'A13',subj:'coa',q:'RISC 中「延迟槽」的作用是？',o:['减慢执行', '延迟中断', '缓存数据', '分支指令后的指令总被执行，填补流水线空档'],a:3,why:'分支指令要等结果才知道跳不跳，这期间流水线会空转。延迟槽规定「分支后的那条指令一定执行」，用来填这个空档。'},
  {tag:'A13',subj:'coa',q:'ARM 和 x86 分别属于？',o:['都是 RISC', 'ARM 是 RISC，x86 是 CISC', 'ARM 是 CISC', '都是 CISC'],a:1,why:'ARM（手机、嵌入式）是典型 RISC。x86（PC 服务器）是典型 CISC。但现代 x86 内部也把复杂指令译码成类 RISC 的微操作。'},
  {tag:'A13',subj:'coa',q:'RISC 中「load/store 架构」的含义是？',o:['只有 load/store 能访存，运算只在寄存器间进行', '不需要访存', '内存很少用', '只能加载不能存储'],a:0,why:'RISC 规定：算术运算的操作数必须在寄存器中，访问内存只能用 load（读）和 store（写）。这样指令规整、利于流水。'},
  {tag:'A13',subj:'coa',q:'CISC 指令变长带来的主要问题是？',o:['占用内存多', '取指和译码复杂，难以并行', '频率上不去', '寄存器不够'],a:1,why:'变长指令要先确定长度才能取下一条，译码也复杂，导致流水线难以高效运行。这是 RISC 出现的主要动因。'},
  {tag:'A14',subj:'coa',q:'汇编指令「MOV R1, R2」的含义是？',o:['交换 R1 R2', '把 R1 送到 R2', '把 R2 的值送到 R1', '比较 R1 和 R2'],a:2,why:'MOV dst, src：dst ← src。注意方向是「从右到左」。不同汇编器语法可能相反（AT&T 是左源右目标），考研通常用 Intel 语法。'},
  {tag:'A14',subj:'coa',q:'「ADD R1, R2」执行后，结果存在哪里？',o:['R1（第一个操作数）', 'R2', '内存', '累加器'],a:0,why:'两地址指令通常把结果写回第一个操作数（目的操作数）。所以 ADD R1, R2 是 R1 ← R1 + R2。'},
  {tag:'A14',subj:'coa',q:'汇编中的「标号」的作用是？',o:['寄存器名', '数据', '注释', '标记指令地址，供跳转引用'],a:3,why:'标号（label）代表某条指令的地址，如 LOOP: ... JMP LOOP。汇编器把它转换成具体地址（或相对偏移）。'},
  {tag:'A14',subj:'coa',q:'「伪指令」和机器指令的区别是？',o:['伪指令不产生机器码，只是给汇编器的指示', '两者相同', '机器指令更长', '伪指令更快'],a:0,why:'伪指令（如 DATA、EQU、ORG）告诉汇编器如何组织数据或地址，不翻译成机器码。机器指令才真正对应 CPU 操作。'},
  {tag:'A14',subj:'coa',q:'子程序调用时，返回地址保存在？',o:['指令寄存器', '栈（或特定寄存器如 LR）', '累加器', '程序计数器'],a:1,why:'CALL 指令把返回地址压栈（x86 用栈，ARM 用 LR 寄存器），RET 时弹出。这样支持嵌套调用。'},
  {tag:'A14',subj:'coa',q:'「寻址方式」在汇编中如何体现？',o:['通过伪指令', '通过标号', '通过注释', '通过操作数的书写形式（如 [R1]、#5、[R1+4]）'],a:3,why:'如 #5 是立即数，[R1] 是间接，[R1+4] 是变址/偏移。汇编器根据写法生成不同的寻址方式字段。'},
  {tag:'A14',subj:'coa',q:'「CMP R1, R2」指令通常做什么？',o:['交换两数', '计算 R1−R2 但只更新标志位，不保存结果', '把 R2 送到 R1', '相加'],a:1,why:'CMP 是「比较」：做减法但只影响标志位（ZF、SF、CF），后面跟条件跳转（如 JE、JG）。'},
  {tag:'A14',subj:'coa',q:'汇编程序转换为机器码的过程叫？',o:['链接', '解释', '编译', '汇编（assembling）'],a:3,why:'汇编器把汇编语言翻译成机器码。高级语言要先「编译」成汇编或机器码，多个目标文件再「链接」成可执行文件。'},
  {tag:'A15',subj:'coa',q:'指令流水线中「结构冒险」是指？',o:['分支跳转', '中断', '数据依赖', '多条指令争用同一硬件资源'],a:3,why:'结构冒险（资源冲突）：如两条指令同时要用 ALU 或同时访存。解决：增加资源（分离指令/数据 Cache）、停顿。'},
  {tag:'A15',subj:'coa',q:'「转发（旁路）」技术解决什么冒险？',o:['数据冒险（RAW）', '中断', '控制冒险', '结构冒险'],a:0,why:'后一条指令需要前一条的结果时，不等写回寄存器，直接把 ALU 的输出「转发」给下一条。能减少停顿但有时仍需插气泡。'},
  {tag:'A15',subj:'coa',q:'「分支预测」的作用是？',o:['减少指令数', '提高频率', '猜测分支方向，减少流水线停顿', '加快访存'],a:2,why:'控制冒险时，CPU 猜「跳不跳」，猜对就无停顿，猜错要清空流水线（代价大）。现代 CPU 预测准确率可达 95%+。'},
  {tag:'A15',subj:'coa',q:'流水线的「吞吐率」和「加速比」的关系是？',o:['两者相同', '吞吐率下降', '吞吐率提高 k 倍（k 段），但单条指令延迟不变甚至略增', '延迟减少 k 倍'],a:2,why:'k 段流水线理想吞吐率是 k 倍，但单条指令的延迟可能因为流水寄存器而略微增加。流水线优化的是「单位时间完成多少」，不是「一条多快」。'},
  {tag:'A15',subj:'coa',q:'流水线深度增加带来的问题不包括？',o:['分支预测失败代价增大', '流水寄存器开销增大', '单条指令延迟降低', '功耗上升'],a:2,why:'流水线越深，单条指令延迟**反而增加**（更多流水寄存器），且分支失败要清空更多级。所以深度不是越深越好（Pentium 4 的 31 级就是教训）。'},
  {tag:'A15',subj:'coa',q:'超标量（Superscalar）相比普通流水线的区别是？',o:['指令更少', '流水线更深', '频率更高', '每个周期可以发射多条指令（多条流水线并行）'],a:3,why:'超标量：一个周期取多条指令，有多个执行单元并行。需要硬件做「指令调度」（找无依赖的指令一起发）。'},
  {tag:'A15',subj:'coa',q:'「乱序执行」的目的是？',o:['减少指令', '加快时钟', '打乱程序语义', '在等待某条指令时先执行后面不依赖的指令'],a:3,why:'乱序执行（OoO）：遇到长延迟操作（如访存）时，先执行后面无依赖的指令，提高利用率。但结果要「按序提交」保证语义正确。'},
  {tag:'A15',subj:'coa',q:'流水线中「气泡（bubble）」是指？',o:['中断', '插入的空操作，用来等待依赖解决', '分支', '缓存失效'],a:1,why:'气泡就是一个什么都不做的周期（stall）。数据冒险无法用转发解决时（如 load-use），就要插一个气泡等结果。'},
  {tag:'A15',subj:'coa',q:'五段流水线（IF/ID/EX/MEM/WB）中，分支判断通常在哪个阶段？',o:['IF', 'ID', 'WB', 'EX（或更早的专用阶段）'],a:3,why:'经典五段流水线在 EX 段算分支结果，所以要等到 EX 才知道跳不跳（前面已取错 2 条）。现代 CPU 提前到 ID 甚至 IF 阶段做预测。'},
  {tag:'A16',subj:'coa',q:'CPU 的核心部件是？',o:['内存和硬盘', '运算器和控制器', '总线和接口', '输入和输出'],a:1,why:'CPU = 运算器（ALU + 寄存器） + 控制器（取指、译码、发信号）。Cache 现在也算在 CPU 内部，但逻辑上属于存储层次。'},
  {tag:'A16',subj:'coa',q:'程序计数器 PC 的位数决定了？',o:['数据宽度', '寄存器个数', '时钟频率', '可寻址的指令空间大小'],a:3,why:'PC 存下一条指令的地址，n 位 PC 能寻址 2^n 个指令单元。所以 PC 位数通常等于地址总线位数。'},
  {tag:'A16',subj:'coa',q:'指令寄存器 IR 的作用是？',o:['存放下一条指令地址', '存放状态标志', '暂存当前正在执行的指令', '存放运算结果'],a:2,why:'IR 保存从内存取出的指令，供译码器分析。PC 指向下一条，IR 存当前的——这是取指阶段的核心。'},
  {tag:'A16',subj:'coa',q:'通用寄存器和专用寄存器的区别是？',o:['通用更慢', '通用可编程使用，专用有固定用途', '两者相同', '专用可编程'],a:1,why:'通用寄存器（R0-R15）程序员可自由使用。专用寄存器（PC、IR、MAR、MDR、PSW）有特定功能，不能随意改。'},
  {tag:'A16',subj:'coa',q:'MAR 和 MDR 分别是什么？',o:['两个数据寄存器', '控制寄存器', '两个地址寄存器', '地址寄存器（存地址）和数据寄存器（存数据）'],a:3,why:'MAR（Memory Address Register）存要访问的内存地址，MDR（Memory Data Register）存读入/写出的数据。它们连接 CPU 和内存。'},
  {tag:'A16',subj:'coa',q:'程序状态字 PSW 中通常包含？',o:['标志位（ZF/SF/CF/OF）和中断允许位', '指令地址', '时钟', '操作数'],a:0,why:'PSW（标志寄存器）记录运算结果的状态（零、符号、进位、溢出）和系统状态（中断允许、特权级）。条件跳转依赖它。'},
  {tag:'A16',subj:'coa',q:'CPU 的主频和 CPI 的关系是？',o:['执行时间 = 指令数 × CPI / 主频', 'CPI 越高主频越高', '两者无关', '主频越高 CPI 越大'],a:0,why:'CPU 时间 = 指令数 × CPI × 时钟周期 = 指令数 × CPI / 主频。所以性能不只取决于主频（还要看 CPI 和指令数）。'},
  {tag:'A16',subj:'coa',q:'MIPS 是什么单位？',o:['每秒百万条指令', '内存带宽', '每秒百万次浮点运算', '时钟频率'],a:0,why:'MIPS = 百万指令/秒 = 主频 / (CPI × 10^6)。但不同指令集的指令不等价，所以 MIPS 跨架构比较没意义。'},
  {tag:'A17',subj:'coa',q:'数据通路是指？',o:['内存到磁盘的路径', 'CPU 内部各部件之间传送数据的路径', '网络链路', '总线宽度'],a:1,why:'数据通路包括 ALU、寄存器、多路选择器、内部总线。它决定了「一条指令的数据怎么流动」。'},
  {tag:'A17',subj:'coa',q:'单总线结构的 CPU 的主要缺点是？',o:['不能实现', '成本高', '同一时刻只能有一个数据传送，效率低', '指令少'],a:2,why:'单总线：所有部件挂一条总线，一次只能传一个数据。取两个操作数要分两次，所以需要多个时钟周期。'},
  {tag:'A17',subj:'coa',q:'多路选择器（MUX）在数据通路中的作用是？',o:['运算', '存储数据', '从多个输入中选择一个送到输出', '计时'],a:2,why:'MUX 由控制信号选择输入源（如 ALU 的 A 口来自寄存器还是 PC）。它是「数据路由」的关键部件。'},
  {tag:'A17',subj:'coa',q:'寄存器堆（Register File）的特点是？',o:['只能写', '多端口，可同时读写多个寄存器', '只能读', '只有一个端口'],a:1,why:'寄存器堆通常有 2 个读端口 + 1 个写端口，支持「同时读两个操作数、写一个结果」，这是单周期 CPU 的基础。'},
  {tag:'A17',subj:'coa',q:'单周期 CPU 相比多周期的主要问题是？',o:['寄存器不够', '指令少', '时钟周期必须按最慢的指令设计，快指令浪费', '不能流水'],a:2,why:'单周期：每条指令一个时钟周期，周期长度取决于最慢的指令（如 load）。所以简单指令（如 add）浪费了大量时间。'},
  {tag:'A17',subj:'coa',q:'多周期 CPU 的优点是？',o:['更简单', '不需要控制', '寄存器更少', '不同指令用不同周期数，时钟周期可以更短'],a:3,why:'多周期把指令拆成取指、译码、执行等阶段，每阶段一个短周期。快指令用少周期，慢指令用多周期，整体效率更高。'},
  {tag:'A17',subj:'coa',q:'数据通路中「零检测」通常用于？',o:['除法', '条件分支（判断结果是否为零）', '访存', '乘法'],a:1,why:'BEQ 指令需要判断两个寄存器是否相等（相减为零）。零检测器把 ALU 的零标志送给控制逻辑，决定是否跳转。'},
  {tag:'A17',subj:'coa',q:'「立即数扩展」的作用是？',o:['增加指令', '把指令中的短立即数扩展成完整字长', '缩短程序', '加快时钟'],a:1,why:'指令里立即数只有 16 位，而 ALU 是 32 位。需要符号扩展（高位补符号位）或零扩展（补 0）后才能参与运算。'},
  {tag:'A18',subj:'coa',q:'控制器的基本功能是？',o:['执行运算', '存储数据', '根据指令产生控制信号，协调各部件', '传输数据'],a:2,why:'控制器是「指挥中心」：取指 → 译码 → 按指令类型发出控制信号（读寄存器、ALU 运算、写内存……）。'},
  {tag:'A18',subj:'coa',q:'硬布线控制器的优点是？',o:['实现简单', '灵活易改', '速度快（纯组合逻辑）', '成本低'],a:2,why:'硬布线用门电路直接产生信号，延迟小、速度快。但指令集一变就要重新设计电路，不灵活。RISC 常用。'},
  {tag:'A18',subj:'coa',q:'微程序控制器的核心思想是？',o:['用软件模拟', '把控制信号编成微指令，存在控制存储器里', '用纯电路产生信号', '不需要时钟'],a:1,why:'一条机器指令对应一段微程序（微指令序列）。执行时逐条读微指令，产生控制信号。灵活（改微程序即可）但慢（要读控存）。'},
  {tag:'A18',subj:'coa',q:'微指令和机器指令的关系是？',o:['微指令更高级', '两者相同', '一条机器指令由多条微指令实现', '机器指令在控存里'],a:2,why:'机器指令是程序员看到的，微指令是硬件执行的。一条机器指令（如 ADD）对应若干条微指令（取指、取数、运算、写回）。'},
  {tag:'A18',subj:'coa',q:'「微程序入口地址」由什么决定？',o:['寄存器编号', '程序计数器', '时钟频率', '机器指令的操作码'],a:3,why:'译码器把操作码映射成微程序的起始地址（入口），然后顺序执行微指令。这是「操作码 → 微程序」的对应关系。'},
  {tag:'A18',subj:'coa',q:'水平型微指令和垂直型微指令的区别是？',o:['两者相同', '垂直型更快', '水平型更短', '水平型并行控制多个部件（长），垂直型类似机器指令（短）'],a:3,why:'水平型微指令：一位控制一个部件，可并行，微程序短但微指令长。垂直型：编码紧凑，微指令短但微程序长。'},
  {tag:'A18',subj:'coa',q:'「时序信号」在控制器中的作用是？',o:['规定各操作的先后顺序', '传输数据', '存储指令', '提供电源'],a:0,why:'时序信号（时钟、节拍）决定「什么时候做什么」。同一时刻不能既读又写，靠时序错开。'},
  {tag:'A18',subj:'coa',q:'控制信号「RegWrite」的作用是？',o:['允许写寄存器堆', '跳转', '读内存', 'ALU 运算'],a:0,why:'RegWrite = 1 时，写端口的数据在时钟边沿写入目标寄存器。这是「写回」阶段的控制信号。'},
  {tag:'A19',subj:'coa',q:'中断和异常的区别是？',o:['两者相同', '中断更快', '中断来自外部（异步），异常来自指令执行（同步）', '异常在外部'],a:2,why:'中断（外中断）：I/O 完成、时钟等外部事件，与当前指令无关。异常（内中断）：缺页、除零、溢出等由指令引起。'},
  {tag:'A19',subj:'coa',q:'「中断隐指令」是指？',o:['宏指令', '硬件自动完成的操作（保存断点、关中断、跳转）', '一条特殊指令', '伪指令'],a:1,why:'中断响应时，CPU 硬件自动完成：保存 PC（断点）、关中断、跳转到中断服务程序。这些操作没有对应指令，叫「隐指令」。'},
  {tag:'A19',subj:'coa',q:'中断向量表存放的是？',o:['中断次数', '中断优先级', '各中断服务程序的入口地址', '中断屏蔽字'],a:2,why:'按中断号索引，存处理程序入口。CPU 响应中断后查表跳转。这样增加中断类型不用改硬件。'},
  {tag:'A19',subj:'coa',q:'「中断嵌套」的前提是？',o:['高优先级中断可以打断低优先级的处理', '中断不能嵌套', '关中断', '所有中断同级'],a:0,why:'中断嵌套：处理低优先级中断时，高优先级中断可以打断它。需要「中断优先级」和「开中断」（允许嵌套）。'},
  {tag:'A19',subj:'coa',q:'「保存现场」是指？',o:['加密数据', '保存到 Cache', '保存到磁盘', '把当前程序的寄存器、PC 等压栈'],a:3,why:'中断/异常发生时，要先保存当前程序的执行状态（寄存器、PC、PSW），处理完再恢复，否则原程序无法继续。'},
  {tag:'A19',subj:'coa',q:'「不可屏蔽中断」（NMI）的特点是？',o:['优先级最低', '只用于 I/O', '不受中断允许位控制，必须响应', '可以被屏蔽'],a:2,why:'NMI 用于严重错误（如内存校验错、电源故障），不能被 CLI 关掉。普通中断（可屏蔽）受 IF 标志控制。'},
  {tag:'A19',subj:'coa',q:'陷阱（trap）和故障（fault）的区别是？',o:['故障不可恢复', '两者相同', '陷阱是错误', '陷阱是故意的（如系统调用），故障可恢复（如缺页）'],a:3,why:'陷阱：执行指令主动触发（INT 指令、断点），返回时执行下一条。故障：指令执行中出错但可恢复（缺页），返回时重新执行该指令。'},
  {tag:'A19',subj:'coa',q:'中断优先级的作用是？',o:['多个中断同时请求时决定先响应谁', '决定中断类型', '决定中断次数', '决定中断地址'],a:0,why:'优先级高的先响应。硬件排队器或软件查询实现。注意：优先级高的可以打断优先级低的处理（嵌套）。'},
  {tag:'A20',subj:'coa',q:'多核处理器相比单核的主要优势是？',o:['缓存更大', '真正的并行执行（多个线程同时跑）', '主频更高', '功耗更低'],a:1,why:'多核可以同时执行多个线程（真并行），而单核只能靠时间片轮流（并发）。但需要程序支持并行（多线程）。'},
  {tag:'A20',subj:'coa',q:'「缓存一致性」问题出现在？',o:['单核', '内存不足', '磁盘慢', '多个核心各有 Cache，同一数据可能不一致'],a:3,why:'多核各有 L1/L2，同一内存地址可能在不同 Cache 里有不同值。需要协议（MESI）保证一致性：写一个核心的 Cache 要通知其他核心失效。'},
  {tag:'A20',subj:'coa',q:'SMT（同时多线程）是指？',o:['多线程编程', '多进程', '一个物理核模拟多个逻辑核，共享执行单元', '多个物理核'],a:2,why:'SMT（如 Intel 超线程）：一个核心有两套寄存器状态，当一个线程停顿时另一个线程用执行单元。提升利用率但不等同真双核。'},
  {tag:'A20',subj:'coa',q:'「内存屏障」的作用是？',o:['加快内存', '保证多核环境下的内存访问顺序', '增加容量', '减少功耗'],a:1,why:'编译器和 CPU 会重排指令，多核下可能导致可见性问题。内存屏障（fence）强制顺序，保证其他核心看到正确的写入顺序。'},
  {tag:'A20',subj:'coa',q:'GPU 与 CPU 的设计差异是？',o:['GPU 大量简单核心（吞吐优先），CPU 少量复杂核心（延迟优先）', 'CPU 核心更多', '两者相同', 'GPU 更快'],a:0,why:'CPU：少数强核 + 大缓存，优化「单线程延迟」。GPU：数千简单核，优化「吞吐量」（适合图形、矩阵运算）。'},
  {tag:'A20',subj:'coa',q:'「异构计算」是指？',o:['CPU + GPU/加速器协同工作', '只有 GPU', '多台电脑', '只有 CPU'],a:0,why:'异构：CPU 做逻辑控制，GPU/FPGA/NPU 做并行计算，通过 PCIe 或统一内存协作。AI 训练就是典型的异构计算。'},
  {tag:'A20',subj:'coa',q:'Amdahl 定律说明？',o:['并行无限加速', '核心越多越快', '并行加速受串行部分限制', '与串行无关'],a:2,why:'加速比 = 1 / (S + P/N)，S 是串行比例。若 10% 串行，无论多少核，加速比最多 10 倍。这是并行编程的根本约束。'},
  {tag:'A20',subj:'coa',q:'多核编程中「伪共享」是指？',o:['不同核心的变量落在同一 Cache 行，互相干扰', '缓存失效', '死锁', '共享内存'],a:0,why:'两个核心分别改不同变量，但这两个变量在同一 Cache 行。一个核写会导致另一个核的整行失效（虽然变量不同），性能骤降。解决：填充对齐。'},
  {tag:'A21',subj:'coa',q:'系统总线按功能分为哪三类？',o:['数据总线、地址总线、控制总线', '同步总线、异步总线', '串行总线、并行总线', '内总线、外总线、片总线'],a:0,why:'数据总线（双向，传数据）、地址总线（单向，CPU 发出）、控制总线（双向，传控制信号）。三者宽度共同决定系统性能。'},
  {tag:'A21',subj:'coa',q:'地址总线的宽度决定了？',o:['时钟频率', '中断数量', '可寻址的内存空间大小', '数据传输速率'],a:2,why:'n 根地址线可寻址 2^n 个单元。32 位地址线 → 4GB 空间。所以 32 位系统最大支持 4GB 内存。'},
  {tag:'A21',subj:'coa',q:'数据总线的宽度影响？',o:['中断优先级', '一次能传输的数据量和传输速率', '可寻址空间', '指令种类'],a:1,why:'8 位数据总线一次传 1 字节，64 位一次传 8 字节。宽度越大，单位时间传输越多，但成本也越高。'},
  {tag:'A21',subj:'coa',q:'总线的「带宽」计算公式是？',o:['频率 / 宽度', '总线宽度 × 频率', '宽度 + 频率', '总线宽度 × 总线频率 / 8'],a:3,why:'如 64 位宽、100MHz：64/8 × 100M = 800MB/s。注意除以 8 是把位换算成字节。'},
  {tag:'A21',subj:'coa',q:'「总线复用」技术的作用是？',o:['用一组线分时传地址和数据，减少引脚数', '降低成本', '增加地址空间', '提高带宽'],a:0,why:'总线复用：同一组线先传地址（用 ALE 锁存），再传数据。减少引脚（如 8086 的地址数据复用），但速度略降。'},
  {tag:'A21',subj:'coa',q:'「总线主设备」和「从设备」的区别是？',o:['两者相同', '主设备能发起总线传输，从设备只能响应', '从设备更快', '主设备只读'],a:1,why:'主设备（Master）：CPU、DMA 控制器——能主动发起读/写。从设备（Slave）：内存、I/O 接口——被动响应。'},
  {tag:'A21',subj:'coa',q:'「总线宽度」与「总线带宽」的关系是？',o:['宽度越大带宽越低', '两者相同', '带宽 = 宽度 × 频率，宽度越大带宽越高', '无关'],a:2,why:'宽度是「一次传多少位」，带宽是「每秒传多少」。二者成正比，但带宽还受频率和传输效率（有无等待周期）影响。'},
  {tag:'A21',subj:'coa',q:'现代计算机采用「多级总线」结构的原因是？',o:['降低成本', '增加引脚', '不同设备速度差异大，分级匹配', '简化设计'],a:2,why:'CPU 快、内存中、I/O 慢。用「CPU 总线 / 系统总线 / I/O 总线」分级，各段按自己的速度工作，通过桥接芯片转换。'},
  {tag:'A22',subj:'coa',q:'总线仲裁的作用是？',o:['减少引脚', '多个主设备竞争总线时决定谁先用', '加密数据', '提高带宽'],a:1,why:'多个主设备（CPU、DMA、协处理器）可能同时请求总线。仲裁器按优先级或公平策略分配，避免冲突。'},
  {tag:'A22',subj:'coa',q:'「集中式仲裁」和「分布式仲裁」的区别是？',o:['集中式有专门的仲裁器，分布式各设备自己协商', '集中式不需要仲裁', '两者相同', '分布式更慢'],a:0,why:'集中式：一个仲裁器统一裁决（链式查询、计数器定时查询、独立请求）。分布式：各设备通过共享信号线自己仲裁。'},
  {tag:'A22',subj:'coa',q:'「链式查询」仲裁的缺点是？',o:['太慢', '太贵', '不能实现', '优先级固定，靠前的设备优先，且断链影响后面'],a:3,why:'链式（菊花链）：仲裁信号串行传递，越靠近仲裁器的设备优先级越高。一个设备故障可能导致后面全断。'},
  {tag:'A22',subj:'coa',q:'同步总线定时的特点是？',o:['靠握手信号', '速度可变', '不需要时钟', '所有设备按统一时钟节拍工作'],a:3,why:'同步总线：统一时钟，传输时间固定。优点是简单快速，缺点是不能适应慢设备（要么加等待周期，要么不能用）。'},
  {tag:'A22',subj:'coa',q:'异步总线定时的特点是？',o:['不需要控制线', '靠「请求-应答」握手信号协调', '速度固定', '统一时钟'],a:1,why:'异步总线用 REQ/ACK 握手，快慢设备都能适配（慢设备就多等）。缺点是握手信号增加开销，速度略慢于同步。'},
  {tag:'A22',subj:'coa',q:'「半同步总线」是哪种折中？',o:['无时钟', '完全同步', '完全异步', '同步时钟 + 等待信号，兼顾速度和兼容性'],a:3,why:'半同步：基本按时钟同步，但允许慢设备发 WAIT 信号延长周期。兼顾同步的效率和异步的兼容性。'},
  {tag:'A22',subj:'coa',q:'总线传输的一个「总线周期」通常包含？',o:['只有传输', '申请、寻址、传输、结束', '只有申请', '只有寻址'],a:1,why:'完整周期：主设备申请总线 → 发地址 → 传数据（可能多拍）→ 释放总线。DMA 传输会占用多个周期。'},
  {tag:'A22',subj:'coa',q:'「总线瓶颈」通常出现在？',o:['Cache 内部', 'CPU 内部', '寄存器之间', '高速设备与低速总线不匹配时'],a:3,why:'如 CPU 每秒要传几十 GB，但系统总线只有几 GB/s，就形成瓶颈。解决：提高总线宽度/频率、加 Cache、用点对点互连（PCIe）。'},
  {tag:'A23',subj:'coa',q:'I/O 接口的基本功能不包括？',o:['状态报告', '执行算术运算', '地址译码', '数据缓冲'],a:1,why:'I/O 接口负责：数据缓冲（速度匹配）、地址译码（选中设备）、状态报告（忙/闲）、控制逻辑、格式转换。算术运算由 CPU/ALU 做。'},
  {tag:'A23',subj:'coa',q:'I/O 端口编址中「统一编址」和「独立编址」的区别是？',o:['统一编址需要专门指令', '统一编址与内存共用地址空间，独立编址单独空间', '两者相同', '独立编址更快'],a:1,why:'统一编址（内存映射 I/O）：I/O 寄存器占内存地址，用普通访存指令。独立编址：单独的 I/O 空间，需专门指令（IN/OUT）。'},
  {tag:'A23',subj:'coa',q:'「内存映射 I/O」的优点是？',o:['可用普通访存指令操作 I/O，编程简单', '速度更快', '节省地址', '不需要译码'],a:0,why:'内存映射 I/O 把设备寄存器当地址访问，程序员用普通 load/store 即可。缺点是要占用内存地址空间。'},
  {tag:'A23',subj:'coa',q:'I/O 接口中的「数据缓冲寄存器」作用是？',o:['存储程序', '匹配 CPU 和设备的速差', '译码地址', '产生中断'],a:1,why:'CPU 快、设备慢。数据先放缓冲区，CPU 写完就走，设备慢慢取。避免 CPU 等待慢设备。'},
  {tag:'A23',subj:'coa',q:'「状态寄存器」中通常有哪些位？',o:['指令', '地址', '忙/闲、就绪、错误', '数据'],a:2,why:'状态寄存器告诉 CPU 设备的当前状态：忙（BUSY）、就绪（READY）、错误（ERROR）。CPU 轮询或中断就是看这些位。'},
  {tag:'A23',subj:'coa',q:'「控制寄存器」的作用是？',o:['CPU 通过它向设备发命令（启动、复位等）', '存地址', '存状态', '存数据'],a:0,why:'控制寄存器接收 CPU 的命令：启动传输、设置模式、复位。它是「CPU → 设备」方向的通道。'},
  {tag:'A23',subj:'coa',q:'「设备控制器」和「设备接口」的关系是？',o:['两者相同', '接口更复杂', '控制器是接口的核心电路，负责协议转换', '控制器在设备外部'],a:2,why:'设备控制器（如磁盘控制器、网卡芯片）实现设备协议，向 CPU 提供标准接口。接口是「控制器对外呈现的样子」。'},
  {tag:'A23',subj:'coa',q:'「即插即用」（PnP）依赖什么？',o:['设备能被自动识别和配置（如 PCI 的配置空间）', '专用驱动', '固定地址', '手动设置跳线'],a:0,why:'PnP 需要硬件支持：设备有唯一 ID、可读的配置空间（PCI 有 256 字节配置头），OS 自动分配地址和中断。'},
  {tag:'A24',subj:'coa',q:'程序查询（轮询）方式的缺点是？',o:['数据会丢', 'CPU 忙等，浪费大量时间', '硬件复杂', '不能实现'],a:1,why:'轮询：CPU 不断查状态寄存器，直到设备就绪。CPU 在这期间什么也做不了（忙等），利用率极低。'},
  {tag:'A24',subj:'coa',q:'中断方式相比轮询的改进是？',o:['硬件更简单', '设备就绪时主动通知 CPU，CPU 不用等', '不需要驱动', '速度更快'],a:1,why:'中断：CPU 发命令后继续干别的，设备完成时发中断。CPU 利用率大幅提高。但每个字节都要中断一次，开销仍大。'},
  {tag:'A24',subj:'coa',q:'DMA 方式的核心特点是？',o:['不需要内存', 'CPU 逐字节搬运', '设备直接与内存交换数据，CPU 只在开始/结束参与', '不需要控制器'],a:2,why:'DMA：CPU 设置好源/目的/长度后启动，DMA 控制器直接在内存和设备间搬数据，传完发一次中断。CPU 解放。'},
  {tag:'A24',subj:'coa',q:'DMA 传输时，CPU 和 DMA 争用总线怎么解决？',o:['不用解决', 'DMA 等待', '周期挪用（DMA 偷一个周期）或成组传输', 'CPU 暂停所有工作'],a:2,why:'周期挪用：DMA 趁 CPU 不用总线的周期传一个数据。成组传输：DMA 连续占用总线传完一块（CPU 暂停访存）。'},
  {tag:'A24',subj:'coa',q:'DMA 方式中，数据传送的方向由谁控制？',o:['CPU 每个字节', 'DMA 控制器（不需要 CPU 逐字节干预）', '内存', '设备自己'],a:1,why:'DMA 控制器内含地址计数器和字节计数器，自动递增地址、递减计数，直到传完。CPU 只在初始化时设置参数。'},
  {tag:'A24',subj:'coa',q:'通道（Channel）方式相比 DMA 的进步是？',o:['不需要内存', '速度更快', '不需要中断', '通道是专用处理器，能执行通道程序，管理多台设备'],a:3,why:'通道（I/O 处理机）：有自己的一套指令（通道程序），能独立管理多台设备的 I/O，CPU 只需发一条「启动通道」指令。'},
  {tag:'A24',subj:'coa',q:'「中断向量」和「DMA 中断」的区别是？',o:['DMA 传输完成后用一次中断通知，不是每字节都中断', 'DMA 不用中断', '中断向量用于 DMA', '两者相同'],a:0,why:'DMA 只在整块传完后中断一次（告诉 CPU「传完了」）。而中断方式每传一个字节就中断一次。这是效率差异的关键。'},
  {tag:'A24',subj:'coa',q:'I/O 方式按 CPU 参与度从高到低排序是？',o:['轮询 > 中断 > DMA > 通道', '通道 > DMA > 中断 > 轮询', '中断 > 轮询 > DMA', '都一样'],a:0,why:'轮询：CPU 全程忙等。中断：每字节打断一次。DMA：只开始结束参与。通道：几乎不参与（有自己的处理器）。'},
  {tag:'A25',subj:'coa',q:'磁盘的「寻道时间」是指？',o:['磁头移动到目标磁道的时间', '传输数据', '启动电机', '等待扇区旋转到位'],a:0,why:'寻道时间（seek）通常最长（毫秒级）。旋转延迟（等扇区转到磁头下）平均半圈。传输时间最短。'},
  {tag:'A25',subj:'coa',q:'磁盘容量计算公式是？',o:['柱面数 × 字节数', '磁头数 × 扇区数', '转速 × 容量', '磁头数 × 柱面数 × 每道扇区数 × 每扇区字节数'],a:3,why:'容量 = 磁头数（盘面数）× 柱面数（每面磁道数）× 每道扇区数 × 512（常见扇区大小）。'},
  {tag:'A25',subj:'coa',q:'RAID 0 的容量利用率是？',o:['100%', '1/N', '(N-1)/N', '50%'],a:0,why:'RAID 0 条带化，无冗余，所有盘容量都用来存数据。速度快但一块坏全丢。'},
  {tag:'A25',subj:'coa',q:'RAID 1 的容量利用率是？',o:['1/N', '50%', '100%', '(N-1)/N'],a:1,why:'RAID 1 镜像：每份数据存两份，利用率 50%。可靠性高（允许坏一块），但成本高。'},
  {tag:'A25',subj:'coa',q:'RAID 5 至少需要几块盘？',o:['2 块', '4 块', '5 块', '3 块'],a:3,why:'RAID 5 需要至少 3 块：2 块存数据 + 1 块存校验（校验分布在所有盘上）。允许坏 1 块。'},
  {tag:'A25',subj:'coa',q:'RAID 5 能容忍几块盘故障？',o:['0 块', '1 块', '2 块', '3 块'],a:1,why:'RAID 5 用单重校验，允许 1 块盘故障。RAID 6 用双重校验，允许 2 块。RAID 0 不能容忍任何故障。'},
  {tag:'A25',subj:'coa',q:'「磁盘缓存」的主要作用是？',o:['增加容量', '预读和延迟写，减少机械操作', '提高转速', '降低噪音'],a:1,why:'磁盘控制器有缓存：读时预取相邻扇区（空间局部性），写时先写缓存再批量写盘（减少寻道）。'},
  {tag:'A25',subj:'coa',q:'SSD 的「写放大」是指？',o:['写入速度变慢', '容量变小', '功耗增加', '实际写入闪存的数据量大于主机请求的数据量'],a:3,why:'Flash 必须先擦除整块才能写，改一个字节可能要搬移整块数据（垃圾回收），导致实际写入量大于请求量。磨损均衡也会加剧。'},
  {tag:'O11',subj:'os',q:'内存管理的四个基本功能是？',o:['读写、计算、存储、传输', '创建、调度、终止、回收', '分配回收、地址转换、空间扩充、存储保护', '编译、链接、加载、运行'],a:2,why:'内存管理：① 分配与回收；② 地址变换（逻辑→物理）；③ 扩充（虚拟存储）；④ 保护与共享。'},
  {tag:'O11',subj:'os',q:'「逻辑地址」和「物理地址」的区别是？',o:['两者相同', '物理地址在程序中', '逻辑地址更大', '逻辑地址是程序看到的，物理地址是内存单元的'],a:3,why:'逻辑地址（虚拟地址）从 0 开始编址，程序里用的都是它。物理地址是实际内存单元的编号，由 MMU 转换得到。'},
  {tag:'O11',subj:'os',q:'「静态重定位」和「动态重定位」的区别是？',o:['两者相同', '静态更快', '动态不需要硬件', '静态在装入时一次性转换，动态在运行时每次转换'],a:3,why:'静态重定位：装入时把地址全改好，程序不能移动。动态重定位：运行时由硬件（重定位寄存器）转换，程序可移动、可共享。'},
  {tag:'O11',subj:'os',q:'「内碎片」和「外碎片」的区别是？',o:['外碎片在分区内', '内碎片在分区内部浪费，外碎片是分区之间的零散空闲', '内碎片更大', '两者相同'],a:1,why:'内碎片：分配给进程但没用完的空间（如分页的最后一页）。外碎片：分区之间太小无法分配的零散空间（如连续分配）。'},
  {tag:'O11',subj:'os',q:'连续分配方式的主要缺点是？',o:['速度慢', '产生外碎片，且难以扩充', '不能实现', '需要硬件'],a:1,why:'连续分配要求进程占一片连续内存。反复分配回收后产生大量零散外碎片，需要「紧凑」来合并（开销大）。'},
  {tag:'O11',subj:'os',q:'「首次适应」和「最佳适应」算法的区别是？',o:['首次找第一个够大的，最佳找最小的够大的', '两者相同', '最佳更快', '首次更省空间'],a:0,why:'首次适应（First Fit）：从头找第一个满足的，快但低地址碎片多。最佳适应（Best Fit）：找最小的满足的，省空间但产生小碎片。'},
  {tag:'O11',subj:'os',q:'「最坏适应」算法的特点是？',o:['总是分配最大的空闲块，减少小碎片', '最省空间', '不产生碎片', '最快'],a:0,why:'最坏适应（Worst Fit）：选最大的分区，剩余部分仍较大可继续用。减少小碎片，但大分区很快被消耗。'},
  {tag:'O11',subj:'os',q:'「紧凑（Compaction）」技术的前提是？',o:['支持动态重定位（程序可移动）', '不需要硬件', '程序不能移动', '内存足够'],a:0,why:'紧凑把零散的空闲区合并成一个大块，但需要移动程序。只有支持动态重定位（重定位寄存器可改）才能做。'},
  {tag:'O11',subj:'os',q:'「覆盖」和「交换」技术的目的都是？',o:['增加内存', '减少磁盘', '在有限内存中运行更大的程序', '加快速度'],a:2,why:'覆盖（Overlay）：程序内部按调用关系分段，只装入当前需要的段。交换（Swapping）：整个进程在内存和磁盘间换入换出。'},
  {tag:'O12',subj:'os',q:'页表项中通常包含哪些字段？',o:['页框号、有效位、访问位、脏位、保护位', '只有有效位', '只有权限', '只有页框号'],a:0,why:'页表项：物理页框号（核心）、有效位（在不在内存）、访问位（给 LRU）、脏位（给写回）、保护位（读写执行权限）。'},
  {tag:'O12',subj:'os',q:'「两级页表」的地址转换需要几次访存？',o:['四次', '一次', '两次查页表 + 一次取数据 = 三次（无 TLB 时）', '两次'],a:2,why:'两级页表：先查一级页表（1 次访存）→ 查二级页表（1 次）→ 取数据（1 次）。所以 TLB 命中率很重要。'},
  {tag:'O12',subj:'os',q:'「反置页表」的优点是？',o:['支持更多进程', '不需要硬件', '转换更快', '页表大小只与物理内存有关，与进程数无关'],a:3,why:'反置页表：整个系统一张表，每个物理页框一项（记录哪个进程的哪个虚拟页）。节省空间，但查找慢（要搜索）。'},
  {tag:'O12',subj:'os',q:'分段系统中，段表项包含？',o:['段号、段长、基址、保护位', '只有基址', '只有段长', '只有段号'],a:0,why:'段表项：段长（用于越界检查）、基址（段的起始物理地址）、保护位。段号隐含在索引中。'},
