  {tag:'O12',subj:'os',q:'段页式系统中，地址转换的顺序是？',o:['先查页表再查段表', '只查段表', '只查页表', '先查段表找页表，再查页表找页框'],a:3,why:'段页式：逻辑地址 = 段号 + 段内页号 + 页内偏移。先查段表得到该段的页表地址，再查页表得到页框号。'},
  {tag:'O12',subj:'os',q:'「快表（TLB）」通常用什么实现？',o:['普通 RAM', '相联存储器（按内容并行查找）', '磁盘', '寄存器堆'],a:1,why:'TLB 用相联存储器（CAM），可以按内容（页号）并行比较所有表项，一次找到匹配项。所以 TLB 查找很快。'},
  {tag:'O12',subj:'os',q:'TLB 中通常保存什么？',o:['程序代码', '最近用过的页表项（页号 → 页框号）', '整个页表', '所有页表项'],a:1,why:'TLB 只存最近访问的少量页表项（几十到几百条）。利用局部性：程序访问的页面集中，所以命中率高。'},
  {tag:'O12',subj:'os',q:'「页表寄存器」（PTBR）的作用是？',o:['存页框号', '存偏移', '存放当前进程页表的起始地址', '存页号'],a:2,why:'PTBR（页表基址寄存器）指向当前进程的页表。进程切换时要更新 PTBR，并刷新 TLB（或加 ASID 区分）。'},
  {tag:'O13',subj:'os',q:'虚拟内存的容量受什么限制？',o:['CPU 频率', '物理内存大小', '地址位数（虚拟地址空间）和磁盘空间', '页表大小'],a:2,why:'虚拟地址空间由 CPU 地址位数决定（32 位 → 4GB/进程）。实际能用的还受磁盘（交换区）大小限制。'},
  {tag:'O13',subj:'os',q:'「请求分页」和「基本分页」的区别是？',o:['请求分页只装入需要的页，缺页时再调入', '基本分页不需要页表', '请求分页更快', '两者相同'],a:0,why:'基本分页：进程全部装入内存才能运行。请求分页：只装入部分页，访问到不在内存的页时触发缺页中断，再从磁盘调入。'},
  {tag:'O13',subj:'os',q:'缺页中断处理完成后，CPU 会？',o:['终止进程', '执行下一条指令', '跳过该指令', '重新执行引发缺页的那条指令'],a:3,why:'缺页是「指令执行中」发现的，此时指令还没完成。所以调入页面后要**重新执行**这条指令（不是跳到下一条）。'},
  {tag:'O13',subj:'os',q:'「页面抖动（颠簸）」的根本原因是？',o:['CPU 太快', '分配给进程的页框数少于其工作集', '内存太大', '页表太小'],a:1,why:'页框不够 → 刚换出的页马上又要用 → 频繁缺页 → CPU 利用率骤降。解决：增加页框、降低多道度、工作集模型。'},
  {tag:'O13',subj:'os',q:'「工作集模型」的作用是？',o:['增加容量', '减少页表', '加快转换', '根据程序近期访问的页集合，决定分配多少页框'],a:3,why:'工作集 W(t, Δ)：最近 Δ 时间内访问过的页集合。分配页框数应 ≥ 工作集大小，否则会抖动。Δ 太大浪费，太小会抖动。'},
  {tag:'O13',subj:'os',q:'「写时复制」（COW）在 fork 中的应用是？',o:['fork 时全部复制', 'fork 不复制', '只复制代码段', '父子进程共享页面，任一方写入时才复制该页'],a:3,why:'fork 后父子共享所有页面（只读）。当任一方写某页时，触发保护异常，内核复制该页再写。大幅加快 fork（如 shell 启动程序）。'},
  {tag:'O13',subj:'os',q:'「内存映射文件」（mmap）的作用是？',o:['把文件映射到地址空间，像访问内存一样读写文件', '加密文件', '减少内存', '加快磁盘'],a:0,why:'mmap 把文件的一段映射到进程地址空间。读写内存就是读写文件（由 OS 在背后同步）。用于大文件处理、共享内存。'},
  {tag:'O13',subj:'os',q:'「页面大小」对性能的影响是？',o:['页大减少页表项但增加内碎片，页小相反', '页越小越好', '页越大越好', '无影响'],a:0,why:'页大：页表小、TLB 覆盖范围大、I/O 效率高，但内碎片多。页小：碎片少，但页表大、缺页频繁。通常 4KB。'},
  {tag:'O14',subj:'os',q:'OPT（最佳置换）算法为什么无法实现？',o:['需要预知未来的访问序列', '太占内存', '需要特殊硬件', '太慢'],a:0,why:'OPT 置换「将来最久不被访问」的页，理论上缺页最少，但需要知道未来。所以只用作理论基准（评价其他算法）。'},
  {tag:'O14',subj:'os',q:'FIFO 算法产生 Belady 异常的原因是？',o:['缺页率不随页框数单调递减', '算法太慢', '页表太小', '实现错误'],a:0,why:'FIFO 不是「栈式算法」：增加页框可能改变置换顺序，导致缺页反而增多。LRU 和 OPT 是栈式算法，不会有此异常。'},
  {tag:'O14',subj:'os',q:'LRU 算法的实现通常需要？',o:['按页号排序', '按装入顺序', '记录每页的访问时间，或维护访问栈/链表', '随机选择'],a:2,why:'LRU 需要硬件支持（访问位 + 时钟）或软件维护链表。开销比 FIFO 大，但缺页率接近 OPT。'},
  {tag:'O14',subj:'os',q:'「时钟（Clock）算法」是哪种算法的近似？',o:['FIFO', 'LRU（用访问位循环扫描）', 'OPT', '随机'],a:1,why:'时钟算法：页面排成环，指针扫描。访问位为 1 则清零并跳过，为 0 则置换。它是 LRU 的低开销近似（二次机会）。'},
  {tag:'O14',subj:'os',q:'「改进型时钟算法」还考虑了哪个位？',o:['保护位', '修改位（脏位），优先置换未修改的页', '访问位', '有效位'],a:1,why:'改进型：优先淘汰「未访问且未修改」的页（不用写回磁盘）。四类优先级：(0,0) > (0,1) > (1,0) > (1,1)。'},
  {tag:'O14',subj:'os',q:'「工作集置换」和「局部置换」的区别是？',o:['局部更省', '工作集按进程的工作集决定去留，局部只在本进程页中选', '工作集更快', '两者相同'],a:1,why:'局部置换：只在被缺页进程自己的页中选牺牲者。全局置换：可在所有进程的页中选（可能「偷」别人的页）。'},
  {tag:'O14',subj:'os',q:'缺页率与分配的页框数的关系是？',o:['线性关系', '页框越多，缺页率越低（但边际递减）', '页框越多缺页越多', '无关'],a:1,why:'分配更多页框能降低缺页，但超过工作集后收益递减。而页框有限，给一个进程多了，别的就少了。'},
  {tag:'O14',subj:'os',q:'「预调页」策略的作用是？',o:['提前把将要用的页调入，减少缺页', '降低功耗', '减少内存', '加快 CPU'],a:0,why:'预调页：根据局部性，一次调入多个相邻页。适合顺序访问（如程序启动时）。但如果预调的不常用，反而浪费。'},
  {tag:'O15',subj:'os',q:'「共享内存」在虚拟存储中如何实现？',o:['复制多份', '用网络传输', '用磁盘中转', '多个进程的页表指向同一物理页框'],a:3,why:'共享内存：不同进程的虚拟页映射到**同一个物理页框**。一个进程写，另一个立刻看到。需要同步（信号量）。'},
  {tag:'O15',subj:'os',q:'「写时复制」共享页面的标记是？',o:['设为可写', '标记为脏', '页表项设为只读，写入时触发保护异常', '标记为无效'],a:2,why:'COW 页面在页表中标记为「只读 + 共享」。当进程试图写时，CPU 触发保护异常，内核复制该页并改为可写。'},
  {tag:'O15',subj:'os',q:'「内存保护」通常通过什么实现？',o:['密码', '页表项中的保护位（读/写/执行）', '物理隔离', '加密'],a:1,why:'每个页表项有保护位：可读、可写、可执行。越权访问触发异常（如段错误 SIGSEGV）。'},
  {tag:'O15',subj:'os',q:'「地址空间布局随机化」（ASLR）的作用是？',o:['随机化代码/栈/堆的基址，增加攻击难度', '加密数据', '减少内存', '加快程序'],a:0,why:'ASLR 让每次运行的程序基址不同，攻击者无法硬编码地址（防缓冲区溢出攻击）。代价是调试稍难。'},
  {tag:'O15',subj:'os',q:'「栈溢出」攻击的原理是？',o:['栈太小', '内存不足', '覆盖函数返回地址，跳转到恶意代码', '递归太深'],a:2,why:'栈上缓冲区溢出会覆盖相邻的返回地址。攻击者精心构造数据，让返回地址指向自己的 shellcode。防护：栈保护（canary）、NX 位。'},
  {tag:'O15',subj:'os',q:'「共享库」（动态链接库）的内存共享基于？',o:['复制多份', '用网络', '多个进程把同一份代码页映射到各自地址空间（只读共享）', '用磁盘'],a:2,why:'共享库（.so/.dll）的代码段在内存中只有一份，多个进程的页表指向它（只读）。节省内存，但数据段各自独立。'},
  {tag:'O15',subj:'os',q:'「大页」（Huge Page）的优点是？',o:['节省内存', '减少页表项和 TLB 缺失，提升性能', '加快磁盘', '减少碎片'],a:1,why:'大页（2MB 或 1GB）让 TLB 一条表项覆盖更大范围，减少 TLB 缺失。适合大内存应用（数据库、虚拟化）。代价是内碎片。'},
  {tag:'O15',subj:'os',q:'「内存压缩」（zram/zswap）技术的作用是？',o:['加快 CPU', '压缩不常用的页，减少磁盘交换', '增加容量', '加密'],a:1,why:'内存压缩：把不活跃的页压缩后存在内存里（而不是写到磁盘），读写比磁盘快得多。适合内存紧张但 CPU 有余的场景（手机）。'},
  {tag:'O16',subj:'os',q:'文件系统在磁盘上的典型布局包括？',o:['只有索引', '引导块、超级块、inode 区、数据区', '只有目录', '只有数据区'],a:1,why:'超级块记录文件系统元信息（大小、空闲块数、inode 数）。inode 区存文件属性，数据区存内容。引导块用于启动。'},
  {tag:'O16',subj:'os',q:'「超级块」中通常保存？',o:['目录名', '用户密码', '文件系统大小、空闲空间、inode 使用情况', '文件内容'],a:2,why:'超级块是文件系统的「总账」：块大小、总块数、空闲块列表、inode 总数与空闲数。挂载时读入内存。'},
  {tag:'O16',subj:'os',q:'「虚拟文件系统」（VFS）的作用是？',o:['为不同文件系统提供统一接口', '压缩', '加密', '加快磁盘'],a:0,why:'VFS 抽象出统一的文件操作接口（open/read/write），下层可以是 ext4、NTFS、FAT32、网络文件系统。上层程序不用关心具体格式。'},
  {tag:'O16',subj:'os',q:'「日志文件系统」（如 ext4）的核心机制是？',o:['加快读', '压缩', '写数据前先写日志，崩溃后可恢复', '加密'],a:2,why:'日志（journal）：修改前先把「要做什么」写入日志区，再执行。崩溃后重放日志保证一致性。代价是额外写。'},
  {tag:'O16',subj:'os',q:'文件系统中「块」和「扇区」的关系是？',o:['块由多个扇区组成，是文件系统的最小分配单位', '两者相同', '块更小', '扇区是逻辑概念'],a:0,why:'扇区是磁盘的物理单位（通常 512B）。块（簇）是文件系统的逻辑单位（如 4KB = 8 个扇区）。分配以块为单位。'},
  {tag:'O16',subj:'os',q:'「挂载」（mount）的含义是？',o:['复制文件', '格式化磁盘', '把文件系统接入目录树，使其可访问', '加密'],a:2,why:'挂载点是一个目录。挂载后，该文件系统的根成为这个目录的内容。Linux 的 /mnt、/media 常作挂载点。'},
  {tag:'O16',subj:'os',q:'「文件控制块」（FCB）中不包含？',o:['文件内容', '大小', '文件名', '权限'],a:0,why:'FCB（inode）存元数据：大小、权限、时间、数据块指针、所有者。**文件内容在数据区**，不在 FCB 里。'},
  {tag:'O16',subj:'os',q:'「inode 编号」和「文件名」的关系是？',o:['文件名就是编号', '目录项把文件名映射到 inode 编号', 'inode 存文件名', '两者相同'],a:1,why:'目录是「文件名 → inode 编号」的表。多个文件名可以指向同一 inode（硬链接）。inode 本身不含文件名。'},
  {tag:'O17',subj:'os',q:'连续分配的优点是？',o:['无碎片', '支持随机访问，寻道少，速度快', '易扩充', '节省空间'],a:1,why:'连续分配：文件占连续块，块号 = 起始 + 偏移，直接算出，随机访问快。但文件长大要挪位置，且有外碎片。'},
  {tag:'O17',subj:'os',q:'隐式链接分配的缺点是？',o:['太慢', '只能顺序访问，且指针占空间', '不能存储', '太贵'],a:1,why:'隐式链接：每块末尾存下一块指针。访问第 n 块要读前 n−1 块（只能顺序）。且每个块的指针占用了空间。'},
  {tag:'O17',subj:'os',q:'FAT（文件分配表）相比隐式链接的改进是？',o:['不需要索引', '节省空间', '加快磁盘', '把指针集中到内存中的表，支持随机访问'],a:3,why:'FAT 把所有「下一块指针」放在一张表里，表常驻内存。顺着表可以跳到任意块（随机访问），不用逐块读盘。'},
  {tag:'O17',subj:'os',q:'索引分配的缺点是？',o:['索引块本身占空间，小文件浪费', '太慢', '不能随机访问', '不支持大文件'],a:0,why:'索引分配：每个文件一个索引块，存所有数据块号。支持随机访问，但小文件（1 块）也要一个索引块，浪费空间。'},
  {tag:'O17',subj:'os',q:'「多级索引」和「混合索引」的区别是？',o:['多级更简单', '混合不支持大文件', '多级用索引的索引，混合直接/一级/二级/三级组合', '两者相同'],a:2,why:'多级索引：索引块指向索引块（树状）。混合索引（如 UNIX inode）：前几个直接块 + 一级 + 二级 + 三级间接，兼顾小文件和大文件。'},
  {tag:'O17',subj:'os',q:'UNIX inode 中「直接块」的作用是？',o:['存文件名', '存时间', '直接指向数据块，适合小文件（快速访问）', '存权限'],a:2,why:'inode 通常有 12 个直接块指针（指向 12 个数据块），加一级/二级/三级间接。小文件（<12 块）只需直接块，访问最快。'},
  {tag:'O17',subj:'os',q:'计算 inode 最大文件大小时，三级间接能索引多少块？',o:['3 × 块大小', '(块大小/4)³', '块大小³', '块大小/3'],a:1,why:'每个指针 4 字节，一个块能存 块大小/4 个指针。三级间接：指针数³ × 块大小。如 4KB 块：1024³ × 4KB = 4TB。'},
  {tag:'O17',subj:'os',q:'「簇（cluster）」分配的特点是？',o:['更快', '不需要表', '多个扇区作为一个分配单位，减少 FAT 表项', '更省空间'],a:2,why:'簇 = 2^n 个扇区。簇越大，FAT 表越小（表项少），但内部碎片越多（小文件浪费）。这是空间与效率的权衡。'},
  {tag:'O18',subj:'os',q:'「单级目录」的主要问题是？',o:['不能重名，且文件多时查找慢', '不能存储', '不支持大文件', '太复杂'],a:0,why:'单级目录：所有文件在一个目录下，不能重名（不同用户也不行），文件多时线性查找很慢。'},
  {tag:'O18',subj:'os',q:'「树形目录」的优点不包括？',o:['层次清晰', '支持重名', '查找快', '支持文件共享（跨分支直接引用）'],a:3,why:'树形目录解决重名和查找，但**不支持共享**（一个文件只能属于一个父目录）。共享需要「有向无环图」目录。'},
  {tag:'O18',subj:'os',q:'「硬链接」的本质是？',o:['符号链接', '复制文件', '多个目录项指向同一个 inode', '快捷方式'],a:2,why:'硬链接：新建一个目录项，指向同一 inode（inode 引用计数 +1）。删除一个不影响其他，直到计数为 0 才真正删除。'},
  {tag:'O18',subj:'os',q:'「软链接（符号链接）」的本质是？',o:['一个独立文件，内容是目标路径', '硬链接的别名', '指向 inode', '复制数据'],a:0,why:'软链接是独立文件（有自己的 inode），内容是目标路径字符串。目标删除后软链接失效（悬空链接）。可跨文件系统、可链接目录。'},
  {tag:'O18',subj:'os',q:'「目录项」中通常只存？',o:['文件权限', '文件内容', '文件名和 inode 编号', '文件全部属性'],a:2,why:'目录项（dentry）最小化：文件名 + inode 编号。其余属性都在 inode 里。这样目录很小，查找快。'},
  {tag:'O18',subj:'os',q:'「哈希目录」的作用是？',o:['排序文件', '压缩目录', '用哈希表加速文件名查找', '加密文件名'],a:2,why:'哈希目录：文件名经哈希函数定位到桶，O(1) 查找。比线性查找快，但要处理冲突。现代文件系统常用（如 ext4 的 htree）。'},
  {tag:'O18',subj:'os',q:'「路径解析」的过程是？',o:['随机查找', '不需要目录', '从根或当前目录开始，逐级查目录项', '一次性查表'],a:2,why:'如 /a/b/c：先查 / 找 a 的 inode，再用 a 的 inode 找 b，再找 c。每级都要读目录。所以路径越深越慢。'},
  {tag:'O18',subj:'os',q:'「当前工作目录」（CWD）的作用是？',o:['加快磁盘', '存全局变量', '提供相对路径的基准', '管理权限'],a:2,why:'相对路径（如 ./file）以 CWD 为基准。cd 命令改变 CWD。这样不用每次写全路径。'},
  {tag:'O19',subj:'os',q:'FCFS 磁盘调度的特点是？',o:['会饥饿', '按请求顺序服务，公平但寻道长', '最快', '最优'],a:1,why:'FCFS：按到达顺序服务，简单公平，但磁头来回移动，平均寻道长。适合请求少的场景。'},
  {tag:'O19',subj:'os',q:'SSTF 调度的缺点是？',o:['寻道最长', '不能实现', '不公平', '可能饥饿（远端请求一直等）'],a:3,why:'SSTF（最短寻道优先）：每次选最近的，平均寻道短。但持续有近处请求时，远端请求永远等不到（饥饿）。'},
  {tag:'O19',subj:'os',q:'SCAN（电梯）算法相比 SSTF 的改进是？',o:['单向扫到底再反向，避免饥饿', '更简单', '更省电', '更快'],a:0,why:'SCAN：磁头单向移动，服务沿途请求，到头反向。避免了 SSTF 的饥饿（每个请求都会被扫到），但中间磁道被服务更多次。'},
  {tag:'O19',subj:'os',q:'C-SCAN 相比 SCAN 的改进是？',o:['更快', '更简单', '只在一个方向服务，回头时直接跳到起点（更公平）', '更省电'],a:2,why:'C-SCAN（循环扫描）：单向服务，到头后快速返回起点（不服务）。这样各磁道的等待时间更均匀（SCAN 中间磁道占便宜）。'},
  {tag:'O19',subj:'os',q:'「旋转延迟」优化通常靠什么？',o:['加快转速', '减少磁头', '增加缓存', '扇区交错编号（interleaving）'],a:3,why:'如果扇区连续编号，读完一个扇区后下一个已转过去，要等一圈。交错编号（1,5,2,6,3,7...）让 CPU 处理时下一个扇区刚好转到。'},
  {tag:'O19',subj:'os',q:'磁盘调度中「寻道时间」和「旋转延迟」哪个通常更大？',o:['传输时间', '旋转延迟', '一样大', '寻道时间（磁头移动是机械动作，最慢）'],a:3,why:'寻道：磁头臂移动，几毫秒到十几毫秒。旋转：等扇区转过来，平均半圈（7200rpm 约 4ms）。所以调度算法主要优化寻道。'},
  {tag:'O19',subj:'os',q:'「磁盘缓存」的预读策略基于？',o:['随机性', '空间局部性（相邻扇区很可能被访问）', '时间局部性', '无依据'],a:1,why:'预读（read-ahead）：读一个扇区时，顺便把后面几个扇区读进缓存。因为文件通常是顺序访问的。'},
  {tag:'O19',subj:'os',q:'SSD 需要磁盘调度算法吗？',o:['非常需要', '和 HDD 一样', '必须用 SCAN', '不太需要（无寻道，随机访问快）'],a:3,why:'SSD 没有机械部件，随机读和顺序读速度接近。所以传统磁盘调度意义不大，重点在「磨损均衡」和「垃圾回收」。'},
  {tag:'O20',subj:'os',q:'「空闲空间管理」的常用方法不包括？',o:['位图', '索引分配', '空闲链表', '成组链接'],a:1,why:'空闲空间管理：位图（每位一个块）、空闲链表、成组链接（UNIX）。**索引分配是文件分配方式**，不是空闲管理。'},
  {tag:'O20',subj:'os',q:'位图法管理空闲空间的优点是？',o:['查找连续空闲块快（位运算）', '不需要内存', '简单', '省空间'],a:0,why:'位图：1 位表示一个块的空闲/占用。用位运算（找连续 0）可以快速找到连续空间。缺点是要占空间（1TB 盘约 32MB 位图）。'},
  {tag:'O20',subj:'os',q:'「成组链接」法的作用是？',o:['把空闲块分组链接，兼顾查找效率和空间', '压缩', '排序', '加密'],a:0,why:'成组链接：每组的最后一块存下一组的块号列表。分配时从当前组取，取完跳到下一组。适合大文件系统（UNIX 用）。'},
  {tag:'O20',subj:'os',q:'「一致性检查」（fsck）的作用是？',o:['检查并修复文件系统元数据的不一致', '加快磁盘', '加密', '压缩'],a:0,why:'崩溃后可能 inode 和数据块不一致（如 inode 说占用但位图说空闲）。fsck 扫描并修复（可能丢失部分数据，但不至于整个文件系统损坏）。'},
  {tag:'O20',subj:'os',q:'「写时复制文件系统」（如 Btrfs/ZFS）的特点是？',o:['更快', '更简单', '更省空间', '修改数据时写新块，不覆盖原块（天然支持快照）'],a:3,why:'COW 文件系统：修改时写新位置，更新指针。原数据保持不变（可做快照）。代价是碎片多，需要定期整理。'},
  {tag:'O20',subj:'os',q:'「文件描述符」和「文件句柄」的关系是？',o:['句柄是整数', '描述符在磁盘上', '两者相同', '文件描述符是进程内的整数索引，指向系统级的打开文件表项'],a:3,why:'open() 返回文件描述符（小整数）。它索引进程的 fd 表 → 系统打开文件表 → inode。fork 时 fd 表被复制（共享文件偏移）。'},
  {tag:'O20',subj:'os',q:'「缓冲区缓存」（buffer cache）和「页缓存」（page cache）的区别是？',o:['页缓存更慢', '缓冲区在磁盘上', '两者相同', '历史上分开（块 vs 页），现代系统统一为页缓存'],a:3,why:'早期：buffer cache 缓存磁盘块，page cache 缓存文件页，两份可能不一致。现代 Linux 统一为 page cache（buffer 只是它的视图）。'},
  {tag:'O20',subj:'os',q:'「direct I/O」和「buffered I/O」的区别是？',o:['两者相同', 'direct 更快', 'buffered 不经过内存', 'direct 绕过页缓存直接读写磁盘'],a:3,why:'buffered I/O：数据经页缓存（快，但占内存、可能丢失）。direct I/O：绕过缓存直接到磁盘（适合数据库自己管缓存）。'},
  {tag:'O21',subj:'os',q:'I/O 设备按传输速率可分为？',o:['字符设备（慢）和块设备（快）', '输入和输出', '串行和并行', '有线和无线'],a:0,why:'字符设备：以字节流为单位（键盘、串口），通常不支持随机访问。块设备：以块为单位（磁盘、SSD），支持随机访问。'},
  {tag:'O21',subj:'os',q:'「设备控制器」的作用是？',o:['执行程序', '存储数据', '把 CPU 的命令翻译成设备能懂的电信号', '管理内存'],a:2,why:'设备控制器（如磁盘控制器、网卡）是 CPU 和物理设备之间的桥梁，实现设备协议、缓冲数据、报告状态。'},
  {tag:'O21',subj:'os',q:'「设备寄存器」通常映射到哪里？',o:['寄存器堆', '磁盘', 'Cache', 'I/O 端口或内存地址空间'],a:3,why:'设备寄存器（数据、状态、控制）映射到 I/O 端口（独立编址）或内存地址（内存映射 I/O），CPU 通过读写这些地址控制设备。'},
  {tag:'O21',subj:'os',q:'「中断控制器」的作用是？',o:['存储中断', '执行中断', '收集多个设备的中断请求，按优先级送给 CPU', '产生时钟'],a:2,why:'中断控制器（如 8259A、APIC）管理多路中断：屏蔽、优先级排队、向 CPU 发中断信号、提供中断号。'},
  {tag:'O21',subj:'os',q:'「DMA 控制器」中通常有哪些寄存器？',o:['只有状态', '内存地址、传输长度、控制/状态', '只有地址', '只有长度'],a:1,why:'DMA 控制器：内存地址寄存器（起始地址，自动递增）、计数寄存器（还要传多少）、控制寄存器（方向、模式）。'},
  {tag:'O21',subj:'os',q:'「端口映射 I/O」和「内存映射 I/O」的区别是？',o:['前者更快', '两者相同', '前者用专门指令（IN/OUT），后者用普通访存指令', '后者需要专门指令'],a:2,why:'端口映射（独立编址）：I/O 空间与内存分开，用 IN/OUT 指令。内存映射：I/O 寄存器占内存地址，用 mov 即可。'},
  {tag:'O21',subj:'os',q:'「设备驱动程序」的主要职责是？',o:['屏蔽设备差异，向上提供统一接口', '管理内存', '执行算术', '存储数据'],a:0,why:'驱动程序知道具体设备的寄存器、命令格式、时序。它把上层的「读一块数据」翻译成设备能懂的操作序列。'},
  {tag:'O21',subj:'os',q:'「即插即用」需要哪些支持？',o:['只要软件', '只要硬件', '只要驱动', '设备可识别（有 ID）、可配置（有配置空间）、OS 支持'],a:3,why:'PnP 三要素：① 设备有唯一标识（如 PCI 的 Vendor/Device ID）；② 有可读写的配置空间（分配地址、中断）；③ OS 有 PnP 管理器。'},
  {tag:'O22',subj:'os',q:'I/O 软件的四个层次（从下到上）是？',o:['驱动、中断、用户、独立', '独立、驱动、用户、中断', '用户层、驱动、中断、独立', '中断处理、设备驱动、设备独立性、用户层'],a:3,why:'最底层是中断处理（与硬件直接交互），往上依次是设备驱动、设备独立性软件（统一接口、缓冲）、用户层 I/O（库函数）。'},
  {tag:'O22',subj:'os',q:'「设备独立性软件」的作用是？',o:['提供统一接口，屏蔽具体设备差异', '直接操作硬件', '管理内存', '执行中断'],a:0,why:'它实现「逻辑设备名 → 物理设备」的映射、缓冲管理、错误处理、分配回收。上层用 read/write 不用关心是磁盘还是网卡。'},
  {tag:'O22',subj:'os',q:'「逻辑设备名」和「物理设备名」的区别是？',o:['逻辑名是程序用的（如 printer），物理名是实际的（如 LPT1）', '逻辑名更长', '物理名在程序中', '两者相同'],a:0,why:'程序用逻辑名（printer），系统通过「逻辑设备表」（LUT）映射到物理设备（LPT1 或 USB 打印机）。换设备不用改程序。'},
  {tag:'O22',subj:'os',q:'「系统调用」中 I/O 相关的通常是？',o:['pthread_create', 'fork/exec', 'open/read/write/close/ioctl', 'malloc/free'],a:2,why:'I/O 系统调用：open（打开）、read（读）、write（写）、close（关闭）、ioctl（设备控制）、lseek（定位）。'},
  {tag:'O22',subj:'os',q:'「阻塞 I/O」和「非阻塞 I/O」的区别是？',o:['阻塞不返回', '两者相同', '非阻塞更慢', '阻塞会等待完成，非阻塞立即返回（可能没数据）'],a:3,why:'阻塞：read 没数据就睡眠，直到有数据。非阻塞：立即返回（EAGAIN），程序自己轮询。还有「异步 I/O」（完成后通知）。'},
  {tag:'O22',subj:'os',q:'「I/O 多路复用」（select/poll/epoll）解决什么问题？',o:['加快单个 I/O', '减少内存', '一个线程同时监控多个 I/O，哪个就绪处理哪个', '加密'],a:2,why:'没有多路复用时，一个线程只能阻塞在一个 I/O 上。select/epoll 让一个线程等多个 fd，适合高并发服务器（如 Nginx）。'},
  {tag:'O22',subj:'os',q:'「用户层 I/O 软件」通常包括？',o:['中断处理', '设备驱动', '库函数（如 printf/scanf）、SPOOLing', '硬件'],a:2,why:'用户层：C 库的 printf（最终调 write）、scanf（调 read）。还有 SPOOLing 的守护进程（打印队列）。'},
  {tag:'O22',subj:'os',q:'「I/O 请求的处理流程」正确的是？',o:['用户调用 → 系统调用 → 设备独立性软件 → 驱动 → 中断处理 → 硬件', '驱动 → 用户', '用户 → 硬件 → 驱动', '硬件 → 用户'],a:0,why:'read() → 内核系统调用入口 → 检查参数/缓冲 → 调驱动 → 驱动操作硬件 → 硬件完成后中断 → 中断处理 → 唤醒进程。'},
  {tag:'O23',subj:'os',q:'「独占设备」和「共享设备」的区别是？',o:['两者相同', '独占设备一次只能一个进程用（如打印机），共享可并发（如磁盘）', '独占更快', '共享更慢'],a:1,why:'独占设备（打印机、磁带机）：必须整段占用。共享设备（磁盘）：可交替访问，但每次访问要互斥（临界区）。'},
  {tag:'O23',subj:'os',q:'「虚拟设备」技术是指？',o:['虚拟内存', '用软件把独占设备模拟成共享设备（SPOOLing）', '假设备', '远程设备'],a:1,why:'虚拟设备：如 SPOOLing 把打印机变成「共享」——多个进程的打印任务排队，由守护进程逐个送打印机。'},
  {tag:'O23',subj:'os',q:'「设备分配」中「静态分配」和「动态分配」的区别是？',o:['静态更快', '动态更安全', '静态在作业开始前分配，动态在运行时按需分配', '两者相同'],a:2,why:'静态分配：作业开始时就分配所有设备（不会死锁，但利用率低）。动态分配：运行时申请（利用率高，但可能死锁）。'},
  {tag:'O23',subj:'os',q:'「设备控制表」（DCT）中记录？',o:['文件内容', '内存地址', '设备类型、状态、指向驱动的指针、等待队列', '进程信息'],a:2,why:'DCT（Device Control Table）每个设备一张，记录设备状态（忙/闲）、队列、控制器指针。系统设备表（SDT）汇总所有 DCT。'},
  {tag:'O23',subj:'os',q:'「设备分配的安全性」中，「安全分配方式」是指？',o:['不分配', '先到先得', '随机分配', '进程申请设备后立即阻塞，直到设备分配给它'],a:3,why:'安全分配：申请设备 → 若不可用则阻塞 → 可用时唤醒并分配。这样进程不会「占着一个等另一个」（破坏请求并保持条件）。'},
  {tag:'O23',subj:'os',q:'「设备独立性」带来的好处不包括？',o:['换设备不用改程序', '提高设备传输速度', '程序不依赖具体设备', '便于增加新设备'],a:1,why:'设备独立性让程序用逻辑名，好处是「可移植、易扩展」。但**不提高传输速度**（速度取决于硬件和驱动）。'},
  {tag:'O23',subj:'os',q:'「热插拔」需要什么支持？',o:['只要驱动', '硬件支持带电插拔 + OS 能动态识别', '只要 OS', '只要硬件'],a:1,why:'热插拔：硬件设计上支持带电插拔（如 USB），OS 有热插拔子系统（检测、加载驱动、通知应用）。'},
  {tag:'O23',subj:'os',q:'「设备队列」中，等待同一设备的进程按什么排队？',o:['按内存占用', '按进程大小', '通常按优先级或 FIFO', '随机'],a:2,why:'设备忙时，请求的进程进入该设备的等待队列。调度可按 FIFO（公平）或优先级（重要进程先）。'},
  {tag:'O24',subj:'os',q:'「缓冲」技术的主要目的是？',o:['匹配 CPU 和设备的速差，减少中断次数', '增加内存', '加快 CPU', '加密'],a:0,why:'缓冲：数据先放内存缓冲区，CPU 和设备的速差被「吸收」。同时减少中断频率（攒一批再处理）。'},
  {tag:'O24',subj:'os',q:'「单缓冲」和「双缓冲」的区别是？',o:['单缓冲更快', '两者相同', '双缓冲允许 CPU 处理一块时设备填另一块（并行）', '双缓冲只能用于磁盘'],a:2,why:'单缓冲：设备填缓冲时 CPU 要等（或处理同一块）。双缓冲：CPU 处理 A 时设备填 B，处理完交换。并行度提高。'},
  {tag:'O24',subj:'os',q:'「循环缓冲」适用于？',o:['连续的、大量的 I/O（如音视频流）', '随机访问', '网络', '单次小 I/O'],a:0,why:'循环缓冲：多个缓冲区组成环，输入和输出各用指针追。适合「持续流入」的场景（如音频播放、视频流）。'},
  {tag:'O24',subj:'os',q:'「缓冲池」的作用是？',o:['多个进程共享一组缓冲区，提高利用率', '减少磁盘', '增加内存', '加快 CPU'],a:0,why:'缓冲池：系统维护一组缓冲区（空闲、输入、输出队列），按需分配。避免每个进程都开自己的缓冲（浪费）。'},
  {tag:'O24',subj:'os',q:'SPOOLing 技术的全称是？',o:['虚拟内存', '快速打印', '同时外围联机操作（Simultaneous Peripheral Operations On-Line）', '并行 I/O'],a:2,why:'SPOOLing（假脱机）：用磁盘做缓冲，把独占设备（打印机）虚拟成共享设备。输入井/输出井 + 守护进程。'},
  {tag:'O24',subj:'os',q:'SPOOLing 系统中「输入井」和「输出井」在？',o:['Cache', '内存中', '设备里', '磁盘上'],a:3,why:'输入井/输出井是**磁盘上的缓冲区**（不是内存），所以容量大。守护进程负责在设备和井之间搬数据。'},
  {tag:'O24',subj:'os',q:'SPOOLing 把独占设备变成？',o:['更慢的设备', '虚拟内存', '更快的设备', '共享设备（逻辑上）'],a:3,why:'SPOOLing 让多个进程「同时」使用打印机（实际是排队）。逻辑上打印机成了共享设备，实际仍是独占的。'},
  {tag:'O24',subj:'os',q:'「缓冲」和「缓存」的区别是？',o:['缓存匹配速差', '缓冲更快', '两者相同', '缓冲匹配速差（buffer），缓存提高访问速度（cache）'],a:3,why:'缓冲（buffer）：吸收速差，数据可能只用一次（如键盘输入）。缓存（cache）：存常用数据，提高命中率（如 CPU Cache、页缓存）。'},
  {tag:'O25',subj:'os',q:'「低级格式化」和「高级格式化」的区别是？',o:['低级划分磁道扇区，高级建立文件系统', '两者相同', '低级建文件系统', '高级划扇区'],a:0,why:'低级格式化（物理格式化）：在盘片上划出磁道、扇区，写入扇区头和校验。高级格式化（逻辑）：建立文件系统（超级块、inode、根目录）。'},
  {tag:'O25',subj:'os',q:'「分区」的作用是？',o:['减少寻道', '加快磁盘', '增加容量', '把磁盘划分成独立的逻辑区域，各自可有文件系统'],a:3,why:'分区表（MBR/GPT）记录各分区的起止。每个分区可独立格式化、装不同系统。分区不影响物理结构。'},
  {tag:'O25',subj:'os',q:'「引导块」中存放的是？',o:['驱动程序', '文件系统元数据', '引导加载程序（启动 OS 的第一段代码）', '用户数据'],a:2,why:'引导块（boot block）：BIOS 加载它，它再加载 OS 内核。MBR 中的引导代码只有 446 字节，通常跳到活动分区的引导块。'},
  {tag:'O25',subj:'os',q:'「坏块管理」的常见做法是？',o:['降低容量', '加快转速', '忽略', '标记坏块并重映射到备用块'],a:3,why:'坏块：磁盘出厂或使用中出现的不可用扇区。现代磁盘有备用扇区，控制器自动重映射（对 OS 透明）。'},
  {tag:'O25',subj:'os',q:'「磁盘配额」的作用是？',o:['增加容量', '减少寻道', '限制用户/组可用的磁盘空间', '加快磁盘'],a:2,why:'配额（quota）：系统管理员为每个用户设定空间上限（软限制可超、硬限制不可超）。防止一个用户占满磁盘。'},
  {tag:'O25',subj:'os',q:'「交换区」（swap）的作用是？',o:['存驱动', '存文件', '存程序', '作为虚拟内存的后备存储（存放换出的页）'],a:3,why:'交换区（swap partition/swap file）：物理内存不够时，把不活跃的页换到这里。Linux 的 swap、Windows 的 pagefile。'},
  {tag:'O25',subj:'os',q:'「磁盘碎片整理」对 SSD 有必要吗？',o:['非常需要', '和 HDD 一样', '不需要（反而有害，增加写入）', '必须做'],a:2,why:'SSD 没有机械寻道，碎片不影响性能。整理反而增加擦写（缩短寿命）。SSD 需要的是 TRIM（通知闪存哪些块可回收）。'},
  {tag:'O25',subj:'os',q:'「TRIM」命令的作用是？',o:['加快读', '通知 SSD 哪些块已删除，可回收', '增加容量', '加密'],a:1,why:'删除文件时 OS 发 TRIM，SSD 知道这些块可以擦除回收（否则 SSD 以为还有效，垃圾回收效率低）。'},
  {tag:'N11',subj:'net',q:'IPv4 首部的最小长度是？',o:['24 字节', '8 字节', '32 字节', '20 字节'],a:3,why:'IPv4 首部固定部分 20 字节（含选项时最多 60）。UDP 首部 8 字节，TCP 首部最小 20 字节。'},
  {tag:'N11',subj:'net',q:'IPv4 首部中的「标识」字段作用是？',o:['标识同一数据报的分片', '标识优先级', '标识源地址', '标识协议'],a:0,why:'标识（Identification）：同一个原始数据报的所有分片有相同的标识值，接收方据此重组。配合「片偏移」和「MF 标志」。'},
  {tag:'N11',subj:'net',q:'IPv4 分片时，「片偏移」的单位是？',o:['4 字节', '1 字节', '8 字节', '16 字节'],a:2,why:'片偏移以 8 字节为单位（所以除最后一片外，每片的数据长度必须是 8 的倍数）。这是计算分片的关键。'},
  {tag:'N11',subj:'net',q:'IPv4 首部中的「TTL」作用是什么？',o:['限制数据报的生存时间（跳数）', '标识优先级', '标识长度', '标识协议'],a:0,why:'TTL 每经过一个路由器减 1，减到 0 就丢弃并发 ICMP 超时。防止数据报在网络中无限循环（如路由环路）。'},
  {tag:'N11',subj:'net',q:'IPv4 首部校验和校验的范围是？',o:['只校验数据', '首部+数据', '不校验', '只校验首部，不校验数据'],a:3,why:'IPv4 只校验首部（因为数据由上层 TCP/UDP 校验）。每经过一个路由器都要重新计算（因为 TTL 变了）。'},
  {tag:'N11',subj:'net',q:'CIDR 中 /26 表示的子网掩码是？',o:['255.255.255.128', '255.255.255.192', '255.255.255.224', '255.255.255.0'],a:1,why:'/26 = 前 26 位为 1，即 255.255.255.192（11111111.11111111.11111111.11000000）。主机位 6 位，64 个地址。'},
  {tag:'N11',subj:'net',q:'「超网」（路由聚合）的作用是？',o:['增加子网', '加快转发', '把多个小网段合并成一个大网段，减少路由表项', '减少 IP'],a:2,why:'超网（CIDR 聚合）：把连续的多个网段合并，如 192.168.0.0/24 到 192.168.3.0/24 聚合成 192.168.0.0/22。减少路由表规模。'},
  {tag:'N11',subj:'net',q:'「最长前缀匹配」是指？',o:['选最短的', '随机选', '选第一个', '路由表中选前缀最长（最具体）的那条'],a:3,why:'转发时如果多条路由都匹配，选**前缀最长**（最具体）的。如 /32 优先于 /24 优先于 /0（默认路由）。'},
  {tag:'N12',subj:'net',q:'距离向量算法（RIP）的「最大跳数」是？',o:['15 跳（16 表示不可达）', '16 跳', '无限制', '255 跳'],a:0,why:'RIP 规定最大 15 跳，16 表示不可达。这限制了网络规模（直径不超过 15），也用于快速判断环路。'},
  {tag:'N12',subj:'net',q:'RIP 的「坏消息传得慢」问题是指？',o:['设备慢', '传输慢', '链路断开的消息要经过很多轮才能传遍全网', 'RIP 本身慢'],a:2,why:'RIP 靠邻居交换整张表，坏消息（某网络不可达）要逐跳传播，收敛慢。期间可能形成临时环路。'},
  {tag:'N12',subj:'net',q:'「水平分割」技术解决什么问题？',o:['压缩', '防止路由信息回传给来源，减少环路', '加密', '加快收敛'],a:1,why:'水平分割（Split Horizon）：从某接口学到的路由，不再从该接口发回去。防止两路由器互相「教」错误路由（环路）。'},
  {tag:'N12',subj:'net',q:'OSPF 使用什么算法计算最短路径？',o:['Bellman-Ford', '随机', 'Dijkstra 算法', '距离向量'],a:2,why:'OSPF 是链路状态协议：每个路由器收集全网拓扑（LSA），用 Dijkstra 算最短路径树。收敛快、无环路。'},
  {tag:'N12',subj:'net',q:'OSPF 的「区域」（Area）设计目的是？',o:['减少 IP', '加密', '加快计算', '分层减少 LSA 泛洪范围，提高扩展性'],a:3,why:'OSPF 把网络分成多个区域（Area 0 是骨干）。区域内的拓扑变化不影响到其他区域（只有汇总路由），大幅减少开销。'},
  {tag:'N12',subj:'net',q:'BGP 属于哪类路由协议？',o:['距离向量', '内部网关协议', '外部网关协议（AS 之间）', '链路状态'],a:2,why:'BGP（边界网关协议）用于自治系统（AS）之间，是**路径向量**协议。它考虑策略（政治、经济）而不只是最短路径。'},
  {tag:'N12',subj:'net',q:'「自治系统」（AS）是指？',o:['一个国家', '一个子网', '一个路由器', '由单一机构管理、使用统一路由策略的网络集合'],a:3,why:'AS 是一个管理域（如电信、大学）。AS 内部用 IGP（RIP/OSPF），AS 之间用 EGP（BGP）。每个 AS 有唯一 AS 号。'},
  {tag:'N12',subj:'net',q:'路由表中「默认路由」的表示是？',o:['127.0.0.1', '0.0.0.0/0', '255.255.255.255', '192.168.0.0'],a:1,why:'默认路由 0.0.0.0/0（前缀长度 0，匹配所有）。当没有更具体的路由时用它。通常指向网关。'},
  {tag:'N13',subj:'net',q:'IPv6 地址的长度是？',o:['128 位', '64 位', '256 位', '32 位'],a:0,why:'IPv6 是 128 位（16 字节），地址空间是 IPv4 的 2^96 倍。写成 8 组 16 位十六进制（如 2001:db8::1）。'},
  {tag:'N13',subj:'net',q:'IPv6 相比 IPv4 的主要改进不包括？',o:['地址空间巨大', '首部简化', '支持广播（broadcast）', '内置 IPsec'],a:2,why:'IPv6 **取消了广播**，用组播（multicast）和任播（anycast）替代。其他改进：地址多、首部简化（固定 40 字节）、内置安全。'},
  {tag:'N13',subj:'net',q:'IPv6 首部的长度是？',o:['20 字节', '60 字节', '可变', '固定 40 字节'],a:3,why:'IPv6 基本首部固定 40 字节（无校验和、无选项字段）。扩展功能用「扩展首部」实现，路由器不处理（提高效率）。'},
  {tag:'N13',subj:'net',q:'IPv6 中「::」的含义是？',o:['表示广播', '表示任意地址', '表示本地', '压缩连续的 0'],a:3,why:'「::」表示一段连续的 0（只能出现一次）。如 2001:db8::1 表示 2001:0db8:0000:0000:0000:0000:0000:0001。'},
  {tag:'N13',subj:'net',q:'IPv4 到 IPv6 的过渡技术不包括？',o:['双协议栈', '协议转换', '网络地址转换（NAT）', '隧道技术'],a:2,why:'过渡技术：① 双协议栈（同时支持两者）；② 隧道（IPv6 包封装在 IPv4 里）；③ 协议转换（NAT64）。**NAT 是 IPv4 的地址复用技术**。'},
  {tag:'N13',subj:'net',q:'IPv6 的「邻居发现协议」（NDP）替代了 IPv4 的什么？',o:['DNS', 'ICMP', 'DHCP', 'ARP（地址解析）'],a:3,why:'NDP（Neighbor Discovery Protocol）用 ICMPv6 实现：地址解析（替代 ARP）、路由器发现、地址自动配置（SLAAC）。'},
  {tag:'N13',subj:'net',q:'IPv6 的地址自动配置（SLAAC）依赖？',o:['DNS', '路由器通告的前缀 + 接口标识', '手动配置', 'DHCP 服务器'],a:1,why:'SLAAC（无状态地址自动配置）：主机从路由器通告（RA）拿到前缀，加上自己的接口标识（MAC 或随机），组成完整地址。不需要 DHCP。'},
  {tag:'N13',subj:'net',q:'IPv6 中「链路本地地址」的前缀是？',o:['2000::/3', 'ff00::/8', 'fc00::/7', 'fe80::/10'],a:3,why:'fe80::/10 是链路本地地址（仅同一链路有效，用于邻居发现）。2000::/3 是全球单播，fc00::/7 是唯一本地，ff00::/8 是组播。'},
  {tag:'N13',subj:'net',q:'IPv6 首部中取消了哪个字段？',o:['首部校验和', '目的地址', '源地址', '跳数限制'],a:0,why:'IPv6 取消了首部校验和（依赖链路层和传输层校验），减少每跳的处理开销。也取消了分片字段（分片由源端做）。'},
  {tag:'N14',subj:'net',q:'组播（multicast）的特点是？',o:['发给相邻的', '一份数据发给一组特定接收者', '发给所有人', '发给一个人'],a:1,why:'组播：发送方只发一份，网络在分叉处复制，只有加入该组的主机收到。节省带宽（视频会议、IPTV）。'},
  {tag:'N14',subj:'net',q:'IPv4 组播地址的范围是？',o:['224.0.0.0 - 239.255.255.255（D 类）', '10.0.0.0', '192.168.0.0', '127.0.0.0'],a:0,why:'D 类地址（224-239）是组播地址。224.0.0.1 是「所有主机」，224.0.0.2 是「所有路由器」，224.0.0.9 是 RIP-2。'},
  {tag:'N14',subj:'net',q:'IGMP 协议的作用是？',o:['路由选择', '主机向路由器报告加入/离开组播组', '地址分配', '域名解析'],a:1,why:'IGMP（因特网组管理协议）：主机告诉本地路由器「我要加入/离开某个组播组」。路由器据此决定是否转发组播流量。'},
  {tag:'N14',subj:'net',q:'VPN 的核心技术是？',o:['缓存', '压缩', '负载均衡', '隧道（封装）和加密'],a:3,why:'VPN 在公网上建「隧道」：把私有数据包封装在公网包里面传输，并加密。对外看是普通流量，实际是加密的私有网络。'},
  {tag:'N14',subj:'net',q:'「IPsec」工作在？',o:['传输层', '网络层（IP 层）', '应用层', '链路层'],a:1,why:'IPsec 在网络层加密 IP 包（AH 认证 + ESP 加密）。对上层应用透明。常用于站点间 VPN。'},
  {tag:'N14',subj:'net',q:'「GRE 隧道」的特点是？',o:['可封装多种协议（不只是 IP），但不加密', '加密强', '只支持 IP', '不需要封装'],a:0,why:'GRE（通用路由封装）：把任意协议包封装在 IP 里。本身**不加密**，常和 IPsec 配合（GRE over IPsec）。'},
  {tag:'N14',subj:'net',q:'「MPLS」的核心思想是？',o:['压缩', '用标签转发代替逐跳查路由表', '多播', '加密'],a:1,why:'MPLS（多协议标签交换）：入口给包打标签，中间路由器只按标签转发（不查 IP 路由表），速度快、易做流量工程。'},
  {tag:'N14',subj:'net',q:'「SD-WAN」相比传统专线的优势是？',o:['更简单', '更安全', '更快', '用普通宽带 + 智能调度替代昂贵专线'],a:3,why:'SD-WAN 用多条普通链路（宽带、4G/5G）+ 集中控制器智能选路，成本远低于 MPLS 专线，且灵活。'},
  {tag:'N15',subj:'net',q:'路由器的基本功能是？',o:['连接不同网络，按 IP 地址转发', '解析域名', '放大信号', '扩展冲突域'],a:0,why:'路由器工作在网络层：收到包 → 查路由表 → 从对应接口转发（可能改写 MAC 头）。它隔离广播域。'},
  {tag:'N15',subj:'net',q:'路由器的「转发表」和「路由表」的关系是？',o:['两者相同', '转发表更大', '路由表由路由协议生成，转发表是路由表的优化（用于快速转发）', '路由表更快'],a:2,why:'路由表是控制平面（算出来的），转发表是数据平面（实际转发用的，通常用硬件 TCAM 加速）。'},
  {tag:'N15',subj:'net',q:'「三层交换机」和路由器的区别是？',o:['三层交换机用硬件转发，速度快，适合局域网；路由器功能全，适合广域网', '三层交换机更慢', '两者相同', '路由器不能转发 IP'],a:0,why:'三层交换机：硬件（ASIC）转发，线速。但 NAT、防火墙等功能弱。路由器：软件转发（或专用硬件），功能全但慢。'},
  {tag:'N15',subj:'net',q:'「网关」和「路由器」的关系是？',o:['路由器更慢', '两者相同', '网关是网络层的转换点，路由器是常见的网关设备', '网关更底层'],a:2,why:'网关（gateway）是「协议转换」的设备/节点。默认网关就是路由器（连其他网段）。现在「网关」常指路由器的接口地址。'},
  {tag:'N15',subj:'net',q:'「ARP 代理」的作用是？',o:['缓存 ARP', '加速 ARP', '代答不属于本网段的 ARP 请求（如子网划分时）', '加密 ARP'],a:2,why:'ARP 代理：路由器收到跨网段的 ARP 请求时，用自己的 MAC 代答（让主机以为目标在同一网段）。用于透明子网划分。'},
  {tag:'N15',subj:'net',q:'「ICMP 重定向」的作用是？',o:['告诉主机有更好的下一跳路由器', '加密', '重传', '压缩'],a:0,why:'ICMP 重定向：路由器发现主机用了次优的网关，就发 ICMP 重定向告诉它「走另一个更快」。主机据此更新路由缓存。'},
  {tag:'N15',subj:'net',q:'「NAT 穿透」（如 UPnP、STUN）解决什么问题？',o:['公网无法主动连到 NAT 后面的内网主机', '加快 NAT', '减少 NAT', '加密 NAT'],a:0,why:'NAT 隐藏了内网地址，外部无法主动发起连接（如 P2P、视频通话）。STUN/UPnP 帮助打洞或自动映射端口。'},
  {tag:'N15',subj:'net',q:'「策略路由」和「目的路由」的区别是？',o:['策略路由更快', '两者相同', '目的路由更灵活', '策略路由可按源地址/端口等选路，目的路由只看目的 IP'],a:3,why:'传统路由：只看目的 IP 查表。策略路由（PBR）：可按源 IP、协议、端口、时间等条件选不同路径（如「内网走专线，访客走宽带」）。'},
  {tag:'N16',subj:'net',q:'TCP 首部的最小长度是？',o:['40 字节', '60 字节', '20 字节', '8 字节'],a:2,why:'TCP 首部固定部分 20 字节（含选项最多 60）。UDP 首部固定 8 字节。IPv4 首部 20 字节。'},
  {tag:'N16',subj:'net',q:'TCP 的「序号」字段占多少位？',o:['8 位', '64 位', '16 位', '32 位'],a:3,why:'TCP 序号 32 位（可表示 4GB 范围，用回绕处理）。确认号也是 32 位。端口是 16 位。'},
  {tag:'N16',subj:'net',q:'TCP 的「确认号」表示什么？',o:['期望收到的下一个字节的序号', '窗口大小', '重传次数', '已收到的最后一个字节'],a:0,why:'确认号 = 期望收到的下一个字节序号（累积确认）。如确认号 1001 表示「1000 及之前的都收到了」。'},
  {tag:'N16',subj:'net',q:'TCP 中的「SYN」标志位作用是？',o:['结束连接', '建立连接时同步初始序号', '推送数据', '重置连接'],a:1,why:'SYN（Synchronize）：连接请求，携带初始序号 ISN。SYN=1 时不能携带数据（除三次握手的特殊情形）。'},
  {tag:'N16',subj:'net',q:'TCP 的「FIN」标志位表示？',o:['确认', '连接重置', '紧急数据', '发送方没有更多数据，请求关闭'],a:3,why:'FIN（Finish）：我发完了（但我还能收）。所以关闭是双向的：双方各发一次 FIN，才有四次挥手。'},
  {tag:'N16',subj:'net',q:'TCP 的「RST」标志位表示？',o:['确认', '正常关闭', '重置连接（异常关闭）', '建立连接'],a:2,why:'RST（Reset）：强制断开。用于「端口不存在」、「连接异常」、「拒绝非法连接」。收到 RST 就立即释放连接。'},
  {tag:'N16',subj:'net',q:'TCP 的「TIME_WAIT」状态持续多久？',o:['永久', '2 倍 MSL（最长报文段寿命）', '1 秒', '10 秒'],a:1,why:'TIME_WAIT 持续 2MSL（通常 1-4 分钟）。目的：① 确保最后的 ACK 能到达（丢了可重发）；② 让旧连接的残余报文在网络中消失。'},
  {tag:'N16',subj:'net',q:'为什么 TIME_WAIT 要等 2MSL 而不是 1MSL？',o:['随机', '因为要覆盖「ACK 丢失后对方重发 FIN」的一个来回', '协议规定', '习惯'],a:1,why:'如果 ACK 丢了，对方会重发 FIN。2MSL 保证「我方 ACK 到达 + 对方重发 FIN 到达」的最大时间，确保连接彻底关闭。'},
  {tag:'N17',subj:'net',q:'TCP 拥塞控制的四个阶段是？',o:['建立、传输、关闭、重置', '启动、加速、减速、停止', '慢开始、拥塞避免、快重传、快恢复', '探测、增长、下降、恢复'],a:2,why:'① 慢开始（指数增长）；② 拥塞避免（线性增长）；③ 快重传（收到 3 个重复 ACK 立即重传）；④ 快恢复（不回到 1，而是减半继续）。'},
  {tag:'N17',subj:'net',q:'慢开始阶段，拥塞窗口如何增长？',o:['每 RTT 加 1（线性）', '不变', '随机', '每经过一个 RTT 翻倍（指数）'],a:3,why:'慢开始：cwnd 从 1 开始，每收到一个 ACK 加 1，一个 RTT 后翻倍（1→2→4→8）。到 ssthresh 后转拥塞避免。'},
  {tag:'N17',subj:'net',q:'拥塞避免阶段，拥塞窗口如何增长？',o:['每经过一个 RTT 加 1（线性）', '不变', '翻倍', '减半'],a:0,why:'拥塞避免：每个 RTT 只加 1（线性增长，加法增大）。这样缓慢逼近网络容量，避免突然拥塞。'},
  {tag:'N17',subj:'net',q:'发生超时重传时，ssthresh 和 cwnd 如何变化？',o:['ssthresh = cwnd/2，cwnd = 1', '都不变', '都减半', 'cwnd 归零'],a:0,why:'超时（严重拥塞）：ssthresh = cwnd/2，cwnd = 1，重新慢开始。这表示「网络严重拥塞，要从头试探」。'},
  {tag:'N17',subj:'net',q:'收到 3 个重复 ACK 时，TCP 怎么做？',o:['超时重传', '断开连接', '忽略', '快重传丢失的报文，然后快恢复（cwnd 减半）'],a:3,why:'3 个重复 ACK 说明「有一个报文丢了，但后面的到了」。快重传立即重发，快恢复把 cwnd 减半（不是归 1），继续拥塞避免。'},
  {tag:'N17',subj:'net',q:'「快恢复」相比「慢开始」的优势是？',o:['不把 cwnd 归 1，避免吞吐量骤降', '更省内存', '更快重传', '更安全'],a:0,why:'快恢复：cwnd = ssthresh = cwnd/2，直接从减半处继续（拥塞避免），而不是回到 1 重新慢开始。适合「轻微拥塞」。'},
  {tag:'N17',subj:'net',q:'TCP 的「接收窗口」（rwnd）和「拥塞窗口」（cwnd）的区别是？',o:['rwnd 更大', 'cwnd 在接收方', 'rwnd 由接收方决定（流量控制），cwnd 由发送方估计（拥塞控制）', '两者相同'],a:2,why:'发送方实际能发的量 = min(rwnd, cwnd)。rwnd 防「把接收方撑爆」，cwnd 防「把网络撑爆」。'},
  {tag:'N17',subj:'net',q:'「零窗口」探测的作用是？',o:['接收方窗口为 0 时，发送方定期探测何时能再发', '加快传输', '断开连接', '重传'],a:0,why:'接收方缓冲满时通告 rwnd=0。发送方停止发送，但定期发「零窗口探测」（1 字节），防止「窗口更新报文丢失」导致双方死等。'},
  {tag:'N18',subj:'net',q:'UDP 首部中「长度」字段表示？',o:['UDP 首部 + 数据的长度', '只有首部长度', '只有数据长度', '窗口大小'],a:0,why:'UDP 长度字段（16 位）= 首部 8 字节 + 数据长度。最小值是 8（无数据），最大 65535。'},
  {tag:'N18',subj:'net',q:'UDP 的「校验和」是可选的，为什么？',o:['因为链路层可能已校验，且 UDP 追求效率', '兼容旧设备', '协议疏漏', '节省内存'],a:0,why:'IPv4 下 UDP 校验和可选（全 0 表示不校验）。IPv6 下**强制**（因为没有首部校验和）。'},
  {tag:'N18',subj:'net',q:'实时音视频为什么常用 UDP？',o:['容忍丢包但不能容忍延迟（TCP 重传会造成卡顿）', 'UDP 更快', 'UDP 更可靠', 'TCP 不支持音视频'],a:0,why:'音视频：丢一帧只是短暂花屏，但延迟（TCP 重传等待）会造成严重卡顿。所以用 UDP + 应用层补偿（FEC、抖动缓冲）。'},
  {tag:'N18',subj:'net',q:'「抖动缓冲」（jitter buffer）的作用是？',o:['压缩数据', '加密', '加快传输', '吸收网络延迟抖动，平滑播放'],a:3,why:'网络延迟不稳定（抖动），接收方用缓冲区「攒一会儿再播」，把抖动抹平。代价是增加延迟（缓冲越深越平滑但越延迟）。'},
  {tag:'N18',subj:'net',q:'QUIC 协议基于什么传输层？',o:['UDP（在用户态实现可靠传输）', 'SCTP', '裸 IP', 'TCP'],a:0,why:'QUIC（HTTP/3 的底层）基于 UDP，在用户态实现可靠传输、拥塞控制、多路复用。避免 TCP 的队头阻塞和握手延迟。'},
  {tag:'N18',subj:'net',q:'「队头阻塞」（HOL blocking）在 HTTP/2 中的表现是？',o:['所有连接都阻塞', '客户端阻塞', '一个流丢包会阻塞同连接的所有流', '服务器阻塞'],a:2,why:'HTTP/2 多路复用共享一个 TCP 连接。TCP 保证有序，所以一个包丢了，后面的都要等（即使属于其他流）。QUIC 解决了这个问题。'},
  {tag:'N18',subj:'net',q:'「UDP 打洞」用于？',o:['压缩', '加快 UDP', '加密', 'NAT 后的两个主机建立 P2P 连接'],a:3,why:'双方先向对方的公网地址发包（在 NAT 上建立映射），之后 NAT 就允许对方的数据进来。P2P、视频通话常用。'},
  {tag:'N18',subj:'net',q:'SCTP 相比 TCP 的优势是？',o:['不需要握手', '多流（一个连接多个独立流，避免队头阻塞）', '更简单', '更快'],a:1,why:'SCTP（流控制传输协议）：多宿（多 IP 冗余）、多流（流间独立）、消息边界。结合了 TCP 和 UDP 的优点，但部署少。'},
  {tag:'N19',subj:'net',q:'TCP 服务器的标准流程是？',o:['bind → connect', 'listen → socket', 'socket → bind → listen → accept → read/write → close', 'socket → connect → send'],a:2,why:'服务器：创建套接字 → 绑定地址端口 → 监听 → 接受连接（阻塞）→ 收发数据 → 关闭。客户端：socket → connect → 收发。'},
  {tag:'N19',subj:'net',q:'「listen」的 backlog 参数表示？',o:['监听端口数', '超时时间', '缓冲区大小', '等待 accept 的连接队列长度'],a:3,why:'backlog：已完成三次握手但还没被 accept 的连接队列长度。队列满了新连接会被拒绝（或忽略）。'},
  {tag:'N19',subj:'net',q:'「阻塞 socket」和「非阻塞 socket」的区别是？',o:['非阻塞更慢', '两者相同', '阻塞的 accept/read 会等，非阻塞立即返回', '阻塞不返回'],a:2,why:'阻塞：accept 没连接就睡，read 没数据就睡。非阻塞：立即返回 EAGAIN，配合 select/epoll 使用（高并发）。'},
  {tag:'N19',subj:'net',q:'「端口复用」（SO_REUSEADDR）解决什么问题？',o:['加快连接', '加密', '负载均衡', '服务器重启时 TIME_WAIT 状态导致端口被占用'],a:3,why:'服务器关闭后端口进入 TIME_WAIT（2MSL）。重启时 bind 会失败。SO_REUSEADDR 允许复用 TIME_WAIT 的端口。'},
  {tag:'N19',subj:'net',q:'「TCP_NODELAY」选项的作用是？',o:['禁用 Nagle 算法，小包立即发送（降低延迟）', '加密', '减少重传', '加快带宽'],a:0,why:'Nagle 算法会攒小包再发（提高效率但增加延迟）。TCP_NODELAY 关掉它，适合交互式应用（如 SSH、游戏）。'},
  {tag:'N19',subj:'net',q:'「粘包」问题出现在？',o:['链路层', 'UDP 中', 'TCP 流式传输中，多条消息边界无法区分', 'IP 层'],a:2,why:'TCP 是字节流，没有消息边界。发送方连发两条消息，接收方可能一次读到（粘在一起）。解决：定长、分隔符、长度前缀。'},
  {tag:'N19',subj:'net',q:'「I/O 多路复用」中 epoll 相比 select 的优势是？',o:['更省内存', '无需遍历所有 fd，O(1) 就绪通知，支持更多连接', '更兼容', '更简单'],a:1,why:'select/poll 每次要遍历所有 fd（O(n)）。epoll 用事件驱动（回调注册），只返回就绪的 fd（O(1)），适合数万连接。'},
  {tag:'N19',subj:'net',q:'「零拷贝」（sendfile）在文件传输中的作用是？',o:['压缩', '减少磁盘', '减少用户态/内核态拷贝，提高发送效率', '加密'],a:2,why:'传统：磁盘→内核缓冲→用户缓冲→socket 缓冲→网卡（4 次拷贝）。sendfile：磁盘→内核缓冲→网卡（2 次），CPU 拷贝减少。'},
  {tag:'N20',subj:'net',q:'TLS 握手的主要目的是？',o:['加快传输', '路由选择', '压缩数据', '协商加密算法、交换密钥、认证服务器'],a:3,why:'TLS 握手：① 客户端发支持的算法；② 服务器选算法并发证书；③ 验证证书；④ 交换密钥（或 DH 协商）；⑤ 之后用对称加密通信。'},
  {tag:'N20',subj:'net',q:'TLS 为什么用「非对称加密协商 + 对称加密传输」？',o:['非对称更快', '两者一样', '非对称安全但慢，对称快但需先共享密钥', '对称更安全'],a:2,why:'非对称（RSA/ECDHE）用于安全地协商出会话密钥（解决密钥分发）。之后用对称（AES）加密数据（快）。两全其美。'},
  {tag:'N20',subj:'net',q:'「证书」在 TLS 中的作用是？',o:['证明服务器身份（由 CA 签名）', '加密数据', '压缩', '加快握手'],a:0,why:'证书包含：公钥、域名、有效期、CA 签名。客户端用 CA 公钥验证签名，确认「这个公钥确实属于这个域名」，防中间人。'},
  {tag:'N20',subj:'net',q:'「中间人攻击」（MITM）在 TLS 中如何被防？',o:['会话复用', '压缩', '加密算法', '证书链验证（客户端校验服务器证书是否可信）'],a:3,why:'攻击者伪造服务器，但拿不到可信 CA 签发的证书（域名不匹配或签名无效）。客户端验证失败就断开。'},
  {tag:'N20',subj:'net',q:'TLS 1.3 相比 1.2 的主要改进是？',o:['更快', '更安全', '握手从 2-RTT 降到 1-RTT（甚至 0-RTT），并移除弱算法', '更简单'],a:2,why:'TLS 1.3：精简握手（1-RTT，会话恢复可 0-RTT）、移除 RSA 密钥交换和 CBC 等弱算法、强制前向保密（ECDHE）。'},
  {tag:'N20',subj:'net',q:'「前向保密」（PFS）是指？',o:['向前兼容', '会话复用', '加密强度递增', '长期密钥泄露也不影响历史会话的安全'],a:3,why:'PFS 用临时密钥（每次会话新的 DH 密钥）。即使服务器私钥泄露，攻击者也无法解密之前的流量（因为会话密钥已销毁）。'},
  {tag:'N20',subj:'net',q:'「DTLS」和 TLS 的关系是？',o:['TLS 基于 UDP', '两者相同', 'DTLS 是 TLS 的 UDP 版本（用于实时通信）', 'DTLS 更快'],a:2,why:'DTLS（Datagram TLS）：在 UDP 上实现 TLS 的安全保证，处理丢包和乱序。用于 WebRTC、VPN（OpenVPN）。'},
  {tag:'N20',subj:'net',q:'「SNI」的作用是？',o:['负载均衡', '客户端在握手时告知要访问的域名（一个 IP 托管多站点）', '加密域名', '压缩'],a:1,why:'SNI（Server Name Indication）：TLS 握手时客户端发送目标域名，服务器据此选对应证书。解决「一个 IP 多个 HTTPS 站点」。'}
];

  1: [
    {id:'c1-1',  title:'线性表的定义', src:'1.1', body:'n 个数据元素的有限序列，n=0 时是空表。它是逻辑结构，不是存储结构。'},
    {id:'c1-2',  title:'逻辑结构 vs 存储结构', src:'1.1', body:'逻辑结构描述元素之间的关系（一对一）；存储结构是它在内存里的实现方式。'},
    {id:'c1-3',  title:'顺序表插入', src:'1.1', body:'第 i 个位置插入，要移动 n−i+1 个元素。和删除的 (n−i) 差一个 1。'},
    {id:'c1-4',  title:'链表插入的顺序', src:'1.1', body:'先 s->next = p->next，再 p->next = s。顺序反了会断链。'},
    {id:'c1-5',  title:'头结点的作用', src:'1.1', body:'统一空表与非空表的操作，代价是多占一个结点。'},
    {id:'c1-6',  title:'存储密度', src:'1.1', body:'数据占空间 / 结点总空间。链表要存指针所以 <1，顺序表 =1。'},
    {id:'c1-7',  title:'删除结点的陷阱', src:'1.1', body:'先保存 q，让 p 跳过 q，最后才 free(q)。先 free 再访问是野指针。'},
    {id:'c1-8',  title:'顺序表删除', src:'1.1', body:'删除第 i 个平均移动 (n−1)/2 个元素。'},
    {id:'c1-9',  title:'时间复杂度', src:'1.1', body:'顺序表访问 O(1)、插入删除 O(n)；链表访问 O(n)、已定位插入 O(1)。'},
    {id:'c1-10', title:'顺序表 vs 链表', src:'1.1', body:'五维对比：随机访问、插入删除、存储密度、空间连续性、缓存友好。'}
  ],
  2: [
    {id:'c2-1',  title:'栈的定义', src:'2.1', body:'后进先出（LIFO），只在栈顶插入和删除。栈是操作受限的线性表。'},
    {id:'c2-2',  title:'顺序栈的 top 指针', src:'2.1', body:'top 指向栈顶元素（初始 −1，空栈 top==−1，满栈 top==MAXSIZE−1）。也可以指向栈顶下一空位（初始 0）。两种写法要配套。'},
    {id:'c2-3',  title:'出栈序列的判断', src:'2.1', body:'入栈 1、2、3，出栈 3、1、2 不可能——3 先出说明 1、2 都在栈里，栈顶是 2，下一个只能是 2。n 个元素共 Catalan 种出栈序列。'},
    {id:'c2-4',  title:'栈的三大应用', src:'2.2', body:'括号匹配、表达式求值（中缀转后缀）、递归调用（栈帧保存返回地址和局部变量）。'},
    {id:'c2-5',  title:'共享栈', src:'2.2', body:'两个栈从数组两端向中间生长，top1 + 1 == top2 时满。空间利用率最高。'},
    {id:'c2-6',  title:'队列的定义', src:'2.3', body:'先进先出（FIFO），队尾入队、队头出队。也是操作受限的线性表。'},
    {id:'c2-7',  title:'循环队列判空判满', src:'2.3', body:'判空 front == rear；判满 (rear+1)%MAXSIZE == front（少用一个空间）。两者不能混。'},
    {id:'c2-8',  title:'循环队列元素个数', src:'2.3', body:'(rear − front + MAXSIZE) % MAXSIZE。加 MAXSIZE 是因为 rear 可能小于 front（绕回了）。'},
    {id:'c2-9',  title:'假溢出', src:'2.3', body:'顺序队列出队后队头前移，但队尾到了数组末尾就报满——明明前面还有空位。解法是改成循环队列。'},
    {id:'c2-10', title:'队列的应用', src:'2.4', body:'二叉树层次遍历（BFS）、打印缓冲区、任务调度、消息队列。只要「先来先服务」就是队列。'}  ],
  3: [
    {id:'c3-1',  title:'串的定义', src:'3.1', body:'串是元素为字符的线性表（内容受限）。长度 = 字符个数，不是字节数。'},
    {id:'c3-2',  title:'空串 vs 空格串', src:'3.1', body:'空串（长度为 0）vs 空格串（全是空格字符、长度大于 0）。这是最容易记混的一对。'},
    {id:'c3-3',  title:'子串数目', src:'3.1', body:'长度 n 的串，子串个数 = n(n+1)/2 + 1（含空串）。子序列则是 2^n。'},
    {id:'c3-4',  title:'串的比较', src:'3.1', body:'按字典序逐字符比 ASCII；若一个是另一个的前缀，长的更大。'},
    {id:'c3-5',  title:'BF 的核心', src:'3.2', body:'暴力匹配：失配时主串指针回退到起点+1，模式串回到开头。简单但慢。'},
    {id:'c3-6',  title:'BF 的复杂度', src:'3.2', body:'最坏 O(n×m)（大量重复字符、最后才失配），最好 O(n)（每次第一个字符就失配）。'},
    {id:'c3-7',  title:'KMP 的核心', src:'3.3', body:'失配时主串指针 i 不回退，只让模式串指针 j 跳到 next[j]。这是 O(n+m) 的关键。'},
    {id:'c3-8',  title:'next 数组的含义', src:'3.3', body:'next[j] = 模式串前 j 个字符中「最长相等前后缀」的长度。前缀不含最后一个字符，后缀不含第一个。'},
    {id:'c3-9',  title:'KMP 的复杂度', src:'3.3', body:'求 next 数组 O(m)，匹配 O(n)，总共 O(n+m)。i 只增不减是根本原因。'},
    {id:'c3-10', title:'nextval 优化', src:'3.3', body:'若 p[j] == p[next[j]]，跳到 next[j] 后必然再失配，可直接跳到 next[next[j]]。'}
  ],
  4: [
    {id:'c4-1',  title:'树的定义', src:'4.1', body:'n 个节点的有限集，n=0 是空树。定义是递归的：一个根 + 若干互不相交的子树。'},
    {id:'c4-2',  title:'节点数与边数', src:'4.1', body:'n 个节点的树有 n−1 条边。多一条有环，少一条不连通。'},
    {id:'c4-3',  title:'二叉树核心公式', src:'4.2', body:'n0 = n2 + 1（叶子 = 度为 2 的节点 + 1）。推导靠「总边数 = n−1 = n1 + 2n2」。'},
    {id:'c4-4',  title:'完全二叉树编号', src:'4.2', body:'左孩子 2i，右孩子 2i+1，父节点 ⌊i/2⌋。这是数组存储的基础。'},
    {id:'c4-5',  title:'空指针数', src:'4.2', body:'n 个节点的二叉链表有 n+1 个空指针。线索二叉树就是利用这些空指针存前驱后继。'},
    {id:'c4-6',  title:'三种遍历', src:'4.3', body:'前序根左右、中序左根右、后序左右根。区别只是「根」在什么位置访问。'},
    {id:'c4-7',  title:'由遍历序列还原', src:'4.3', body:'前序+中序、后序+中序都能唯一确定；前序+后序不行（分不清只有一个孩子时是左还是右）。'},
    {id:'c4-8',  title:'哈夫曼树', src:'4.4', body:'每次选两个最小权值合并，重复到只剩一个。这样 WPL 最小，编码是前缀码。'},
    {id:'c4-9',  title:'二叉排序树', src:'4.4', body:'左子树所有节点 < 根 < 右子树所有节点。中序遍历得到递增序列。'},
    {id:'c4-10', title:'平衡二叉树', src:'4.4', body:'任意节点的平衡因子（左高−右高）只能是 −1、0、1。失衡要旋转调整。'}
  ],
  5: [
    {id:'c5-1',  title:'边数的上下界', src:'5.1', body:'无向图最多 n(n−1)/2 条边，有向图最多 n(n−1) 条，连通图最少 n−1 条。'},
    {id:'c5-2',  title:'度与边数', src:'5.1', body:'无向图 Σdeg = 2E；有向图 Σ入度 = Σ出度 = E。这两个公式最常考。'},
    {id:'c5-3',  title:'连通与连通分量', src:'5.1', body:'连通：任意两点可达。连通分量 = 极大连通子图，一个连通图只有一个。'},
    {id:'c5-4',  title:'邻接矩阵', src:'5.2', body:'O(n²) 空间，适合稠密图。行和 = 出度，列和 = 入度，无向图对称。'},
    {id:'c5-5',  title:'邻接表', src:'5.2', body:'O(n+e) 空间，适合稀疏图。链表长度 = 出度，求入度要遍历全表。'},
    {id:'c5-6',  title:'DFS 与 BFS', src:'5.3', body:'DFS 用栈（递归），BFS 用队列。邻接矩阵 O(n²)，邻接表 O(n+e)。'},
    {id:'c5-7',  title:'BFS 求最短路', src:'5.3', body:'BFS 按层扩展，第一次到达的层数就是无权图的最短路径（边数）。'},
    {id:'c5-8',  title:'最小生成树', src:'5.4', body:'Prim 加点 O(n²) 适合稠密图，Kruskal 加边 O(e log e) 适合稀疏图，都是 n−1 条边。'},
    {id:'c5-9',  title:'最短路算法', src:'5.5', body:'Dijkstra O(n²) 不能有负权；Floyd O(n³) 可求所有点对、能处理负权（无负环）。'},
    {id:'c5-10', title:'拓扑与关键路径', src:'5.5', body:'拓扑排序要求 DAG（反复删入度 0 的点）；关键路径是源点到汇点的最长路径。'}
  ],
  6: [
    {id:'c6-1',  title:'顺序查找 ASL', src:'6.1', body:'成功时 ASL = (n+1)/2。不要求有序，也不要求顺序存储。'},
    {id:'c6-2',  title:'折半查找的前提', src:'6.1', body:'有序 + 顺序存储。链表不能折半（做不到随机访问）。O(log n)。'},
    {id:'c6-3',  title:'折半查找的判定树', src:'6.1', body:'是平衡二叉树，高度 ⌊log₂n⌋+1，最坏比较次数等于树高。'},
    {id:'c6-4',  title:'装填因子 α', src:'6.2', body:'α = 记录数 / 表长。ASL 取决于 α 而非 n 或 m 单独多大。'},
    {id:'c6-5',  title:'哈希冲突处理', src:'6.2', body:'线性探测会「堆积」，链地址法不会堆积、α 可大于 1，但不省空间。'},
    {id:'c6-6',  title:'插入排序', src:'6.3', body:'直接插入：最好 O(n)（有序）、最坏 O(n²)（逆序）、稳定。希尔：不稳定。'},
    {id:'c6-7',  title:'选择排序', src:'6.3', body:'比较次数恒为 n(n−1)/2，与初始序列无关。移动最多 3(n−1)。不稳定。'},
    {id:'c6-8',  title:'快速排序', src:'6.4', body:'平均 O(n log n)，有序/逆序时退化 O(n²)。空间 O(log n)。不稳定。'},
    {id:'c6-9',  title:'归并排序', src:'6.4', body:'稳定 + O(n log n)，唯一同时满足这两点的，代价是 O(n) 空间。'},
    {id:'c6-10', title:'堆排序', src:'6.5', body:'建堆 O(n)，排序 O(n log n)，空间 O(1)，不稳定。最坏也是 O(n log n)。'}
  ],
  os: [
    {id:'co-1',  title:'OS 的两个身份', src:'OS1', body:'对下是资源管理者（CPU、内存、设备、文件），对上提供接口（系统调用、命令）。'},

    {id:'co-3',  title:'用户态与内核态', src:'OS1', body:'进内核态只有三种方式：系统调用、中断、异常。普通运算始终在用户态。'},
    {id:'co-4',  title:'进程 vs 程序', src:'OS2', body:'程序是静态代码，进程是程序的一次执行（有生命周期、占资源）。'},
    {id:'co-5',  title:'PCB 的作用', src:'OS2', body:'进程存在的唯一标志。创建进程 = 创建 PCB，撤销 = 回收 PCB。'},
    {id:'co-6',  title:'进程三态转换', src:'OS2', body:'运行→阻塞（等 IO），运行→就绪（时间片到），阻塞→就绪（事件发生）。阻塞不能直接变运行。'},
    {id:'co-7',  title:'死锁四条件', src:'OS2', body:'互斥、请求并保持、不可剥夺、循环等待。四个同时成立才可能死锁。'},
    {id:'co-8',  title:'分页 vs 分段', src:'OS3', body:'页是物理划分（大小固定、透明），段是逻辑划分（大小可变、用户可见）。'},
    {id:'co-9',  title:'虚拟内存的基础', src:'OS3', body:'程序局部性原理：只把正在用的部分调入内存，其余留磁盘。'},
    {id:'co-10', title:'页面置换', src:'OS3', body:'FIFO 有 Belady 异常；LRU 不会；OPT 是理论最优但无法实现。'},
    {id:'co-11', title:'生产者消费者', src:'OS2', body:'empty 初值 = 缓冲区大小，full 初值 = 0。生产者 P(empty)，消费者 P(full)。'},
    {id:'co-12', title:'哲学家问题', src:'OS2', body:'5 人 5 叉，同时拿左手的会互相等右边的 → 死锁。解法：允许最多 4 人同时取。'},
    {id:'co-13', title:'互斥 vs 同步', src:'OS2', body:'互斥是排他（一个进来别人等），同步是顺序（必须 A 先 B 后）。'},
    {id:'co-14', title:'共享内存', src:'OS2', body:'最快的 IPC，但多个进程同时读写会冲突，必须配信号量。'},
    {id:'co-15', title:'线程共享什么', src:'OS2', body:'共享：代码、数据、堆、文件描述符。私有：寄存器、栈、PC、线程 ID。'},
    {id:'co-16', title:'线程切换为什么快', src:'OS2', body:'不用换页表（地址空间不变），TLB 和缓存不失效。'},
    {id:'co-17', title:'周转时间', src:'OS2', body:'周转 = 完成 − 到达。带权周转 = 周转 / 服务时间（越接近 1 越好）。'},
    {id:'co-18', title:'RR 时间片', src:'OS2', body:'太大退化成 FCFS，太小切换开销大。通常 20-50ms。'},
    {id:'co-19', title:'死锁 vs 饥饿', src:'OS2', body:'死锁：循环等待永久阻塞。饥饿：长期得不到资源但系统在跑。'},
    {id:'co-20', title:'单实例资源图', src:'OS2', body:'有环 ⟺ 死锁。多实例时有环只是「可能」死锁，要化简判断。'},
    {id:'co-21', title:'内外碎片', src:'OS11', body:'内碎片：分区内浪费（分页最后一页）。外碎片：分区之间零散（连续分配）。'},
    {id:'co-22', title:'三种适应算法', src:'OS11', body:'首次（快）、最佳（省空间但小碎片多）、最坏（少小碎片但耗大块）。'},
    {id:'co-23', title:'页表项字段', src:'OS12', body:'页框号 + 有效位 + 访问位（LRU）+ 脏位（写回）+ 保护位。'},
    {id:'co-24', title:'两级页表代价', src:'OS12', body:'无 TLB 时要三次访存：一级页表 + 二级页表 + 数据。'},
    {id:'co-25', title:'TLB 实现', src:'OS12', body:'相联存储器（CAM），按内容并行查找，一次命中。'},
    {id:'co-26', title:'缺页后重执行', src:'OS13', body:'缺页是执行中发现的中途事件，调入后要「重新执行」该指令。'},
    {id:'co-27', title:'抖动根源', src:'OS13', body:'分配的页框少于工作集 → 频繁缺页 → CPU 骤降。'},
    {id:'co-28', title:'OPT 不可实现', src:'OS14', body:'需要预知未来。只作为理论基准评价其他算法。'},
    {id:'co-29', title:'Belady 异常', src:'OS14', body:'FIFO 加页框反而缺页更多。LRU/OPT 是栈式算法，不会出现。'},
    {id:'co-30', title:'时钟算法', src:'OS14', body:'LRU 低开销近似：访问位 1 则清零跳过，0 则置换（二次机会）。'},
    {id:'co-31', title:'磁盘布局', src:'OS16', body:'引导块 | 超级块 | inode 区 | 数据区。超级块是总账。'},
    {id:'co-32', title:'FCB 不含内容', src:'OS16', body:'inode 存元数据（大小/权限/指针），文件名在目录项，内容在数据区。'},
    {id:'co-33', title:'三种分配', src:'OS17', body:'连续（快但难扩）、链接（只能顺序）、索引（支持随机但占空间）。'},
    {id:'co-34', title:'FAT 的改进', src:'OS17', body:'指针集中到内存表，可跳转到任意块（隐式链接只能顺序）。'},
    {id:'co-35', title:'硬链接 vs 软链接', src:'OS18', body:'硬链接指向 inode（计数）；软链接是独立文件存路径（可跨盘）。'},
    {id:'co-36', title:'树形目录的局限', src:'OS18', body:'不支持共享。共享需要「有向无环图」目录。'},
    {id:'co-37', title:'磁盘调度对比', src:'OS19', body:'FCFS 公平但慢；SSTF 快但饥饿；SCAN 电梯；C-SCAN 更公平。'},
    {id:'co-38', title:'寻道最慢', src:'OS19', body:'寻道（几 ms 到十几 ms）> 旋转延迟（约 4ms）> 传输。'},
    {id:'co-39', title:'空闲管理', src:'OS20', body:'位图（找连续快）、空闲链表、成组链接（UNIX）。'},
    {id:'co-40', title:'page cache', src:'OS20', body:'现代 Linux 统一用页缓存，buffer cache 只是它的视图。'},
    {id:'co-41', title:'字符 vs 块设备', src:'OS21', body:'字符设备以字节流为单位（键盘），块设备以块为单位（磁盘）。'},
    {id:'co-42', title:'设备控制器', src:'OS21', body:'CPU 和物理设备之间的桥梁，实现协议、缓冲、报状态。'},
    {id:'co-43', title:'I/O 四层', src:'OS22', body:'中断处理 → 设备驱动 → 设备独立性 → 用户层。'},

    {id:'co-45', title:'阻塞 vs 非阻塞', src:'OS22', body:'阻塞：没数据就睡。非阻塞：立即返回 EAGAIN。'},
    {id:'co-46', title:'独占 vs 共享', src:'OS23', body:'打印机独占（整段占用），磁盘共享（可交替但需互斥）。'},
    {id:'co-47', title:'SPOOLing 本质', src:'OS24', body:'用磁盘做缓冲，把独占设备虚拟成共享（打印队列）。'},

    {id:'co-49', title:'低级 vs 高级格式化', src:'OS25', body:'低级划磁道扇区（物理），高级建文件系统（逻辑）。'},
    {id:'co-50', title:'SSD 的 TRIM', src:'OS25', body:'通知 SSD 哪些块已删除可回收。碎片整理对 SSD 有害。'}
  ],
  coa: [
    {id:'ca-1',  title:'补码的范围', src:'COA1', body:'n 位补码：−2^(n−1) ~ 2^(n−1)−1。8 位是 −128~127。0 只有一个编码。'},
    {id:'ca-2',  title:'取反加一', src:'COA1', body:'求 −x 的补码：把 x 的补码（含符号位）全部取反，再加 1。'},
    {id:'ca-3',  title:'IEEE 754 单精度', src:'COA1', body:'1 位符号 + 8 位阶码 + 23 位尾数。阶码用移码，尾数隐含最高位 1。'},
    {id:'ca-4',  title:'海明码公式', src:'COA1', body:'2^r ≥ k + r + 1。r 个校验位要能定位「任意一位出错」+「无错」。'},

function applyTheme(subj){
  const t = THEMES[subj] || THEMES.ds;
  const r = document.documentElement.style;
  r.setProperty('--bg', t.bg);
  r.setProperty('--panel', t.p1);
  r.setProperty('--panel2', t.p2);
  r.setProperty('--line', t.line);
  r.setProperty('--line2', t.line2);
  r.setProperty('--ink', t.ink);
  r.setProperty('--dim', t.dim);
  r.setProperty('--green', t.main);
  r.setProperty('--cyan', t.sub);

  // 玩家与子弹由皮肤控制，不跟随科目主题
  return t;
}

function levelCfg(n){
  // 第 3 章起：从 SUBJ_CH3..CH7 取
  if(G.chapter >= 3){
    const M = {3:SUBJ_CH3, 4:SUBJ_CH4, 5:SUBJ_CH5, 6:SUBJ_CH6, 7:SUBJ_CH7};
    const src = M[G.chapter];
    if(src && src[G.subject]){
      const arr = src[G.subject];
      return arr[Math.min(n, arr.length) - 1];
    }
  }
  // 第 2 章
  if(G.chapter === 2 && SUBJ_CH2[G.subject]){
    const c2 = SUBJ_CH2[G.subject];
    return c2[Math.min(n, c2.length) - 1];
  }
  // 第 1 章
  const other = SUBJ_CHAPTERS[G.subject];
  if(other) return other[Math.min(n, other.length) - 1];
  const chs = CHAPTERS[G.chapter] || CHAPTERS[1];
  return chs[Math.min(n, chs.length) - 1];
}
