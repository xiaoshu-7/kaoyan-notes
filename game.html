<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>刷题防线 · 考研笔记</title>
<style>
:root{
  --bg:#060f0b;
  --panel:#0b1a13;
  --panel2:#0e2018;
  --line:rgba(90,210,150,.22);
  --line2:rgba(90,210,150,.12);
  --ink:#c9e8d8;
  --dim:#5f8172;
  --green:#5fe08a;
  --cyan:#7fd6ff;
  --gold:#ffd166;
  --red:#ff6b6b;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:radial-gradient(1200px 760px at 50% -15%,#0d2018,#050a08 65%);
  color:var(--ink);
  font-family:"Cascadia Code","Consolas","Microsoft YaHei",monospace;
  display:flex;align-items:center;justify-content:center;
  padding:16px;overflow:hidden;
}

.app{
  width:100%;max-width:1240px;height:100%;max-height:820px;
  display:flex;flex-direction:column;
  background:linear-gradient(180deg,#0b1912,#070e0a);
  border:1px solid var(--line);border-radius:5px;
  box-shadow:0 28px 80px -24px #000, inset 0 1px 0 rgba(120,230,170,.06);
  overflow:hidden;
}

.top{
  display:flex;align-items:center;gap:14px;
  padding:9px 16px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,#0e2018,#0a1510);
  font-size:11.5px;flex:0 0 auto;
}
.top a{color:var(--dim);text-decoration:none;padding:3px 8px;border:1px solid transparent;border-radius:2px;transition:.15s}
.top a:hover{color:var(--green);border-color:var(--line)}
.top .name{font-size:13px;letter-spacing:.2em;color:var(--green);text-shadow:0 0 14px rgba(95,224,138,.4)}
.top .sp{flex:1}
.top .kv{color:var(--dim);font-size:10.5px}
.top .kv b{color:var(--ink);font-weight:500}

.main{display:flex;flex:1;min-height:0}

/* 左：战场 */
.stage{
  flex:1;min-width:0;display:flex;flex-direction:column;
  padding:12px;gap:9px;border-right:1px solid var(--line);
}
.screen{
  position:relative;flex:1;min-height:0;
  background:#040a07;border:1px solid var(--line);
  border-radius:3px;overflow:hidden;
  box-shadow:inset 0 0 60px rgba(0,0,0,.75);
}
canvas{display:block;width:100%;height:100%;cursor:crosshair}

.hud{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:7px 12px;background:var(--panel2);border:1px solid var(--line2);
  border-radius:3px;font-size:10.5px;color:var(--dim);flex:0 0 auto;
}
.hud b{color:var(--ink);font-weight:500}
.hud .bar{width:82px;height:5px;background:#12281e;border-radius:2px;overflow:hidden;display:inline-block;vertical-align:middle}
.hud .bar i{display:block;height:100%;background:var(--green);transition:width .18s}
.hud .sp{flex:1}
.hud .threat{color:var(--cyan)}

.traits{
  display:flex;gap:6px;flex-wrap:wrap;align-items:center;
  padding:6px 12px;background:var(--panel2);
  border:1px solid var(--line2);border-radius:3px;
  font-size:10px;min-height:27px;flex:0 0 auto;
}
.traits .tr{
  padding:1px 7px;border:1px solid currentColor;border-radius:2px;
  white-space:nowrap;letter-spacing:.02em;
}
.traits .tr b{font-weight:700;margin-left:3px}

.wavebar{
  position:absolute;left:50%;top:14px;transform:translateX(-50%);
  z-index:6;display:none;
  padding:7px 18px;border-radius:20px;
  background:rgba(6,18,13,.88);border:1px solid rgba(90,210,150,.3);
  font-size:11.5px;color:#a8dcc0;letter-spacing:.05em;
  cursor:pointer;transition:.16s;white-space:nowrap;
  backdrop-filter:blur(2px);
}
.wavebar.on{display:block}
.wavebar:hover{border-color:#5fe08a;color:#e8fff2;background:rgba(10,28,20,.94)}
.wavebar b{color:#ffd166;font-size:13px;margin:0 2px}
.wavebar .go{opacity:.72;margin-left:8px;font-size:10.5px}
.wavebar.tip{color:#ffd166;border-color:rgba(255,209,102,.5);cursor:default}
.wavebar.tip:hover{border-color:rgba(255,209,102,.5);color:#ffd166;background:rgba(6,18,13,.88)}

/* 菜单 */
.menu{
  position:absolute;inset:0;z-index:8;
  background:rgba(3,8,6,.94);backdrop-filter:blur(3px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;padding:24px;text-align:center;overflow-y:auto;
}
.menu.off{display:none}
.menu h1{font-size:22px;letter-spacing:.32em;color:var(--green);text-shadow:0 0 26px rgba(95,224,138,.5)}
.menu .hint{font-size:11px;color:var(--dim);line-height:2;letter-spacing:.03em}
.opt-row{display:flex;flex-direction:column;gap:6px;align-items:center}
.opt-row .lbl{font-size:10px;color:var(--dim);letter-spacing:.18em}
.seg{display:flex;gap:6px}
.seg button{
  padding:6px 18px;background:#0c1b14;color:var(--dim);
  border:1px solid var(--line);border-radius:2px;cursor:pointer;
  font-family:inherit;font-size:11.5px;letter-spacing:.1em;transition:.14s;
}
.seg button:hover{color:var(--ink);border-color:rgba(90,210,150,.45)}
.seg button.on{background:rgba(95,224,138,.14);color:var(--green);border-color:var(--green)}
.btn-start{
  margin-top:4px;padding:9px 40px;background:var(--green);color:#04140b;
  border:none;border-radius:2px;font-family:inherit;font-size:13px;
  letter-spacing:.24em;font-weight:700;cursor:pointer;transition:.15s;
}
.btn-start:hover{background:#7df0a4;transform:translateY(-1px)}

/* 答题 */
.quiz{
  width:400px;flex:0 0 400px;display:flex;flex-direction:column;
  background:#071009;min-height:0;
}
.qhead{
  padding:9px 15px;border-bottom:1px solid var(--line2);
  display:flex;align-items:center;gap:9px;font-size:10.5px;color:var(--dim);
  flex:0 0 auto;
}
.qhead .n{color:var(--gold);font-size:11.5px}
.qhead .sp{flex:1}
.qhead .st{color:var(--cyan)}
.reward-tag{
  font-size:10px;padding:2px 7px;border-radius:2px;
  border:1px solid currentColor;color:#7fd6ff;
  white-space:nowrap;letter-spacing:.02em;
}

.qbody{padding:16px 18px;display:flex;flex-direction:column;gap:12px;overflow-y:auto;flex:1}
.qtext{font-size:14px;line-height:1.9;color:#dcefe4}
.qtext code{background:#12251b;padding:1px 5px;border-radius:2px;color:var(--cyan);font-size:12.5px}

.opts{display:flex;flex-direction:column;gap:7px}
.opt{
  display:flex;gap:9px;align-items:flex-start;text-align:left;
  padding:10px 12px;background:#0a1710;border:1px solid #16301f;
  border-radius:3px;cursor:pointer;transition:.14s;
  font-size:12.5px;line-height:1.7;color:#b6d2c2;font-family:inherit;
}
.opt:hover{border-color:#2a5a40;background:#0d1e15}
.opt .k{
  flex:0 0 auto;width:16px;height:16px;border-radius:2px;background:#16301f;
  color:#7a9c8a;font-size:10px;display:flex;align-items:center;justify-content:center;
  margin-top:2px;
}
.opt.right{border-color:#2f7a4e;background:rgba(95,224,138,.1)}
.opt.right .k{background:#2f7a4e;color:#d6ffe6}
.opt.wrong{border-color:#7a3232;background:rgba(255,107,107,.08)}
.opt.wrong .k{background:#7a3232;color:#ffdcdc}
.opt.miss{border-color:#2f7a4e;background:rgba(95,224,138,.05);opacity:.85}
.opt:disabled{cursor:default}

.why{
  border-left:2px solid var(--cyan);padding:9px 11px;
  background:rgba(127,214,255,.06);font-size:11.5px;line-height:1.9;
  color:#9dbfae;display:none;
}
.why.on{display:block}
.why b{color:var(--cyan)}

.foot{
  padding:7px 15px;border-top:1px solid var(--line2);
  display:flex;gap:14px;font-size:10.5px;color:var(--dim);flex:0 0 auto;
}
.foot b{color:var(--ink)}
.foot .ok{color:var(--green)}
.foot .no{color:var(--red)}
.foot .sp{flex:1}

@media(max-width:1000px){
  body{overflow:auto;align-items:flex-start;height:auto;padding:8px}
  .app{height:auto;max-height:none}
  .main{flex-direction:column}
  .quiz{width:auto;flex:none;border-top:1px solid var(--line)}
  .screen{min-height:320px}
}
</style>
</head>
<body>

<div class="app">
  <div class="top">
    <a href="index.html">← 返回笔记</a>
    <span class="name">刷题防线</span>
    <span class="kv" id="topKv">—</span>
    <span class="sp"></span>
    <span class="kv">WASD 移动 · 鼠标瞄准 · 按住左键开火 · 1-4 或点击答题</span>
  </div>

  <div class="main">
    <div class="stage">
      <div class="screen" id="screen">
        <canvas id="cv"></canvas>

        <div class="wavebar" id="wavebar"></div>

        <div class="menu off" id="pauseMenu">
          <h1 style="font-size:18px;letter-spacing:.24em">已 暂 停</h1>
          <div class="opt-row">
            <span class="lbl">音 效</span>
            <div class="seg" id="pauseSound">
              <button data-v="on" class="on">开</button>
              <button data-v="off">关</button>
            </div>
          </div>
          <div class="opt-row">
            <span class="lbl">开 火</span>
            <div class="seg" id="pauseFire">
              <button data-v="manual" class="on">手动</button>
              <button data-v="auto">自动</button>
            </div>
          </div>
          <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;justify-content:center">
            <button class="btn-start" id="resumeBtn" style="padding:8px 26px;font-size:12px">继 续</button>
            <button class="btn-start" id="restartBtn" style="padding:8px 22px;font-size:12px;background:#22402f;color:#a8dcc0">重开本关</button>
            <button class="btn-start" id="quitBtn" style="padding:8px 22px;font-size:12px;background:#33201f;color:#c9a0a0">退 出</button>
          </div>
        </div>

        <div class="menu" id="menu">
          <h1>刷 题 防 线</h1>
          <div class="hint">
            基地在中央，敌军从四面八方压来。<br>
            左手 WASD 移动，右手鼠标瞄准。<br>
            答对获得奖励，答错没有惩罚，但敌军会随时间变强。
          </div>

          <div class="opt-row">
            <span class="lbl">地 图</span>
            <div class="seg" id="segSize">
              <button data-v="s">小</button>
              <button data-v="m" class="on">中</button>
              <button data-v="l">大</button>
            </div>
          </div>

          <div class="opt-row">
            <span class="lbl">难 度</span>
            <div class="seg" id="segDiff">
              <button data-v="easy">简单</button>
              <button data-v="normal" class="on">普通</button>
              <button data-v="hard">困难</button>
            </div>
          </div>

          <div class="opt-row">
            <span class="lbl">开 火</span>
            <div class="seg" id="segFire">
              <button data-v="manual" class="on">手动</button>
              <button data-v="auto">自动</button>
            </div>
          </div>

          <div class="opt-row">
            <span class="lbl">题 目</span>
            <div class="seg" id="segOrder">
              <button data-v="random" class="on">随机</button>
              <button data-v="seq">顺序</button>
            </div>
          </div>

          <button class="btn-start" id="startBtn">开 始</button>
        </div>
      </div>

      <div class="hud">
        <span>我 <span class="bar"><i id="meBar" style="width:100%;background:#7fd6ff"></i></span> <b id="meTxt">100</b></span>
        <span>基地 <span class="bar"><i id="hpBar" style="width:100%"></i></span> <b id="hpTxt">100</b></span>
        <span>火力 <b id="lvTxt">1</b></span>
        <span class="threat">威胁 <b id="threatTxt">1</b></span>
        <span id="modsBox" style="font-size:10px"></span>
        <span>敌军 <b id="enemyTxt">0</b></span>
        <span class="sp"></span>
        <span>连对 <b id="streakTxt">0</b></span>
      </div>

      <div class="traits" id="traits"><span style="color:#3a4d44">答对题目可获得永久特性</span></div>
    </div>

    <div class="quiz">
      <div class="qhead">
        <span class="n" id="qno">第 1 题</span>
        <span>数据结构 · 线性表</span>
        <span class="sp"></span>
        <span class="reward-tag" id="rewardTag">答对 ——</span>
        <span class="st" id="streakBox">连对 0</span>
      </div>
      <div class="qbody">
        <div class="qtext" id="qtext">点「开始」进入防线……</div>
        <div class="opts" id="opts"></div>
        <div class="why" id="why"></div>
      </div>
      <div class="foot">
        <span>对 <b class="ok" id="okN">0</b></span>
        <span>错 <b class="no" id="noN">0</b></span>
        <span class="sp"></span>
        <span>得分 <b id="scoreN">0</b></span>
      </div>
    </div>
  </div>
</div>

<script>
/* ============================================================
   题库
   ============================================================ */
const BANK = [
  {tag:'L1',q:'线性表是 n 个数据元素的有限序列。这里的「有限」指的是？',o:['表中的操作次数是有限的', '元素的个数 n 是有限的', '占用的存储空间是有限的', '每个元素的大小是有限的'],a:1,why:'线性表的定义强调「有限序列」——元素个数 n ≥ 0 且有限，n = 0 时是空表。元素大小、操作次数、存储空间都不在这个定义里。'},
  {tag:'L1',q:'线性表是一种（　）结构。',o:['存储结构', '物理结构', '索引结构', '逻辑结构'],a:3,why:'线性表描述元素之间一对一的逻辑关系，属于逻辑结构。用数组或链表实现才是存储结构。'},
  {tag:'L1',q:'长度为 0 的线性表称为？',o:['空表', '无表', '零表', '空序列'],a:0,why:'n = 0 的线性表就是空表。这是合法的线性表，不是错误状态。'},
  {tag:'L1',q:'线性表中，除第一个元素外，每个元素有且仅有一个？',o:['直接后继', '直接前驱', '兄弟', '祖先'],a:1,why:'线性结构的特点是「一对一」：除第一个元素外每个元素有且仅有一个前驱，除最后一个外每个元素有且仅有一个后继。'},
  {tag:'L1',q:'线性表的长度是指？',o:['表的字节数', '表中元素的个数', '表能容纳的最大元素数', '表占用的内存大小'],a:1,why:'长度 = 当前元素个数 n。注意和「容量」区分：容量是能容纳的最大数量，长度是实际有的数量。'},
  {tag:'L1',q:'以下哪个不是线性表的基本操作？',o:['插入元素', '对表中元素排序', '按位置查找', '初始化'],a:1,why:'排序不是线性表的基本操作（那是排序算法的事）。基本操作是：初始化、求长度、按位置取值、查找、插入、删除、判空、清空。'},
  {tag:'L1',q:'抽象数据类型（ADT）指的是？',o:['一种具体的数据存储方式', '一种算法', '一个数学模型及定义在该模型上的一组操作', '一种编程语言'],a:2,why:'ADT 只关心「能做什么」（逻辑特性），不关心「怎么做」（实现）。线性表就是一个 ADT：它规定了 insert、delete 等操作，但没说用数组还是链表实现。'},
  {tag:'L1',q:'线性表中，最后一个元素？',o:['后继是第一个元素', '没有后继', '有一个后继', '有两个后继'],a:1,why:'线性表是有限序列，最后一个元素没有后继（除非是循环链表，那就跳出线性表的范畴了）。'},
  {tag:'L2',q:'顺序表「逻辑上相邻的元素物理位置也相邻」，这个特点带来的主要缺点是？',o:['存储密度低', '插入删除要移动大量元素', '只能用指针访问', '不能随机访问'],a:1,why:'顺序表的优点正是随机访问 O(1)；缺点是插入删除平均要移动 n/2 个元素，且需要预先分配连续空间。存储密度高是它的优点。'},
  {tag:'L2',q:'设顺序表首元素 a₁ 的存储地址是 1000，每个元素占 4 个字节，则 a₅ 的地址是？',o:['1012', '1016', '1004', '1020'],a:1,why:'LOC(aᵢ) = LOC(a₁) + (i−1) × L = 1000 + (5−1) × 4 = 1016。这个公式是顺序表随机访问的根据。'},
  {tag:'L2',q:'顺序表的存储密度是？',o:['不确定', '大于 1', '小于 1', '1'],a:3,why:'顺序表只存数据本身，不存额外指针，所以存储密度 = 1（100%）。链表的存储密度 < 1（要存 next 指针）。'},
  {tag:'L2',q:'顺序表要求内存空间？',o:['必须是链表的两倍', '必须在堆上', '连续', '可以不连续'],a:2,why:'顺序表用数组实现，必须占用一段连续的存储空间。这是它「扩容要整体搬迁」的根本原因。'},
  {tag:'L2',q:'顺序表按位置访问第 i 个元素的时间复杂度是？',o:['O(1)', 'O(n²)', 'O(log n)', 'O(n)'],a:0,why:'通过 LOC(aᵢ) = LOC(a₁) + (i−1)×L 可以直接算出地址，一次访存就能取到，所以是 O(1)。这就是「随机存取」。'},
  {tag:'L2',q:'顺序表采用静态分配和动态分配的区别是？',o:['静态分配容量固定，动态分配可扩容', '动态分配不能用数组', '静态分配占空间更大', '静态分配更快'],a:0,why:'静态分配：一开始就定死数组大小，满了不能再加。动态分配：用 malloc/realloc 在堆上分配，满了可以扩容（代价是整体搬迁）。'},
  {tag:'L2',q:'线性表的顺序存储结构是一种（　）的存储结构。',o:['顺序存取', '散列存取', '随机存取', '索引存取'],a:2,why:'顺序表可以直接算出任意元素的地址，所以是随机存取。链表只能从头顺着走，是顺序存取。'},
  {tag:'L2',q:'顺序表能随机访问的根本原因是？',o:['元素大小相同且连续存放，地址可由公式算出', '它的元素有序', '它用了索引', '它存在栈上'],a:0,why:'因为每个元素占同样大小的空间且连续排列，第 i 个元素的地址 = 首地址 + (i−1)×元素大小，一次计算就能定位。链表没有这个性质，因为结点分散在内存各处。'},
  {tag:'L3',q:'在长度为 n 的顺序表中，删除第 i 个元素（1 ≤ i ≤ n），平均需要移动多少个元素？',o:['(n−1)/2', '(n+1)/2', 'n', 'n/2'],a:0,why:'删除第 i 个要移动第 i+1 到第 n 个，共 n−i 个。i 从 1 到 n 等概率，平均值 = (1/n)·Σ(n−i) = (n−1)/2。'},
  {tag:'L3',q:'在长度为 n 的顺序表中，第 i 个位置插入一个元素，需要移动的元素个数是？',o:['n−i', 'n−i+1', 'i', 'n−i−1'],a:1,why:'在第 i 个位置插入，原来的第 i 到第 n 个都要后移一位，共 n−i+1 个。注意和删除的公式差一个 1，这两个最容易混。'},
  {tag:'L3',q:'在长度为 n 的顺序表中插入元素，平均需要移动多少个元素？',o:['n/2', 'n', '(n+1)/2', '(n−1)/2'],a:0,why:'插入位置有 n+1 个可能（1 到 n+1），等概率时平均移动 = (1/(n+1))·Σ(n−i+1) = n/2。注意插入的分母是 n+1，删除的分母是 n。'},
  {tag:'L3',q:'向长度为 n 的顺序表末尾追加一个元素，需要移动多少个元素？',o:['n 个', '0 个', '1 个', 'n/2 个'],a:1,why:'在末尾插入（第 n+1 个位置）时，n−i+1 = n−(n+1)+1 = 0，不需要移动任何元素。这是插入的最好情况。'},
  {tag:'L3',q:'长度为 n 的顺序表，在第一个位置插入元素，需要移动多少个？',o:['0 个', '1 个', 'n 个', 'n−1 个'],a:2,why:'在第一个位置（i=1）插入，n−i+1 = n−1+1 = n，所有元素都要后移。这是插入的最坏情况。'},
  {tag:'L3',q:'长度为 n 的顺序表，删除第一个元素需要移动多少个？',o:['n−1 个', '1 个', 'n 个', '0 个'],a:0,why:'删除第 1 个要移动第 2 到第 n 个，共 n−1 个。删除的最坏情况。'},
  {tag:'L3',q:'长度为 n 的顺序表，插入位置有多少个可能？',o:['1 个', 'n−1 个', 'n 个', 'n+1 个'],a:3,why:'可以插在第 1 个之前、第 1 和第 2 之间……一直到第 n 个之后，共 n+1 个位置。这就是为什么插入的平均分母是 n+1。'},
  {tag:'L3',q:'顺序表扩容时（容量不够，要换更大的数组），需要做什么？',o:['只修改容量标记', '不需要任何操作', '在末尾追加空间', '申请新数组并把所有元素复制过去'],a:3,why:'顺序表要求连续空间，扩容必须申请一块更大的新空间，把原数据全部复制过去，再释放旧空间。这就是顺序表「插入删除代价高」的另一面。'},
  {tag:'L4',q:'单链表中，在指针 p 所指结点之后插入结点 s，正确的操作顺序是？',o:['s->next = p; p->next = s;', 'p->next = s->next; s->next = p;', 'p->next = s; s->next = p->next;', 's->next = p->next; p->next = s;'],a:3,why:'必须先让 s 接住 p 的后继，再让 p 指向 s。顺序反了会丢掉 p 原来的后继，链表断裂。这是链表操作最常见的错误。'},
  {tag:'L4',q:'单链表中，若要在结点 p 之前插入结点 s（p 不是第一个结点），通常需要？',o:['需要额外的头结点才能实现', '无法实现', '直接修改 p 的指针，时间 O(1)', '从头遍历找到 p 的前驱，时间 O(n)'],a:3,why:'单链表只能单向遍历，要改 p 的前驱指针，必须先找到前驱。所以「在 p 前插入」平均要 O(n)。双向链表才有 O(1) 的解法。'},
  {tag:'L4',q:'用头插法建立单链表，得到的链表元素顺序？',o:['随机', '与输入顺序相反', '与输入顺序相同', '有序'],a:1,why:'头插法每次都插在头结点之后，所以最后插入的在最前面。输入 1,2,3 得到 3,2,1。尾插法才能保持顺序，但要维护尾指针。'},
  {tag:'L4',q:'用尾插法建立单链表，需要额外维护什么？',o:['中间指针', '不需要额外指针', '头指针', '尾指针'],a:3,why:'尾插法每次都要在末尾插入，如果每次都从头遍历找尾，就是 O(n²)。所以维护一个尾指针，插入就是 O(1)。'},
  {tag:'L4',q:'在单链表中，已知指针 p 指向某结点，在其后插入一个结点的时间复杂度是？',o:['O(n)', 'O(n²)', 'O(log n)', 'O(1)'],a:3,why:'已经拿到 p 了，只需要改两个指针（s->next = p->next; p->next = s），不需要遍历，所以是 O(1)。这就是链表的优势。'},
  {tag:'L4',q:'在单链表第 i 个位置插入元素，时间复杂度是？',o:['O(1)', 'O(log n)', 'O(n)', 'O(n²)'],a:2,why:'要先从头找到第 i−1 个结点（O(n)），再执行插入（O(1)）。总体是 O(n)。注意区分「已知前驱」和「按位置插入」两种情况。'},
  {tag:'L4',q:'带头结点的单链表，在第一个位置插入元素时？',o:['不能插入', '需要遍历整个链表', '不需要修改头指针', '必须修改头指针'],a:2,why:'有头结点时，第一个位置就是头结点之后，插入逻辑和中间位置一样，不用特殊处理头指针。这就是头结点的价值。'},
  {tag:'L4',q:'单链表中插入结点时，如果先执行 p->next = s 再执行 s->next = p->next，会发生什么？',o:['s 的 next 指向自己，链表断裂', 's 丢失', 'p 丢失', '正常插入'],a:0,why:'p->next 已经变成 s 了，再执行 s->next = p->next 就是 s->next = s，形成自环，原来的后继丢失。这就是「顺序不能反」的原因。'},
  {tag:'L5',q:'单链表中，要删除指针 p 所指结点的后继结点，正确的操作是？',o:['q = p->next; p->next = q->next; free(q);', 'p->next = p->next->next; free(p);', 'p = p->next; free(p);', 'q = p->next; free(q); p->next = q->next;'],a:0,why:'必须先保存要删的结点 q，让 p 跳过 q，最后才 free(q)。先 free 再访问 q->next 是野指针错误。'},
  {tag:'L5',q:'单链表中删除结点时，为什么通常需要知道前驱结点？',o:['因为要修改前驱的 next 指针', '因为要修改后继的 next 指针', '因为要更新头指针', '因为要释放前驱的内存'],a:0,why:'删除 p 结点，本质是让 p 的前驱跳过 p，所以要改前驱的 next。单链表只能单向走，因此要么先找到前驱，要么用「偷梁换柱」法。'},
  {tag:'L5',q:'「偷梁换柱」法删除单链表结点 p（不给前驱）的做法是？',o:['把 p 移到链表尾部', '把 p 的数据复制给前驱', '直接 free(p)', '把 p 的后继的数据复制到 p，然后删除 p 的后继'],a:3,why:'把 p->next 的数据复制到 p，然后删掉 p->next。效果上等于删了 p。前提是 p 不是最后一个结点（否则没有后继可借）。'},
  {tag:'L5',q:'在单链表中删除第 i 个结点，时间复杂度是？',o:['O(n)', 'O(n²)', 'O(log n)', 'O(1)'],a:0,why:'要先找到第 i−1 个结点（前驱），O(n)，再执行删除（O(1)）。总体 O(n)。'},
  {tag:'L5',q:'单链表中删除结点后，为什么要 free 掉内存？',o:['防止指针失效', '保持链表有序', '避免内存泄漏', '加快链表访问'],a:2,why:'C 语言没有垃圾回收，free 掉的结点如果不释放，那块内存就永远占着但没人用，叫内存泄漏。在实际项目中，链表频繁增删时这个问题很严重。'},
  {tag:'L5',q:'带头结点的单链表中，删除第一个元素结点（头结点之后的那个）？',o:['和删除其他结点完全一样', '不能删除', '需要遍历', '需要修改头指针'],a:0,why:'有头结点时，第一个元素结点的前驱就是头结点，删除逻辑和中间结点一致，不用特殊处理。没头结点就要改 head，还得判断是不是空表。'},
  {tag:'L5',q:'单链表中，删除最后一个结点需要做什么？',o:['遍历到倒数第二个结点，把它的 next 置空', '直接 free 最后一个结点', '修改头指针', '不需要任何操作'],a:0,why:'单链表要删最后一个，得先找到倒数第二个（O(n)），把它的 next 置为 NULL，再 free 最后一个。这也是单链表不如双向链表方便的地方。'},
  {tag:'L5',q:'以下哪段代码有野指针错误？',o:['p->next = p->next->next;', 'q = p->next; p->next = q->next; free(q);', 'q = p->next; free(q);', 'q = p->next; free(q); p->next = q->next;'],a:3,why:'先 free(q) 再访问 q->next，访问的是已释放的内存，属于野指针（use-after-free）。必须先取 next 再 free。'},
  {tag:'L6',q:'单链表中设置头结点的主要目的是？',o:['统一空表和非空表的操作', '加快查找速度', '方便存储数据', '节省存储空间'],a:0,why:'有了头结点，在第一个位置插入/删除时不用特殊处理（不用改头指针），代码逻辑统一。代价是多占一个结点的空间。'},
  {tag:'L6',q:'头指针和头结点的区别是？',o:['两者是同一个东西', '头指针是指向第一个结点的指针，头结点是链表开头的一个额外结点', '头指针只能为空，头结点不能为空', '头指针是结点，头结点是指针'],a:1,why:'头指针是必须的（否则找不到链表），头结点是可选的（为了简化操作）。头指针永远指向链表的第一个结点（如果有头结点，就指向头结点）。'},
  {tag:'L6',q:'循环单链表判空的条件是？',o:['head->next == head', 'head->next == NULL', 'head == NULL', 'head->data == 0'],a:0,why:'循环链表的尾结点指回头结点，所以空表时头结点的 next 指向自己。注意和普通单链表（head == NULL 或 head->next == NULL）不同。'},
  {tag:'L6',q:'循环单链表遍历结束的条件是？',o:['p->next == NULL', 'p == NULL', 'p->data == 0', 'p->next == head'],a:3,why:'循环链表没有 NULL 结尾，转一圈回到头结点就结束。如果条件写成 p == NULL 会死循环。'},
  {tag:'L6',q:'静态链表是用什么实现的？',o:['队列', '数组', '栈', '指针'],a:1,why:'静态链表用数组模拟链表：数组的每个元素存数据和「下一个元素的下标」（游标）。适合不支持指针的语言，或需要预分配的场景。'},
  {tag:'L6',q:'双向链表中，在结点 p 之后插入结点 s，需要修改几个指针？',o:['2 个', '3 个', '4 个', '1 个'],a:2,why:'s->prev = p; s->next = p->next; p->next->prev = s; p->next = s; 共四个指针。比单链表多两个，但换来双向遍历和 O(1) 的前插删除。'},
  {tag:'L6',q:'双向链表中删除结点 p，需要怎么做？',o:['需要遍历找前驱', '无法删除', 'p->prev->next = p->next; p->next->prev = p->prev; free(p);', '只需要改一个指针'],a:2,why:'双向链表每个结点都有 prev 和 next，删除时两边都要接上，然后 free。因为能直接拿到前驱，所以是 O(1)。这是它比单链表强的地方。'},
  {tag:'L6',q:'头指针为空（head == NULL）表示？',o:['链表有元素', '链表为空', '链表有头结点', '链表出错'],a:1,why:'头指针为 NULL 说明链表不存在或为空，没有任何结点。有头结点时，空表是 head->next == NULL 或 head->next == head（循环链表）。'},
  {tag:'L7',q:'与顺序表相比，链表的主要优点是？',o:['插入删除不需要移动元素', '存储密度更高', '可以随机访问任意元素', '缓存命中率更高'],a:0,why:'链表插入删除只需改指针，O(1)（已定位的前提下）。但它不支持随机访问（要顺着走 O(n)），还要额外存指针导致存储密度低，结点分散在内存里缓存也不友好。'},
  {tag:'L7',q:'顺序表的存储密度比链表高，原因是？',o:['顺序表不需要扩容', '顺序表的访问速度更快', '顺序表不需要额外存储指针', '顺序表的元素更小'],a:2,why:'存储密度 = 数据本身占的空间 / 结点总空间。链表每个结点要额外存 next 指针，所以密度 < 1；顺序表只存数据，密度 = 1。'},
  {tag:'L7',q:'若某线性表最常用的操作是「取第 i 个元素」和「在第 i 个元素前插入」，采用（　）存储方式最节省时间。',o:['顺序表', '双向链表', '循环链表', '单链表'],a:0,why:'「取第 i 个」在顺序表是 O(1)，链表要 O(n)。虽然插入顺序表要移动元素，但取元素的高频操作更重要。这类题看「哪个操作更频繁」。'},
  {tag:'L7',q:'若某线性表最常用的操作是在末尾插入和删除元素，采用（　）最节省时间。',o:['循环链表', '单链表', '顺序表', '双向链表'],a:2,why:'在末尾插入删除，顺序表不需要移动元素（直接在下标 n 处操作），是 O(1)；单链表要到末尾得遍历 O(n)。'},
  {tag:'L7',q:'以下哪种场景最适合用链表而不是顺序表？',o:['需要节省内存空间', '需要频繁按位置随机访问', '频繁在中间插入删除，元素个数变化大', '数据量固定且很小'],a:2,why:'频繁插入删除 + 数量不定，正是链表的强项（不用移动、不用预分配）。反过来「频繁随机访问」应该用顺序表。'},
  {tag:'L7',q:'链表相比顺序表，在「空间分配」上的优势是？',o:['分配速度更快', '占用空间更少', '不需要释放', '不需要预先分配连续的大块空间'],a:3,why:'链表按需分配结点，有多少元素就占多少空间，不需要一开始就申请一大块连续内存。这对「元素数量不确定」的场景很重要。'},
  {tag:'L7',q:'链表相比顺序表，在「缓存友好」上的劣势是？',o:['链表必须用指针', '结点分散在内存各处，缓存命中率低', '链表不支持 CPU 缓存', '链表不能存大对象'],a:1,why:'顺序表元素连续存放，CPU 缓存一次加载能命中后面好几个元素；链表结点散落各处，每次跳转都可能缓存未命中。所以实际中顺序表往往比理论更快。'},
  {tag:'L7',q:'对长度为 n 的顺序表和链表，各做一次「按值查找」，时间复杂度分别是？',o:['都是 O(1)', '都是 O(n)', 'O(1) 和 O(n)', 'O(n) 和 O(1)'],a:1,why:'按值查找只能逐个比较，两者都是 O(n)。区别在于「按位置访问」：顺序表 O(1)，链表 O(n)。别把「按值」和「按位置」搞混。'},
  {tag:'L8',q:'将单链表逆置（反转）的时间复杂度是？',o:['O(n²)', 'O(log n)', 'O(n)', 'O(1)'],a:2,why:'从头到尾遍历一遍，边遍历边改指针方向，每个结点访问一次，所以是 O(n)。空间只需要几个临时指针，是 O(1)。'},
  {tag:'L8',q:'用快慢指针找单链表的中间结点，快指针每次走几步？',o:['2 步', '3 步', '1 步', 'n 步'],a:0,why:'快指针每次走 2 步，慢指针每次走 1 步。快指针到尾时，慢指针正好在中间。这是链表题最常用的技巧之一。'},
  {tag:'L8',q:'用快慢指针判断单链表是否有环，依据是什么？',o:['两者同时到 NULL', '慢指针先到 NULL', '快指针追上慢指针', '快指针先到 NULL'],a:2,why:'有环的话，快指针会一直绕圈，最终一定追上慢指针。如果没环，快指针会先走到 NULL。这是 Floyd 判圈算法。'},
  {tag:'L8',q:'两个长度分别为 m 和 n 的有序表合并成一个有序表，时间复杂度是？',o:['O(m×n)', 'O(log(m+n))', 'O(max(m,n))', 'O(m+n)'],a:3,why:'双指针从头比较，每次取较小的放入结果，两个表各遍历一次，所以是 O(m+n)。这是归并排序的核心操作。'},
  {tag:'L9',q:'约瑟夫环问题（n 个人围圈报数，报到 m 的出列）最适合用（　）实现。',o:['栈', '顺序表', '队列', '循环链表'],a:3,why:'循环链表天然适合围成圈，每次数到 m 就删除结点，然后从下一个人继续。用数组也能做，但要处理删除后的下标移动。'},
  {tag:'L9',q:'LRU（最近最少使用）缓存的核心数据结构通常是？',o:['顺序表', '栈', '队列', '哈希表 + 双向链表'],a:3,why:'哈希表负责 O(1) 查找，双向链表负责 O(1) 移动到表头（表示刚用过）。淘汰时删链表尾。这是「哈希 + 链表」的经典组合。'},
  {tag:'L9',q:'两个多项式相加（用链表存储），合并同类项的做法是？',o:['排序后相加', '双指针遍历，指数相等就系数相加，不等就取指数小的', '用栈', '用队列'],a:1,why:'两个多项式按指数递增排列，双指针比较：指数相同就系数相加，不同就把指数小的那项放入结果。思想和合并有序表一样。'},
  {tag:'S1',q:'栈的特点是？',o:['后进先出（LIFO）', '随机存取', '按优先级存取', '先进先出（FIFO）'],a:0,why:'栈是后进先出（Last In First Out）。最后压入的元素最先弹出。队列才是先进先出。'},
  {tag:'S1',q:'顺序栈中，栈顶指针 top 通常指向？',o:['栈顶元素的下标（初始为 −1）', '栈底元素的下标', '栈的中间位置', '栈顶元素的下一个位置（初始为 0）'],a:0,why:'常见写法有两种：top 指向栈顶元素（初始 −1，栈空条件 top == −1）；或 top 指向栈顶的下一个空位（初始 0）。两种都行，但入栈出栈的代码要配套。'},
  {tag:'S1',q:'顺序栈（top 指向栈顶元素，初始为 −1）的入栈操作是？',o:['S[top] = x; top++;', 'top++; S[top] = x;', 'S[top+1] = x; top−−;', 'top−−; S[top] = x;'],a:1,why:'先让 top 加 1 指向新的空位，再放元素。出栈则相反：先取 S[top]，再 top−−。'},
  {tag:'S1',q:'顺序栈（top 指向栈顶元素，初始为 −1）的栈空条件是？',o:['top == −1', 'top == 0', 'top == MAXSIZE', 'top == MAXSIZE−1'],a:0,why:'初始时 top = −1 表示没有元素。每压入一个 top 加 1，所以栈空时 top 回到 −1。栈满时 top == MAXSIZE−1。'},
  {tag:'S1',q:'顺序栈（容量 MAXSIZE）的栈满条件是？',o:['top == MAXSIZE', 'top == 0', 'top == MAXSIZE − 1', 'top == MAXSIZE + 1'],a:2,why:'数组下标从 0 到 MAXSIZE−1，top 指向栈顶元素，所以 top == MAXSIZE−1 时满了。再压入就会越界。'},
  {tag:'S1',q:'链栈的栈顶通常在链表的哪个位置？',o:['链表中间', '任意位置', '链表尾部', '链表头部'],a:3,why:'链栈用链表头部做栈顶，因为插入删除在头部是 O(1)，在尾部要遍历 O(n)。所以链栈的 push/pop 都在头结点之后操作。'},
  {tag:'S1',q:'以下哪个操作不是栈的基本操作？',o:['读栈顶元素', '入栈', '出栈', '在栈中间插入元素'],a:3,why:'栈只能在栈顶操作，不能在中间插入。这就是「操作受限」的含义：插入删除只允许在端点进行。'},
  {tag:'S1',q:'栈和队列的共同点是？',o:['都只能在端点处插入和删除', '都是先进先出', '都支持随机访问', '都是后进先出'],a:0,why:'栈和队列都是操作受限的线性表：只能在端点操作（栈在栈顶，队列在两端）。区别是栈后进先出、队列先进先出。'},
  {tag:'S2',q:'若入栈顺序是 1、2、3，则以下哪个出栈序列是不可能的？',o:['3、2、1', '2、1、3', '1、2、3', '3、1、2'],a:3,why:'3 先出栈说明 1、2 都在栈里，此时栈顶是 2，下一个出栈的只能是 2，不可能是 1。所以 3、1、2 不可能。n 个元素出栈序列有 Catalan 数种。'},
  {tag:'S2',q:'若入栈顺序是 1、2、3、4，出栈序列是 2、4、3、1，是否可能？',o:['不可能', '可能', '需要额外栈', '只能部分出栈'],a:1,why:'1 进、2 进、2 出（栈：1）、3 进、4 进、4 出、3 出、1 出。完全合法。判断方法：模拟一遍，出栈时看是否在栈顶。'},
  {tag:'S2',q:'括号匹配检验最适合用（　）实现。',o:['队列', '栈', '数组', '树'],a:1,why:'左括号入栈，遇到右括号就看栈顶是不是对应的左括号。匹配就弹出，不匹配就报错。最后栈空说明全部匹配。'},
  {tag:'S2',q:'中缀表达式转后缀表达式时，需要用（　）辅助。',o:['队列', '栈', '链表', '数组'],a:1,why:'中缀转后缀用栈暂存运算符，遇到优先级不高于栈顶的运算符就先弹出。后缀表达式求值也是用栈（操作数入栈，遇运算符弹两个算完再压回）。'},
  {tag:'S2',q:'后缀表达式（逆波兰式）求值时，操作数应该？',o:['存数组', '放入队列', '直接输出', '压入栈'],a:3,why:'遇到操作数就压栈；遇到运算符就弹出两个操作数，计算后把结果压回栈。最后栈里剩一个数就是答案。'},
  {tag:'S2',q:'递归函数调用时，系统用什么保存返回地址和局部变量？',o:['堆', '队列', '栈', '静态区'],a:2,why:'每次递归调用都会在栈上压入一个「栈帧」，保存参数、局部变量、返回地址。递归太深会导致栈溢出（Stack Overflow）。'},
  {tag:'S2',q:'两个栈共享一个数组空间（共享栈）时，栈满的条件是？',o:['top1 == MAXSIZE', 'top2 == 0', 'top1 + 1 == top2', 'top1 == top2'],a:2,why:'两个栈分别从数组两端向中间生长，当两个栈顶指针相邻（top1 + 1 == top2）时，空间用完。共享栈能把空间利用率提到最高。'},
  {tag:'S2',q:'栈在（　）中有应用。',o:['图的广度优先遍历', '文件压缩', '括号匹配、表达式求值、递归调用', '数据排序'],a:2,why:'栈的三大经典应用：括号匹配检验、表达式求值（中缀转后缀）、函数递归调用。数据排序和 BFS 用队列。'},
  {tag:'Q1',q:'队列的特点是？',o:['随机存取', '按优先级存取', '后进先出（LIFO）', '先进先出（FIFO）'],a:3,why:'队列是先进先出（First In First Out）。从队尾入队，从队头出队。栈才是后进先出。'},
  {tag:'Q1',q:'循环队列（容量 MAXSIZE）判空的条件是？',o:['(rear+1)%MAXSIZE == front', 'front == rear', 'front == 0', 'rear == MAXSIZE−1'],a:1,why:'循环队列用 front == rear 表示空。但这样满的时候也可能 front == rear，所以要用「少用一个空间」或其他方式区分。'},
  {tag:'Q1',q:'循环队列（容量 MAXSIZE，少用一个空间）的队满条件是？',o:['(rear+1)%MAXSIZE == front', 'rear == front', '(front+1)%MAXSIZE == rear', 'rear == MAXSIZE−1'],a:0,why:'队满时 rear 的下一个位置就是 front，所以 (rear+1)%MAXSIZE == front。取模是为了让指针绕回数组开头。'},
  {tag:'Q1',q:'循环队列中，当前元素个数（少用一个空间）的计算公式是？',o:['rear − front', 'rear + front', '(rear − front + MAXSIZE) % MAXSIZE', '(front − rear + MAXSIZE) % MAXSIZE'],a:2,why:'rear 可能小于 front（绕回了），所以要先加 MAXSIZE 再取模，保证结果非负。这个公式必考。'},
  {tag:'Q1',q:'若循环队列的容量是 10（少用一个空间），实际最多能存多少个元素？',o:['8 个', '11 个', '9 个', '10 个'],a:2,why:'少用一个空间用于区分空和满，所以实际容量是 MAXSIZE−1 = 9。这是「浪费一个空间」的代价。'},
  {tag:'Q1',q:'顺序队列（非循环）会出现「假溢出」，原因是？',o:['指针越界', '数组太小', '队列真的满了', '队头有空位但队尾已经到了数组末尾'],a:3,why:'出队后 front 后移，前面空出位置，但 rear 到了数组末尾就不能再入队了——明明还有空间却报满，这就是假溢出。解决办法是改成循环队列。'},
  {tag:'Q1',q:'循环队列为了区分队空和队满，通常采用的方法是？',o:['多用一个存储单元', '用计数器以外的标记位', '少用一个存储单元', '用两个指针'],a:2,why:'常见做法是保留一个空位：队满条件是 (rear+1)%MAXSIZE == front。这样队空（front == rear）和队满不会混淆。也可以加一个 size 计数器。'},
  {tag:'Q1',q:'队列的入队操作在（　）进行，出队操作在（　）进行。',o:['都在队尾', '队头、队尾', '都在队头', '队尾、队头'],a:3,why:'入队（enqueue）在队尾追加，出队（dequeue）从队头删除。这才符合先进先出。'},
  {tag:'Q2',q:'链队列的队头和队尾分别在链表的？',o:['都在头部', '队头在尾部，队尾在头部', '队头在链表头部，队尾在链表尾部', '都在尾部'],a:2,why:'链队列用头指针指队头（出队 O(1)），用尾指针指队尾（入队 O(1)）。这样两个操作都是常数时间。'},
  {tag:'Q2',q:'双端队列（Deque）的特点是？',o:['两端都可以入队和出队', '只能入不能出', '只能一端入队一端出队', '只能出不能入'],a:0,why:'双端队列两端都能插入和删除。如果限制某一端只能入或只能出，就退化成栈或普通队列。408 常考「输入受限」和「输出受限」两种变体。'},
  {tag:'Q2',q:'二叉树的层次遍历需要用（　）辅助。',o:['队列', '数组', '栈', '链表'],a:0,why:'层次遍历是逐层访问，用队列：根入队，然后每次出队一个、访问它、把它的左右孩子入队。DFS（深度优先）才用栈。'},
  {tag:'Q2',q:'操作系统中的打印缓冲区，本质上是（　）的应用。',o:['栈', '树', '数组', '队列'],a:3,why:'多个进程要打印，按提交顺序排队，先提交先打印——这就是队列。缓冲区、消息队列、任务调度都是队列的应用。'}

/* ---------- 自适应 ---------- */
function fitCanvas(){
  const scr = document.getElementById('screen');
  const r = scr.getBoundingClientRect();
  const w = Math.max(320, Math.round(r.width));
  const h = Math.max(240, Math.round(r.height));
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(w * dpr);
  cv.height = Math.round(h * dpr);
  cv.style.width = w + 'px';
  cv.style.height = h + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  G.viewW = w;
  G.viewH = h;
}
window.addEventListener('resize', () => {
  fitCanvas();
  if(G.state === 'play') clampCam();
});

function genWorld(){
  const {cols, rows} = SIZES[G.size];
  G.cols = cols; G.rows = rows;
  G.worldW = cols * TILE;
  G.worldH = rows * TILE;

  const cfg = levelCfg(G.level);
  const tpl = cfg.map || 'fortress';

  const w = [];
  for(let r=0;r<rows;r++) w.push(new Array(cols).fill(0));

  // 外边界
  for(let c=0;c<cols;c++){ w[0][c]=2; w[rows-1][c]=2; }
  for(let r=0;r<rows;r++){ w[r][0]=2; w[r][cols-1]=2; }

  const cx = Math.floor(cols/2), cy = Math.floor(rows/2);
  const clearR = 4;
  const isClear = (r,c) => Math.abs(c-cx) <= clearR && Math.abs(r-cy) <= clearR;

  for(let r=2;r<rows-2;r++){
    for(let c=2;c<cols-2;c++){
      if(isClear(r,c)) continue;
      const dx = Math.abs(c-cx), dy = Math.abs(r-cy);

      if(tpl === 'cross'){
        // 距中心 6 格处一圈墙，四个方向留 5 格缺口
        if(dx === 6 || dy === 6){
          const gapX = dx === 6 && dy <= 2;
          const gapY = dy === 6 && dx <= 2;
          if(!gapX && !gapY) w[r][c] = 2;
        } else if(Math.random() < 0.10){
          w[r][c] = 2;
        }
      }
      else if(tpl === 'rooms'){
        // 十字分隔墙，每 7 格留一个门
        if(c === cx || r === cy){
          const doorC = c === cx && (dy % 7 === 3);
          const doorR = r === cy && (dx % 7 === 3);
          if(!doorC && !doorR) w[r][c] = 2;
        } else if(Math.random() < 0.07){
          w[r][c] = 2;
        }
      }
      else if(tpl === 'ring'){
        // 中心半径 6~9 的环墙，外围散点
        const d = Math.hypot(c-cx, r-cy);
        if(d > 6 && d < 9) w[r][c] = 2;
        else if(d > 13 && Math.random() < 0.18) w[r][c] = 2;
      }
      else if(tpl === 'arena'){
        // 空旷：只有零星掩体
        if(Math.random() < 0.042) w[r][c] = 2;
      }
      else {
        // fortress：棋盘式
        if(r%2===0 && c%2===0 && Math.random() < 0.34) w[r][c] = 2;
        else if(Math.random() < 0.018) w[r][c] = 2;
      }
    }
  }
  G.world = w;

  G.base = {
    x: cx*TILE + TILE/2,
    y: cy*TILE + TILE/2,
    r: TILE*1.15,
    hp: 100, maxHp: 100
  };

  const spot = findFreeCell(cx - 4, cy);
  G.player = {
    x: spot.c*TILE + TILE/2,
    y: spot.r*TILE + TILE/2,
    r: 9, speed: 2.6,
    angle: 0, cd: 0, lv: 1, shield: 90,
    hp: 100, maxHp: 100, dead: 0
  };

  G.cam.x = G.player.x - G.viewW/2;
  G.cam.y = G.player.y - G.viewH/2;
  clampCam();
}

function findFreeCell(c0, r0){
  for(let d=0; d<14; d++){
    for(let dr=-d; dr<=d; dr++){
      for(let dc=-d; dc<=d; dc++){
        const r = r0+dr, c = c0+dc;
        if(r<2||r>=G.rows-2||c<2||c>=G.cols-2) continue;
        // 要求周围一圈也空，避免卡在缝里
        let ok = true;
        for(let rr=r-1; rr<=r+1 && ok; rr++)
          for(let cc=c-1; cc<=c+1; cc++)
            if(G.world[rr][cc] === 1){ ok = false; break; }
        if(ok) return {c, r};
      }
    }
  }
  return {c: Math.floor(G.cols/2), r: Math.floor(G.rows/2)-5};
}

function solidAt(px, py){
  const c = Math.floor(px / TILE), r = Math.floor(py / TILE);
  if(r<0||r>=G.rows||c<0||c>=G.cols) return true;
  return G.world[r][c] > 0;
}

function hitsWall(x, y, rad){
  for(let a=0; a<8; a++){
    const ang = a * Math.PI/4;
    if(solidAt(x + Math.cos(ang)*rad, y + Math.sin(ang)*rad)) return true;
  }
  return solidAt(x, y);
}

/* ---------- 音效 ---------- */
const Sound = (() => {
  let ac=null, muted=false;
  function ensure(){
    if(!ac){ try{ ac = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
    if(ac && ac.state==='suspended') ac.resume();
  }
  function tone(f,d,type,vol,to){
    if(muted||!ac) return;
    const o=ac.createOscillator(), g=ac.createGain();
    o.type=type||'square';
    o.frequency.setValueAtTime(f, ac.currentTime);
    if(to) o.frequency.exponentialRampToValueAtTime(to, ac.currentTime+d);
    g.gain.setValueAtTime(vol||.06, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, ac.currentTime+d);
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime+d);
  }
  function noise(d,vol,lp){
    if(muted||!ac) return;
    const len=Math.floor(ac.sampleRate*d);
    const buf=ac.createBuffer(1,len,ac.sampleRate);
    const ch=buf.getChannelData(0);
    for(let i=0;i<len;i++) ch[i]=(Math.random()*2-1)*(1-i/len);
    const s=ac.createBufferSource(); s.buffer=buf;
    const f=ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value=lp||900;
    const g=ac.createGain(); g.gain.value=vol||.1;
    s.connect(f); f.connect(g); g.connect(ac.destination);
    s.start();
  }
  return {
    unlock: ensure,
    shoot(){ tone(720,.05,'square',.03,300); },
    hitWall(){ noise(.04,.025,2400); },
    boom(){ noise(.16,.09,700); tone(120,.13,'sawtooth',.045,50); },
    right(){ tone(560,.08,'triangle',.075); setTimeout(()=>tone(820,.1,'triangle',.075),70); },
    wrong(){ tone(200,.1,'sawtooth',.065); setTimeout(()=>tone(140,.16,'sawtooth',.065),90); },
    over(){ [420,360,300,240].forEach((f,i)=>setTimeout(()=>tone(f,.18,'triangle',.08), i*130)); },
    toggle(){ muted=!muted; return muted; },
    isMuted(){ return muted; },
    setMuted(v){ muted = !!v; }
  };
})();

/* ============================================================
   更新
   ============================================================ */
function update(){
  if(G.state !== 'play') return;
  G.t++;
  if(G.shake > 0) G.shake--;
  if(G.zoom > 1) G.zoom = Math.max(1, G.zoom - 0.028);
  if(G.slowT > 0) G.slowT--;
  if(G.rageT > 0) G.rageT--;
  if(G.newTip && G.newTip.t > 0) G.newTip.t--;

  const p = G.player;
  const cfg = DIFFS[G.diff];

  // --- 移动 ---
  const up = keys['w']||keys['arrowup'];
  const dn = keys['s']||keys['arrowdown'];
  const lf = keys['a']||keys['arrowleft'];
  const rt = keys['d']||keys['arrowright'];
  let dx = (rt?1:0) - (lf?1:0);
  let dy = (dn?1:0) - (up?1:0);
  if(dx && dy){ dx *= 0.7071; dy *= 0.7071; }

  if(dx || dy){
    const spdM = 1 + 0.15 * (G.traits.speed || 0);
    const nx = p.x + dx*p.speed*spdM;
    const ny = p.y + dy*p.speed*spdM;
    if(!hitsWall(nx, p.y, p.r)) p.x = nx;
    if(!hitsWall(p.x, ny, p.r)) p.y = ny;
  }
  p.x = Math.max(p.r, Math.min(G.worldW - p.r, p.x));
  p.y = Math.max(p.r, Math.min(G.worldH - p.r, p.y));
  if(p.shield > 0) p.shield--;

  // --- 瞄准：鼠标位置转世界坐标 ---
  const mwx = mouse.x + G.cam.x;
  const mwy = mouse.y + G.cam.y;
  p.angle = Math.atan2(mwy - p.y, mwx - p.x);

  // --- 开火（手动：按住左键/空格；自动：一直射） ---
  if(p.cd > 0) p.cd--;
  const wantFire = G.fireMode === 'auto' || mouse.down || keys[' '];
  if(wantFire && p.cd <= 0){
    fire(p.x + Math.cos(p.angle)*13, p.y + Math.sin(p.angle)*13, p.angle, 'player', p.lv);
    p.cd = (p.lv >= 3 ? 8 : (p.lv >= 2 ? 11 : 15)) * (G.rageT > 0 ? 0.5 : 1) * Math.pow(0.82, G.traits.rapid || 0);
  }

  // --- 敌人 ---
  for(const e of G.enemies){
    if(e.flash > 0) e.flash--;

    // ===== BOSS 专属 =====
    if(e.isBoss){
      const hpRate = e.hp / e.maxHp;
      e.phase = hpRate < 0.33 ? 3 : (hpRate < 0.66 ? 2 : 1);
      e.speed = e.phase === 3 ? 1.15 : (e.phase === 2 ? 0.85 : 0.6);

      const bAng = Math.atan2(p.y - e.y, p.x - e.x);
      e.angle = bAng;
      const bnx = e.x + Math.cos(bAng) * e.speed;
      const bny = e.y + Math.sin(bAng) * e.speed;
      if(!hitsWall(bnx, e.y, e.r)) e.x = bnx;
      if(!hitsWall(e.x, bny, e.r)) e.y = bny;

      // 二阶段起召唤
      e.summonCd--;
      if(e.summonCd <= 0 && e.phase >= 2){
        e.summonCd = 300;
        for(let k=0;k<2;k++) spawnEnemy();
        addFloat(e.x, e.y - 34, '召唤援军', '#c77dff');
      }

      // 扇形弹幕
      e.cd--;
      if(e.cd <= 0){
        e.cd = e.phase === 3 ? 45 : (e.phase === 2 ? 65 : 85);
        const cnt = e.phase === 3 ? 5 : (e.phase === 2 ? 3 : 2);
        for(let k=0;k<cnt;k++){
          const a2 = bAng + (k - (cnt-1)/2) * 0.28;
          fire(e.x, e.y, a2, 'enemy', 2);
        }
      }

      // 撞玩家
      if(p.shield <= 0 && Math.hypot(e.x-p.x, e.y-p.y) < e.r + p.r){
        hurtPlayer(18);
      }
      continue;
    }
    let tx, ty;
    if(e.target === 'base'){ tx = G.base.x; ty = G.base.y; }
    else if(e.target === 'beacon' && G.beacon){ tx = G.beacon.x; ty = G.beacon.y; }
    else { tx = p.x; ty = p.y; }
    const ang = Math.atan2(ty - e.y, tx - e.x);
    e.angle = ang;

    const distT = Math.hypot(tx - e.x, ty - e.y);
    let moveAng = ang;
    let moveSpd = e.speed * (G.slowT > 0 ? 0.45 : 1);

    // 射手/重甲：保持在射程边缘
    if(e.keep > 0){
      if(distT < e.keep * 0.7) moveAng = ang + Math.PI;
      else if(distT < e.keep) moveSpd = 0;
    }

    const nx = e.x + Math.cos(moveAng)*moveSpd;
    const ny = e.y + Math.sin(moveAng)*moveSpd;
    const blockX = hitsWall(nx, e.y, e.r);
    const blockY = hitsWall(e.x, ny, e.r);
    if(!blockX) e.x = nx;
    if(!blockY) e.y = ny;
    e.blocked = (blockX && blockY);

    // 被墙挡住 → 朝墙开火打穿
    if(e.blocked && e.keep === 0 && e.cd <= 0){
      fire(e.x, e.y, ang, 'enemy', 1);
      e.cd = 45;
    }

    // 撞基地
    if(Math.hypot(e.x-G.base.x, e.y-G.base.y) < G.base.r + e.r - 3){
      damage(cfg.baseDmg); e.hp = 0; boom(e.x, e.y, '#ff6b6b'); continue;
    }
    // 冲锋者：靠近就自爆（范围伤害）
    if(e.suicide && Math.hypot(e.x-p.x, e.y-p.y) < e.r + p.r + 6){
      boom(e.x, e.y, '#ff4d6d');
      for(let k=0;k<10;k++){
        const aa = Math.random()*Math.PI*2;
        G.parts.push({x:e.x,y:e.y,vx:Math.cos(aa)*2.5,vy:Math.sin(aa)*2.5,life:18,col:'#ff8fa3',sz:2});
      }
      if(Math.hypot(e.x-p.x, e.y-p.y) < 74 && p.shield <= 0) hurtPlayer(20);
      if(Math.hypot(e.x-G.base.x, e.y-G.base.y) < 74) damage(8);
      e.hp = 0; continue;
    }
    // 撞信标
    if(G.beacon && Math.hypot(e.x-G.beacon.x, e.y-G.beacon.y) < e.r + G.beacon.r){
      G.beacon.hp -= 8;
      boom(e.x, e.y, '#7fd6ff');
      e.hp = 0;
      if(G.beacon.hp <= 0){ G.beacon.hp = 0; beaconDown(); }
      continue;
    }

    // 撞玩家
    if(p.shield <= 0 && Math.hypot(e.x-p.x, e.y-p.y) < e.r + p.r){
      if(G.traits.thorns){
        e.hp -= 3 * G.traits.thorns;
        addFloat(e.x, e.y-16, '-' + (3*G.traits.thorns), '#ff8fa3');
      }
      hurtPlayer(12);
      boom(e.x, e.y, e.hp <= 0 ? '#ff8fa3' : '#ffd166');
      e.hp = 0; continue;
    }

    // 敌人射击
    e.cd--;
    const dist = Math.hypot(e.x-p.x, e.y-p.y);
    if(e.cd <= 0 && dist < 320 && dist > 40){
      fire(e.x, e.y, ang, 'enemy', 1);
      e.cd = e.fireGap;
    }
  }
  G.enemies = G.enemies.filter(e => e.hp > 0);

  // Boss 被击破 → 全场清空
  if(G.boss && G.boss.hp <= 0){
    const bx = G.boss.x, by = G.boss.y;
    G.enemies.forEach(x => { if(x !== G.boss) boom(x.x, x.y, '#ff8f8f'); });
    G.enemies = [];
    G.score += 2000;
    addFloat(bx, by - 40, 'BOSS 击破 +2000', '#ffd166');
    for(let k=0;k<7;k++){
      setTimeout(() => boom(bx + (Math.random()-.5)*90, by + (Math.random()-.5)*90, '#ff5c5c'), k*110);
    }
    G.boss = null;
  }

  // --- 子弹 ---
  for(const b of G.bullets){
    const steps = Math.ceil(b.speed / 4);
    for(let i=0;i<steps && !b.dead;i++){
      b.x += Math.cos(b.a) * (b.speed/steps);
      b.y += Math.sin(b.a) * (b.speed/steps);
      if(b.x<0||b.x>G.worldW||b.y<0||b.y>G.worldH){ b.dead=true; break; }
      const wc = Math.floor(b.x/TILE), wr2 = Math.floor(b.y/TILE);
      if(wr2>=0 && wr2<G.rows && wc>=0 && wc<G.cols && G.world[wr2][wc] > 0){
        if(b.bounce > 0){
          b.bounce--;
          const px = b.x - Math.cos(b.a)*8;
          const py = b.y - Math.sin(b.a)*8;
          if(solidAt(px, b.y)) b.a = Math.PI - b.a;
          else if(solidAt(b.x, py)) b.a = -b.a;
          else b.a = Math.PI - b.a;
          b.x = px; b.y = py;
          spark(b.x, b.y);
          break;
        }
        G.world[wr2][wc]--;
        b.dead = true;
        spark(b.x, b.y);
        break;
      }

      if(b.owner === 'player'){
        for(const e of G.enemies){
          if(e.hp<=0) continue;
          if(Math.hypot(b.x-e.x, b.y-e.y) < e.r+3){
            const crit = Math.random() < (b.crit||0) * 0.12;
            e.hp -= crit ? 2 : 1;
            e.flash = 5;
            if(crit) addFloat(e.x, e.y-e.r-10, '×2', '#ffe066');
            if(e.hp<=0){
              boom(e.x,e.y,'#ff8f8f'); G.killed++; G.score+=120;
              if(G.traits.steal && p.hp < p.maxHp){
                p.hp = Math.min(p.maxHp, p.hp + 2*G.traits.steal);
                addFloat(p.x, p.y-32, '+'+(2*G.traits.steal), '#ff6b8a');
              }
            } else spark(b.x,b.y);
            if(b.pierce > 0) b.pierce--;
            else b.dead = true;
            break;
          }
        }
      } else {
        if(G.beacon && Math.hypot(b.x-G.beacon.x, b.y-G.beacon.y) < G.beacon.r + 3){
          G.beacon.hp -= 4; b.dead = true; boom(b.x, b.y, '#7fd6ff');
          if(G.beacon.hp <= 0){ G.beacon.hp = 0; beaconDown(); }
        }
        else if(p.shield<=0 && Math.hypot(b.x-p.x, b.y-p.y) < p.r+3){
          hurtPlayer(7); b.dead=true; boom(b.x,b.y,'#ffd166');
        }
      }
    }
  }
  G.bullets = G.bullets.filter(b => !b.dead);

  // --- 粒子 ---
  for(const q of G.parts){ q.x+=q.vx; q.y+=q.vy; q.vx*=.94; q.vy*=.94; q.life--; }
  G.parts = G.parts.filter(q => q.life>0);

  // --- 飘字 ---
  for(const f of G.floats){ f.y -= 0.55; f.life--; }
  G.floats = G.floats.filter(f => f.life > 0);

  // 信标绕基地巡逻
  if(G.goal === 'escort' && G.beacon){
    G.beacon.angle += G.beacon.speed;
    const bx = G.base.x + Math.cos(G.beacon.angle) * G.beacon.orbitR;
    const by = G.base.y + Math.sin(G.beacon.angle) * G.beacon.orbitR;
    if(!hitsWall(bx, by, G.beacon.r)){ G.beacon.x = bx; G.beacon.y = by; }
  }

  // --- 目标推进 ---
  if(G.goal === 'survive'){
    if(G.state === 'play'){
      G.surviveLeft--;
      if(G.surviveLeft <= 0){
        victory();
      } else {
        if(G.t % 80 === 0 && G.enemies.length < 6) spawnEnemy();
        if(G.t % 8 === 0) updateWaveUI();
        if(G.t % 60 === 0) checkSettle();
      }
    }
  } else {
    updateWaves();
  }

  // --- 镜头 ---
  const camTX = p.x - G.viewW/(2*G.zoom);
  const camTY = p.y - G.viewH/(2*G.zoom);
  G.cam.x += (camTX - G.cam.x) * 0.14;
  G.cam.y += (camTY - G.cam.y) * 0.14;
  clampCam();

  // --- 特性：再生 ---
  if(G.traits.regen){
    G.regenCd = (G.regenCd||0) + 1;
    if(G.regenCd >= 90){
      G.regenCd = 0;
      if(p.hp < p.maxHp) p.hp = Math.min(p.maxHp, p.hp + 1);
    }
  }

  // --- 特性：环绕光球 ---
  if(G.traits.orbit){
    G.orbitA += 0.048;
    const cnt = G.traits.orbit;
    for(let i=0;i<cnt;i++){
      const a = G.orbitA + i*Math.PI*2/cnt;
      const ox = p.x + Math.cos(a)*46;
      const oy = p.y + Math.sin(a)*46;
      for(const e of G.enemies){
        if(e.hp <= 0) continue;
        if(Math.hypot(e.x-ox, e.y-oy) < e.r + 7){
          if(!e._orbT || G.t - e._orbT > 30){
            e._orbT = G.t;
            e.hp -= 1;
            spark(ox, oy);
          }
        }
      }
    }
  }

  // --- 特性：电弧 ---
  if(G.traits.chain){
    G.chainCd = (G.chainCd||0) + 1;
    if(G.chainCd >= 180){
      G.chainCd = 0;
      let best = null, bd = 400;
      for(const e of G.enemies){
        const d = Math.hypot(e.x-p.x, e.y-p.y);
        if(d < bd){ bd = d; best = e; }
      }
      if(best){
        best.hp -= 2 * G.traits.chain;
        G.arc = {x1:p.x, y1:p.y, x2:best.x, y2:best.y, life:14};
        Sound.hitWall();
      }
    }
  }
  if(G.arc){ G.arc.life--; if(G.arc.life <= 0) G.arc = null; }

  updateHud();
}

function clampCam(){
  const vw = G.viewW / G.zoom, vh = G.viewH / G.zoom;
  if(G.worldW <= vw) G.cam.x = (G.worldW - vw) / 2;
  else G.cam.x = Math.max(0, Math.min(G.worldW - vw, G.cam.x));
  if(G.worldH <= vh) G.cam.y = (G.worldH - vh) / 2;
  else G.cam.y = Math.max(0, Math.min(G.worldH - vh, G.cam.y));
}

function fire(x, y, ang, owner, lv){
  if(owner === 'player'){
    const T = G.traits;
    const count = 1 + Math.min(4, T.multi || 0);
    const spread = 0.19;
    const start = ang - (count-1)*spread/2;
    if(G.bullets.length > 110) return;
    for(let i=0;i<count;i++){
      G.bullets.push({
        x, y, a: start + i*spread,
        speed: (lv>=2?8:6.5),
        owner, dead:false,
        pierce: T.pierce || 0,
        bounce: T.bounce || 0,
        crit: T.crit || 0
      });
    }
    Sound.shoot();
    return;
  }
  G.bullets.push({x, y, a:ang, speed:4.2, owner, dead:false, pierce:0, bounce:0, crit:0});
}

function pickType(){
  const cfg = levelCfg(G.level);
  const pool = cfg.types;
  return pool[Math.floor(Math.random()*pool.length)];
}

function updateWaves(){
  const cfg = DIFFS[G.diff];

  if(G.waveState === 'gap'){
    G.waveTimer--;
    if(G.waveTimer <= 0) startWave();
    if(G.t % 8 === 0) updateWaveUI();
    return;
  }

  if(G.waveState === 'fight'){
    G.spawnCd--;
    if(G.waveLeft > 0 && G.spawnCd <= 0){
      spawnEnemy();
      G.waveLeft--;
      G.spawnCd = Math.round(cfg.gap[0] * 0.5);
    }
    if(G.waveLeft === 0 && G.enemies.length === 0){
      if(G.wave >= G.totalWaves){
        victory();
      } else {
        G.waveState = 'gap';
        G.waveTimer = G.waveGap;
        checkSettle();
      }
    }
    if(G.t % 8 === 0) updateWaveUI();
  }
}

function updateWaveUI(){
  const el = document.getElementById('wavebar');
  if(!el) return;

  if(G.goal === 'escort' && G.beacon){
    el.className = 'wavebar on';
    el.innerHTML = '护送信标 <b>' + Math.round(G.beacon.hp) + '</b>%　' +
                   '第 <b>' + G.wave + '</b> / ' + G.totalWaves + ' 波' +
                   '<span class="go">别让它被打到</span>';
    return;
  }

  if(G.goal === 'survive'){
    const sec = Math.ceil(Math.max(0, G.surviveLeft) / 60);
    el.className = 'wavebar on';
    el.innerHTML = '生存 <b>' + sec + '</b> 秒　·　场上 <b>' + G.enemies.length + '</b> 个' +
                   '<span class="go">撑住就行</span>';
    return;
  }

  if(G.newTip && G.newTip.t > 0){
    el.className = 'wavebar on tip';
    el.innerHTML = '⚠ 新敌人出现：<b style="color:' + G.newTip.col + '">' + G.newTip.name + '</b>';
    return;
  }

  if(G.waveState === 'gap'){
    const sec = Math.ceil(G.waveTimer / 60);
    el.className = 'wavebar on';
    el.innerHTML = '第 ' + (G.wave + 1) + ' / ' + G.totalWaves + ' 波　<b>' + sec + '</b>秒' +
                   '<span class="go">点击提前</span>';
  } else if(G.waveState === 'fight'){
    const left = G.waveLeft + G.enemies.length;
    el.className = 'wavebar on';
    el.innerHTML = '第 ' + G.wave + ' / ' + G.totalWaves + ' 波　剩余 <b>' + left + '</b> 个';
  } else {
    el.className = 'wavebar';
  }
}

function checkSettle(){
  if(G.settled) return;
  const total = G.okN + G.noN;
  if(total < 6) return;
  const rate = G.okN / total;
  const need = G.diff === 'easy' ? 0.6 : (G.diff === 'normal' ? 0.7 : 0.8);
  if(rate < need) return;

  if(G.goal === 'survive'){
    if(G.surviveLeft < G.surviveTotal * 0.5){
      G.settled = true;
      showSettle(false);
    }
  } else if(G.wave >= Math.ceil(G.totalWaves * 0.5)){
    G.settled = true;
    showSettle(false);
  }
}

function beaconDown(){
  G.state = 'over';
  Sound.over();
  const m = document.getElementById('menu');
  m.classList.remove('off');
  m.innerHTML =
    '<h1 style="color:#ff6b6b;text-shadow:0 0 26px rgba(255,107,107,.5)">信 标 被 毁</h1>' +
    '<div class="hint">护送失败<br>得分 <b style="color:#ffd166">' + G.score + '</b>　' +
    '答对 <b style="color:#5fe08a">' + G.okN + '</b></div>' +
    '<div style="display:flex;gap:10px;margin-top:6px">' +
      '<button class="btn-start" id="retryBtn">再试一次</button>' +
      '<button class="btn-start" id="hubBtn3" style="background:#1a2e24;color:#7fa894">回主界面</button>' +
    '</div>';
  document.getElementById('retryBtn').onclick = () => {
    m.innerHTML = ''; m.classList.add('off'); startGame();
  };
  document.getElementById('hubBtn3').onclick = () => { location.href = 'hub.html'; };
}

function victory(){
  G.state = 'win';
  Sound.right();
  showSettle(true);
}

function showSettle(final){
  G.state = final ? 'win' : 'settle';
  const m = document.getElementById('menu');
  m.classList.remove('off');
  const total = G.okN + G.noN;
  const rateRaw = total ? G.okN / total : 0;
  const rate = Math.round(rateRaw * 100);
  const stars = calcStars(rateRaw);
  saveProgress(G.level, stars, rateRaw, G.score);

  const starHtml = [0,1,2].map(i =>
    '<span style="opacity:' + (i < stars ? 1 : .16) + '">★</span>'
  ).join('');

  const card = grantCard(G.chapter, G.level);
  const cardHtml = card
    ? '<div style="margin:14px auto 4px;max-width:340px;padding:12px 14px;text-align:left;' +
      'background:rgba(255,209,102,.07);border:1px solid rgba(255,209,102,.35);border-radius:4px">' +
        '<div style="font-size:9.5px;color:#8a7a4a;letter-spacing:.18em;margin-bottom:6px">知识点碎片 · 已收集</div>' +
        '<div style="font-size:13px;color:#ffd166;margin-bottom:6px">' + card.title + '</div>' +
        '<div style="font-size:11px;color:#a8bfae;line-height:1.85">' + card.body + '</div>' +
        '<div style="font-size:9.5px;color:#5d7f6e;margin-top:6px">来源 · ' + card.src + ' 线性表</div>' +
      '</div>'
    : '';

  m.innerHTML =
    '<h1 style="color:' + (final ? '#5fe08a' : '#7fd6ff') + '">' +
      (final ? '关 卡 完 成' : '可 以 结 算') + '</h1>' +
    '<div class="hint">' +
      '第 ' + G.level + ' 关 · ' + (G.goal === 'survive' ? '生存关' : (G.goal === 'escort' ? '护送关' : ('第 ' + G.wave + ' / ' + G.totalWaves + ' 波'))) + '<br>' +
      '<div style="font-size:30px;letter-spacing:6px;color:#ffd166;margin-bottom:8px">' + starHtml + '</div>' +
      '答对 <b style="color:#5fe08a">' + G.okN + '</b> / ' + total + '（' + rate + '%）' +
      '　得分 <b style="color:#ffd166">' + G.score + '</b>' +
    '</div>' +
    cardHtml +
    '<div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;justify-content:center">' +
      '<button class="btn-start" id="endBtn">' + (G.level >= 10 ? '完成本章' : '下一关') + '</button>' +
      '<button class="btn-start" id="contBtn" style="background:#22402f;color:#a8dcc0">继续挑战</button>' +
      '<button class="btn-start" id="hubBtn" style="background:#1a2e24;color:#7fa894">回主界面</button>' +
    '</div>';

  document.getElementById('endBtn').onclick = () => {
    if(G.level >= 10){ location.href = 'hub.html?subject=ds&chapter=' + G.chapter; return; }
    m.innerHTML = ''; m.classList.add('off');
    G.state = 'play';
    startLevel(G.level + 1);
  };
  document.getElementById('hubBtn').onclick = () => { location.href = 'hub.html'; };
  document.getElementById('contBtn').onclick = () => {
    m.innerHTML = ''; m.classList.add('off');
    G.state = 'play';
    if(G.waveState === 'gap') G.waveTimer = 180;
  };
}

function startLevel(lv){
  if(lv > 10){ lv = 10; }
  const cfg = levelCfg(lv);
  G.level = lv;
  G.totalWaves = cfg.waves || 0;
  G.goal = cfg.goal || 'clear';
  G.surviveTotal = cfg.survive || 0;
  G.surviveLeft = G.surviveTotal;

  G.beacon = (G.goal === 'escort') ? {
    x: G.base.x + 90, y: G.base.y,
    r: 10, hp: 100, maxHp: 100,
    angle: 0, orbitR: 90, speed: 0.005
  } : null;
  G.wave = 0;
  G.waveState = 'gap';
  G.waveTimer = 240;
  G.waveGap = 480;
  G.waveLeft = 0;
  G.waveBonus = 1;
  G.settled = false;
  G.enemies = []; G.bullets = []; G.parts = []; G.floats = [];
  G.traits = {}; G.orbitA = 0; G.chainCd = 0; G.regenCd = 0; G.arc = null;
  G.zoom = 1;

  // 按本关模板重新生成地图（会重建 player）
  genWorld();
  G.player.hp = G.player.maxHp;
  G.player.shield = 120;

  G.newTip = cfg.newEnemy
    ? {name: ETYPES[cfg.newEnemy].name, col: ETYPES[cfg.newEnemy].col, t: 200}
    : null;

  buildQuestionPool();
  updateTraitsUI();
  updateHud();
  updateWaveUI();
}

function startWave(){
  G.wave++;
  G.waveState = 'fight';
  const md = levelCfg(G.level).mods || [];
  G.elitePending = md.indexOf('elite') >= 0 ? 1 : 0;

  // Boss 关：最后一波召唤 Boss
  const lc = levelCfg(G.level);
  if(lc.boss && G.wave === G.totalWaves){
    G.waveLeft = 2;             // 只带两个小怪
    setTimeout(() => spawnBoss(), 400);
  }
  const base = 3 + Math.floor(G.wave * 0.9) + Math.floor(G.level * 0.4);
  G.waveLeft = Math.max(2, Math.round(base * (G.waveBonus || 1)));
  G.spawnCd = 0;
  G.waveBonus = 1;
  updateWaveUI();
}

function spawnBoss(){
  if(!G.player) return;
  const p = G.player;
  const ang = Math.random() * Math.PI * 2;
  const dist = 300;
  let x = p.x + Math.cos(ang) * dist;
  let y = p.y + Math.sin(ang) * dist;
  x = Math.max(TILE*3, Math.min(G.worldW - TILE*3, x));
  y = Math.max(TILE*3, Math.min(G.worldH - TILE*3, y));

  const boss = {
    x, y, r: 22,
    hp: 30, maxHp: 30,
    speed: 0.6, angle: 0,
    phase: 1, cd: 70, summonCd: 200,
    flash: 0, isBoss: true,
    type: 'boss', keep: 0, target: 'player'
  };
  G.boss = boss;
  G.enemies.push(boss);
  addFloat(G.viewW/2, 80, 'BOSS 出现', '#ff5c5c');
}

function spawnEnemy(){
  const p = G.player;
  const cfg = DIFFS[G.diff];
  const stage = threatLevel();
  const type = pickType(stage);
  const T = ETYPES[type];

  for(let tries=0; tries<30; tries++){
    const ang = Math.random()*Math.PI*2;
    const dist = 380 + Math.random()*150;
    const x = p.x + Math.cos(ang)*dist;
    const y = p.y + Math.sin(ang)*dist;
    if(x < TILE*2 || x > G.worldW-TILE*2) continue;
    if(y < TILE*2 || y > G.worldH-TILE*2) continue;
    if(hitsWall(x, y, 10)) continue;

    const mods = levelCfg(G.level).mods || [];
    let hp = T.hp + cfg.hpAdd;
    let spd = T.spd * cfg.spd;
    let fg = cfg.fireGap + Math.round(Math.random()*30);

    if(mods.indexOf('rush') >= 0) spd *= 1.3;
    if(mods.indexOf('iron') >= 0) hp += 1;
    if(mods.indexOf('frenzy') >= 0) fg = Math.round(fg * 0.67);

    let elite = false;
    if(G.elitePending > 0){
      G.elitePending--;
      elite = true;
      hp = Math.round(hp * 2);
      spd *= 0.92;
    }

    G.enemies.push({
      x, y, type,
      r: elite ? T.r + 3 : T.r, angle: 0,
      speed: spd,
      hp, maxHp: hp,
      elit: elite, flash: 0,
      target: (G.goal === 'escort' && Math.random() < 0.55) ? 'beacon'
              : (type === 'charger' ? 'player' : (Math.random() < 0.6 ? 'player' : 'base')),
      keep: T.keep || 0,
      suicide: !!T.suicide,
      cd: 40 + Math.random()*60,
      fireGap: fg
    });
    return;
  }
}

function hurtPlayer(n){
  const p = G.player;
  if(!p || p.shield > 0) return;
  p.hp -= n;
  if(p.hp <= 0){
    p.hp = 0;
    boom(p.x, p.y, '#7fd6ff');
    addFloat(p.x, p.y - 30, '阵亡 · 基地 -18', '#ff6b6b');
    G.base.hp -= 18;
    p.hp = p.maxHp;
    p.shield = 200;
    p.x = G.base.x - 46;
    p.y = G.base.y;
    if(G.base.hp <= 0){ G.base.hp = 0; gameOver(); }
  } else {
    addFloat(p.x, p.y - 26, '-' + n, '#ff8f8f');
  }
}

function damage(n){
  G.base.hp -= n;
  G.zoom = 1.22;
  if(G.base.hp <= 0){ G.base.hp = 0; gameOver(); }
}

function spark(x,y){
  for(let i=0;i<2;i++)
    G.parts.push({x,y,vx:(Math.random()-.5)*2,vy:(Math.random()-.5)*2,life:7,col:'#ffd166',sz:1.5});
  Sound.hitWall();
}
function boom(x,y,col){
  for(let i=0;i<12;i++){
    const a=Math.random()*Math.PI*2, s=1+Math.random()*2.4;
    G.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:14+Math.random()*8,col,sz:1.6+Math.random()*2});
  }
  Sound.boom();
}

/* ============================================================
   渲染
   ============================================================ */
function render(){
  const vw = G.viewW, vh = G.viewH;
  ctx.fillStyle = '#040a07';
  ctx.fillRect(0,0,vw,vh);

  ctx.save();

  const zoom = G.zoom, camX = G.cam.x, camY = G.cam.y;
  ctx.save();
  ctx.scale(zoom, zoom);
  ctx.translate(-camX, -camY);

  const viewL = camX, viewT = camY;
  const viewR = camX + vw/zoom, viewB = camY + vh/zoom;

  const c0 = Math.max(0, Math.floor(viewL/TILE)), c1 = Math.min(G.cols, Math.ceil(viewR/TILE)+1);
  const r0 = Math.max(0, Math.floor(viewT/TILE)), r1 = Math.min(G.rows, Math.ceil(viewB/TILE)+1);

  // 网格
  ctx.strokeStyle = 'rgba(60,150,110,.07)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for(let c=c0;c<=c1;c++){ ctx.moveTo(c*TILE, r0*TILE); ctx.lineTo(c*TILE, r1*TILE); }
  for(let r=r0;r<=r1;r++){ ctx.moveTo(c0*TILE, r*TILE); ctx.lineTo(c1*TILE, r*TILE); }
  ctx.stroke();

  // 墙
  for(let r=r0;r<r1;r++){
    for(let c=c0;c<c1;c++){
      if(G.world[r][c] <= 0) continue;
      const hpw = G.world[r][c];
      if(hpw <= 0) continue;
      const x = c*TILE, y = r*TILE;
      const pad = 2.5;
      ctx.fillStyle = hpw >= 2 ? 'rgba(22,52,40,.74)' : 'rgba(46,32,22,.8)';
      ctx.fillRect(x+pad, y+pad, TILE-pad*2, TILE-pad*2);
      ctx.strokeStyle = hpw >= 2 ? 'rgba(90,200,145,.26)' : 'rgba(210,140,80,.42)';
      ctx.lineWidth = 1;
      ctx.strokeRect(x+pad+.5, y+pad+.5, TILE-pad*2-1, TILE-pad*2-1);
      ctx.fillStyle = hpw >= 2 ? 'rgba(120,230,170,.05)' : 'rgba(255,180,110,.12)';
      ctx.fillRect(x+pad+1, y+pad+1, TILE-pad*2-2, 2);
      if(hpw < 2){
        ctx.strokeStyle = 'rgba(220,150,90,.45)';
        ctx.beginPath();
        ctx.moveTo(x+pad+5, y+pad+4); ctx.lineTo(x+TILE-pad-6, y+TILE-pad-5);
        ctx.moveTo(x+TILE-pad-7, y+pad+5); ctx.lineTo(x+pad+6, y+TILE-pad-4);
        ctx.stroke();
      }
    }
  }

  // 基地
  const b = G.base;
  const pulse = 1 + Math.sin(G.t*0.06) * 0.04;
  const hpRate = b.hp / b.maxHp;
  ctx.save();
  ctx.translate(b.x, b.y);
  ctx.strokeStyle = 'rgba(255,214,102,.22)';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(0,0,b.r*1.6*pulse,0,Math.PI*2); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,214,102,.11)';
  ctx.beginPath(); ctx.arc(0,0,b.r*2.15*pulse,0,Math.PI*2); ctx.stroke();
  ctx.fillStyle = hpRate > .5 ? 'rgba(255,214,102,.15)' : 'rgba(255,120,90,.18)';
  ctx.beginPath(); ctx.arc(0,0,b.r,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle = hpRate > .5 ? 'rgba(255,214,102,.85)' : 'rgba(255,120,90,.9)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0,0,b.r,0,Math.PI*2); ctx.stroke();
  ctx.fillStyle = hpRate > .5 ? 'rgba(255,232,160,.9)' : 'rgba(255,150,120,.9)';
  ctx.beginPath(); ctx.arc(0,0,5,0,Math.PI*2); ctx.fill();
  ctx.restore();

  // 护送信标
  if(G.beacon && G.beacon.hp > 0){
    const b = G.beacon;
    const pl = 1 + Math.sin(G.t * 0.1) * 0.08;
    ctx.strokeStyle = 'rgba(127,214,255,.35)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 1.9 * pl, 0, Math.PI*2); ctx.stroke();
    ctx.strokeStyle = 'rgba(127,214,255,.15)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 2.6 * pl, 0, Math.PI*2); ctx.stroke();

    ctx.fillStyle = b.hp > 50 ? 'rgba(127,214,255,.9)' : 'rgba(255,120,120,.9)';
    ctx.beginPath();
    ctx.moveTo(b.x, b.y - b.r); ctx.lineTo(b.x + b.r, b.y);
    ctx.lineTo(b.x, b.y + b.r); ctx.lineTo(b.x - b.r, b.y);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(210,245,255,.8)';
    ctx.lineWidth = 1; ctx.stroke();

    ctx.fillStyle = 'rgba(0,0,0,.55)';
    ctx.fillRect(b.x - 12, b.y - b.r - 11, 24, 3);
    ctx.fillStyle = b.hp > 50 ? '#5fe08a' : '#ff6b6b';
    ctx.fillRect(b.x - 12, b.y - b.r - 11, 24 * (b.hp / b.maxHp), 3);
  }

  // 敌人
  for(const e of G.enemies){
    // BOSS 单独画
    if(e.isBoss){
      const pulse = 1 + Math.sin(G.t*0.09) * 0.06;
      ctx.strokeStyle = 'rgba(255,92,92,.3)';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r*1.6*pulse, 0, Math.PI*2); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,92,92,.15)';
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r*2.2*pulse, 0, Math.PI*2); ctx.stroke();

      ctx.beginPath();
      for(let i=0;i<6;i++){
        const a = i/6*Math.PI*2 - Math.PI/2 + G.t*0.008;
        ctx.lineTo(e.x + Math.cos(a)*e.r, e.y + Math.sin(a)*e.r);
      }
      ctx.closePath();
      ctx.fillStyle = e.flash > 0 ? '#ffffff'
        : (e.phase === 3 ? '#ff3b3b' : (e.phase === 2 ? '#e060a0' : '#c77dff'));
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,210,210,.75)';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.fillStyle = 'rgba(0,0,0,.45)';
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r*0.42, 0, Math.PI*2); ctx.fill();
      continue;
    }

    const T = ETYPES[e.type] || ETYPES.drone;
    const col = e.flash > 0 ? '#ffffff' : T.col;
    const R = e.r;

    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.fillStyle = col;
    ctx.strokeStyle = 'rgba(255,200,200,.55)';
    ctx.lineWidth = 1;

    if(e.type === 'tank'){
      ctx.beginPath();
      for(let i=0;i<6;i++){
        const a = i/6*Math.PI*2 - Math.PI/2;
        ctx.lineTo(Math.cos(a)*R, Math.sin(a)*R);
      }
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.arc(0,0,R*0.35,0,Math.PI*2);
      ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fill();
    } else if(e.type === 'charger'){
      ctx.rotate(e.angle);
      ctx.beginPath();
      ctx.moveTo(R+5,0); ctx.lineTo(-R*0.75, R*0.8); ctx.lineTo(-R*0.75, -R*0.8);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    } else if(e.type === 'shooter'){
      ctx.beginPath();
      ctx.moveTo(R,0); ctx.lineTo(0,R); ctx.lineTo(-R,0); ctx.lineTo(0,-R);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.arc(0,0,R+3.5,0,Math.PI*2);
      ctx.strokeStyle = 'rgba(255,200,150,.35)'; ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.moveTo(R,0); ctx.lineTo(0,R); ctx.lineTo(-R,0); ctx.lineTo(0,-R);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    }
    ctx.restore();

    if(e.elit){
      ctx.strokeStyle = 'rgba(199,125,255,.65)';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 5, 0, Math.PI*2); ctx.stroke();
    }

    if(e.maxHp > 1){
      ctx.fillStyle = 'rgba(0,0,0,.55)';
      ctx.fillRect(e.x-11, e.y-e.r-8, 22, 3);
      ctx.fillStyle = T.col;
      ctx.fillRect(e.x-11, e.y-e.r-8, 22*(e.hp/e.maxHp), 3);
    }
  }

  // 玩家
  const p = G.player;
  if(p){
    ctx.save();
    ctx.translate(p.x, p.y);
    if(p.shield > 0){
      ctx.strokeStyle = 'rgba(127,214,255,' + (0.3 + Math.sin(G.t*0.25)*0.18) + ')';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(0,0,p.r+5,0,Math.PI*2); ctx.stroke();
    }
    ctx.rotate(p.angle);
    ctx.fillStyle = 'rgba(127,214,255,.8)';
    ctx.fillRect(4, -2, 14, 4);
    ctx.fillStyle = '#7fd6ff';
    ctx.beginPath();
    ctx.moveTo(10,0); ctx.lineTo(-7,7); ctx.lineTo(-4,0); ctx.lineTo(-7,-7);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(200,245,255,.85)';
    ctx.lineWidth = 1; ctx.stroke();
    ctx.restore();
  }

  // 环绕光球
  if(p && G.traits.orbit){
    const cnt = G.traits.orbit;
    for(let i=0;i<cnt;i++){
      const a = G.orbitA + i*Math.PI*2/cnt;
      const ox = p.x + Math.cos(a)*46;
      const oy = p.y + Math.sin(a)*46;
      ctx.fillStyle = 'rgba(199,125,255,.9)';
      ctx.beginPath(); ctx.arc(ox, oy, 5, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = 'rgba(225,190,255,.55)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(ox, oy, 8.5, 0, Math.PI*2); ctx.stroke();
    }
  }

  // 电弧
  if(G.arc){
    const al = Math.max(0, G.arc.life/14);
    ctx.strokeStyle = 'rgba(127,214,255,' + al + ')';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(G.arc.x1, G.arc.y1);
    const mx = (G.arc.x1+G.arc.x2)/2 + (Math.random()-.5)*28;
    const my = (G.arc.y1+G.arc.y2)/2 + (Math.random()-.5)*28;
    ctx.lineTo(mx, my);
    ctx.lineTo(G.arc.x2, G.arc.y2);
    ctx.stroke();
  }

  // 子弹
  for(const b of G.bullets){
    ctx.strokeStyle = b.owner==='player' ? 'rgba(168,230,255,.3)' : 'rgba(255,154,154,.28)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(b.x, b.y);
    ctx.lineTo(b.x - Math.cos(b.a)*7, b.y - Math.sin(b.a)*7);
    ctx.stroke();
    ctx.fillStyle = b.owner==='player' ? '#a8e6ff' : '#ff9a9a';
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.owner==='player'?2.6:2.2, 0, Math.PI*2);
    ctx.fill();
  }

  // 粒子
  for(const q of G.parts){
    ctx.globalAlpha = Math.min(1, q.life/10);
    ctx.fillStyle = q.col;
    ctx.fillRect(q.x, q.y, q.sz, q.sz);
    ctx.globalAlpha = 1;
  }

  // 飘字
  ctx.textAlign = 'center';
  ctx.font = '600 11px "Cascadia Code", Consolas, monospace';
  for(const f of G.floats){
    ctx.globalAlpha = Math.min(1, f.life / 30);
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'left';

  ctx.restore();   // 世界变换结束

  // Boss 血条
  if(G.boss && G.boss.hp > 0){
    const bw = G.viewW * 0.46;
    const bx = (G.viewW - bw) / 2;
    const by = 96;
    ctx.fillStyle = 'rgba(0,0,0,.65)';
    ctx.fillRect(bx - 1, by - 1, bw + 2, 9);
    ctx.fillStyle = '#ff3b3b';
    ctx.fillRect(bx, by, bw * (G.boss.hp / G.boss.maxHp), 7);
    ctx.strokeStyle = 'rgba(255,120,120,.7)';
    ctx.lineWidth = 1;
    ctx.strokeRect(bx + .5, by + .5, bw - 1, 6);
    ctx.fillStyle = '#ffb0b0';
    ctx.font = '10px "Cascadia Code", Consolas, monospace';
    ctx.textAlign = 'center';
    ctx.fillText('重 甲 统 领　' + G.boss.hp + ' / ' + G.boss.maxHp, G.viewW/2, by - 5);
    ctx.textAlign = 'left';
  }

  drawMinimap();
  ctx.restore();
}

function drawMinimap(){
  const mw = 104, mh = Math.round(mw * (G.rows/G.cols));
  const mx = G.viewW - mw - 10, my = G.viewH - mh - 10;

  ctx.save();
  ctx.fillStyle = 'rgba(3,10,7,.8)';
  ctx.fillRect(mx, my, mw, mh);
  ctx.strokeStyle = 'rgba(90,200,145,.28)';
  ctx.lineWidth = 1;
  ctx.strokeRect(mx+.5, my+.5, mw-1, mh-1);

  const sx = mw / G.worldW, sy = mh / G.worldH;

  ctx.fillStyle = 'rgba(90,200,145,.2)';
  for(let r=0;r<G.rows;r+=2)
    for(let c=0;c<G.cols;c+=2)
      if(G.world[r][c]>0) ctx.fillRect(mx + c*TILE*sx, my + r*TILE*sy, 1.6, 1.6);

  ctx.fillStyle = 'rgba(255,214,102,.9)';
  ctx.fillRect(mx + G.base.x*sx - 1.5, my + G.base.y*sy - 1.5, 3, 3);

  ctx.fillStyle = 'rgba(255,107,107,.85)';
  for(const e of G.enemies) ctx.fillRect(mx + e.x*sx - 1, my + e.y*sy - 1, 2, 2);

  ctx.fillStyle = '#7fd6ff';
  ctx.beginPath();
  ctx.arc(mx + G.player.x*sx, my + G.player.y*sy, 2.2, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}

/* ============================================================
   主循环
   ============================================================ */
let last = 0, acc = 0;
function loop(ts){
  if(!last) last = ts;
  let dt = ts - last; last = ts;
  if(dt > 120) dt = 120;
  acc += dt;
  let guard = 0;
  while(acc >= 16.667 && guard < 4){ update(); acc -= 16.667; guard++; }
  if(G.player && G.state !== 'menu') render();
  requestAnimationFrame(loop);
}

/* ============================================================
   HUD
   ============================================================ */
function updateHud(){
  const rate = G.base.hp / G.base.maxHp * 100;
  document.getElementById('hpBar').style.width = rate + '%';
  const meRate = G.player ? (G.player.hp / G.player.maxHp * 100) : 100;
  document.getElementById('meBar').style.width = meRate + '%';
  document.getElementById('meTxt').textContent = G.player ? Math.round(G.player.hp) : 100;
  document.getElementById('hpTxt').textContent = Math.round(G.base.hp);
  document.getElementById('lvTxt').textContent = 'Lv' + (G.player ? G.player.lv : 1);
  document.getElementById('threatTxt').textContent = threatLevel();
  document.getElementById('enemyTxt').textContent = G.enemies.length;
  document.getElementById('streakTxt').textContent = G.streak;
  document.getElementById('okN').textContent = G.okN;
  document.getElementById('noN').textContent = G.noN;
  document.getElementById('scoreN').textContent = G.score;
  document.getElementById('streakBox').textContent = '连对 ' + G.streak;

  const mb = document.getElementById('modsBox');
  if(mb){
    const md = levelCfg(G.level).mods || [];
    mb.innerHTML = md.map(k => {
      const m = MODS[k];
      if(!m) return '';
      return '<span style="color:' + m.col + ';margin-right:6px" title="' + m.desc + '">' +
             m.icon + ' ' + m.name + '</span>';
    }).join('');
  }
}

function threatLevel(){
  return Math.min(10, 1 + Math.floor(G.t / 1080));
}

/* ============================================================
   答题
   ============================================================ */
let qIdx = 0, qLocked = true, wrongList = [];

function buildQuestionPool(){
  const cfg = levelCfg(G.level);
  let tags = cfg.bank || null;
  if(typeof tags === 'string') tags = [tags];

  let pool = BANK.map((_, i) => i);
  if(tags){
    const filtered = pool.filter(i => tags.indexOf(BANK[i].tag) >= 0);
    if(filtered.length >= 5) pool = filtered;
  }

  if(G.qOrder === 'seq'){
    pool.sort((a,b) => a-b);
  } else {
    for(let i=pool.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      const t = pool[i]; pool[i] = pool[j]; pool[j] = t;
    }
  }
  G.qPool = pool;
  qIdx = 0;
}

function nextQuestion(){
  qLocked = false;
  if(!G.qPool.length) buildQuestionPool();
  const qi = G.qPool[qIdx % G.qPool.length];
  const q = BANK[qi];
  G.curQ = q;

  // 本题的奖励预告
  G.pendReward = pickReward();
  const tag = document.getElementById('rewardTag');
  if(tag && G.pendReward){
    tag.textContent = '答对 ' + G.pendReward.name;
    tag.style.color = G.pendReward.col;
    tag.style.borderColor = G.pendReward.col;
  }

  document.getElementById('qno').textContent = '第 ' + (qIdx+1) + ' 题';
  document.getElementById('qtext').innerHTML = q.q;
  document.getElementById('why').className = 'why';
  const box = document.getElementById('opts');
  box.innerHTML = '';
  q.o.forEach((txt, i) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = '<span class="k">' + (i+1) + '</span><span>' + txt + '</span>';
    b.onclick = (ev) => { ev.stopPropagation(); answer(i); };
    box.appendChild(b);
  });
  qIdx++;
}

function answer(pick){
  if(qLocked || G.state !== 'play') return;
  qLocked = true;
  const q = G.curQ;
  const btns = [...document.querySelectorAll('.opt')];
  btns.forEach(b => b.disabled = true);

  const right = pick === q.a;
  if(right) btns[pick].classList.add('right');
  else { btns[pick].classList.add('wrong'); btns[q.a].classList.add('miss'); }

  const why = document.getElementById('why');
  const ABCD = ['A','B','C','D'];
  if(G.diff === 'hard'){
    why.innerHTML = right
      ? '<b>✓ 正确</b>　困难模式不显示解析，错题会进错题集。'
      : '<b>✗ 错误</b>　正确答案 ' + ABCD[q.a] + '：' + q.o[q.a];
  } else {
    why.innerHTML = '<b>' + (right?'✓ 正确　':'✗ 答错　') + '</b>' + q.why;
  }
  why.className = 'why on';

  if(right){
    G.okN++; G.streak++;
    G.score += 120 + G.streak * 30;
    applyReward(G.pendReward);
    Sound.right();
  } else {
    G.noN++; G.streak = 0;
    addFloat(G.player.x, G.player.y - 24, '未获奖励', '#7a9090');
    Sound.wrong();
    wrongList.push({q:q.q, pick, right:q.a, why:q.why});
    saveWrong(q.q, pick);
  }
  updateHud();

  setTimeout(() => { if(G.state==='play') nextQuestion(); }, right ? 1300 : 2500);
}

function addFloat(x, y, text, color){
  G.floats.push({x, y, text, color, life: 75});
}

/* ============ 永久特性（本局内累积，死了清空） ============ */
const TRAITS = [
  {id:'multi',  name:'多重射击', icon:'⋔', col:'#ffd166', max:4, desc:'每次多射 1 发（扇形）'},
  {id:'pierce', name:'穿透',     icon:'➤', col:'#7fd6ff', max:3, desc:'子弹多穿 1 个敌人'},
  {id:'bounce', name:'弹射',     icon:'⤡', col:'#9bb7ff', max:2, desc:'子弹碰墙反弹 1 次'},
  {id:'rapid',  name:'速射',     icon:'⚡', col:'#ff9f68', max:3, desc:'射击间隔 -18%'},
  {id:'crit',   name:'暴击',     icon:'✦', col:'#ffe066', max:3, desc:'12% 概率双倍伤害'},
  {id:'armor',  name:'装甲',     icon:'▣', col:'#5fe08a', max:3, desc:'最大生命 +25 并回满'},
  {id:'regen',  name:'再生',     icon:'♻', col:'#7fffd4', max:3, desc:'每 1.5 秒回 1 血'},
  {id:'thorns', name:'荆棘',     icon:'✵', col:'#ff8fa3', max:2, desc:'被撞时反弹伤害'},
  {id:'speed',  name:'疾行',     icon:'⇒', col:'#a8e6ff', max:3, desc:'移动速度 +15%'},
  {id:'orbit',  name:'环绕',     icon:'◍', col:'#c77dff', max:3, desc:'增加 1 颗环绕光球'},
  {id:'chain',  name:'电弧',     icon:'⌁', col:'#7fd6ff', max:3, desc:'每 3 秒电击最近敌人'},
  {id:'steal',  name:'吸血',     icon:'♥', col:'#ff6b8a', max:2, desc:'击杀回 2 血'}
];

function pickReward(){
  const cfg = levelCfg(G.level);
  const pool = TRAITS.filter(t =>
    cfg.traits.includes(t.id) && (G.traits[t.id] || 0) < t.max
  );
  if(!pool.length) return null;
  return pool[Math.floor(Math.random() * pool.length)];
}

function applyReward(t){
  if(!t) return;
  const p = G.player;
  G.traits[t.id] = (G.traits[t.id] || 0) + 1;
  const lv = G.traits[t.id];

  if(t.id === 'armor'){
    p.maxHp += 25;
    p.hp = p.maxHp;
  }
  addFloat(p.x, p.y - 30, t.name + ' Lv' + lv, t.col);
  updateTraitsUI();
}

function updateTraitsUI(){
  const box = document.getElementById('traits');
  if(!box) return;
  const list = TRAITS.filter(t => G.traits[t.id]);
  if(!list.length){ box.innerHTML = '<span style="color:#3a4d44">答对题目可获得永久特性</span>'; return; }
  box.innerHTML = list.map(t =>
    '<span class="tr" style="color:' + t.col + ';border-color:' + t.col + '">' +
    t.icon + ' ' + t.name + '<b>' + G.traits[t.id] + '</b></span>'
  ).join('');
}

function saveWrong(q, pick){
  try{
    const k = 'qz:wrong';
    const arr = JSON.parse(localStorage.getItem(k) || '[]');
    const hit = arr.filter(x => x.q === q)[0];
    if(hit){
      hit.count = (hit.count || 1) + 1;
      hit.pick = pick;
      hit.t = Date.now();
    } else {
      arr.push({q, pick, count: 1, t: Date.now()});
    }
    localStorage.setItem(k, JSON.stringify(arr.slice(-300)));
  }catch(e){}
}

/* ============================================================
   流程
   ============================================================ */
function togglePause(){
  const pm = document.getElementById('pauseMenu');
  if(G.state === 'play'){
    G.state = 'pause';
    pm.classList.remove('off');
    syncPauseUI();
  } else if(G.state === 'pause'){
    G.state = 'play';
    pm.classList.add('off');
  }
}

function syncPauseUI(){
  syncSeg('pauseFire', G.fireMode);
  syncSeg('pauseSound', Sound.isMuted() ? 'off' : 'on');
}

function startGame(){
  Sound.unlock();
  fitCanvas();

  // 先解析章节/关卡参数
  const qs2 = new URLSearchParams(location.search);
  const chQ = parseInt(qs2.get('chapter'));
  G.chapter = (chQ === 2) ? 2 : 1;
  const lvQ = parseInt(qs2.get('level'));
  const startLv = (lvQ >= 1 && lvQ <= 10) ? lvQ : 1;

  G.state = 'play';
  G.t = 0; G.score = 0; G.okN = 0; G.noN = 0; G.streak = 0;
  G.killed = 0; G.shake = 0; G.zoom = 1;
  wrongList = []; qLocked = true;

  document.getElementById('menu').classList.add('off');
  document.getElementById('topKv').textContent =
    (CHAP_NAMES[G.chapter] || '') + ' · ' + SIZES[G.size].name + '地图 · ' + DIFFS[G.diff].name;

  startLevel(startLv);
  nextQuestion();
}

function grantCard(chapter, level){
  const list = CARDS[chapter] || CARDS[1];
  const c = list[level - 1];
  if(!c) return null;
  try{
    const k = 'qz:cards';
    const arr = JSON.parse(localStorage.getItem(k) || '[]');
    if(!arr.includes(c.id)){ arr.push(c.id); localStorage.setItem(k, JSON.stringify(arr)); }
  }catch(e){}
  return c;
}

function calcStars(rate){
  if(rate >= 0.9) return 3;
  if(rate >= 0.7) return 2;
  return 1;
}

function saveProgress(level, stars, rate, score){
  try{
    const k = 'qz:progress';
    const p = JSON.parse(localStorage.getItem(k) || '{}');
    const key = 'ds-1-' + level;
    const old = p[key] || {};
    p[key] = {
      stars: Math.max(old.stars || 0, stars),
      best: Math.max(old.best || 0, rate),
      score: Math.max(old.score || 0, score),
      ok: Math.max(old.ok || 0, G.okN),
      rate: rate,
      waves: G.totalWaves,
      cleared: true
    };
    localStorage.setItem(k, JSON.stringify(p));
  }catch(e){}
}

function gameOver(){
  G.state = 'over';
  Sound.over();
  const m = document.getElementById('menu');
  m.classList.remove('off');
  m.innerHTML =
    '<h1 style="color:#ff6b6b;text-shadow:0 0 26px rgba(255,107,107,.5)">防 线 失 守</h1>' +
    '<div class="hint">得分 <b style="color:#ffd166">' + G.score + '</b> ｜ ' +
    '答对 <b style="color:#5fe08a">' + G.okN + '</b> ｜ ' +
    '答错 <b style="color:#ff6b6b">' + G.noN + '</b> ｜ ' +
    '击杀 <b>' + G.killed + '</b>' +
    (wrongList.length ? '<br>本局错题 ' + wrongList.length + ' 道，已存入错题集' : '') +
    '</div>' +
    '<button class="btn-start" id="againBtn">再 来 一 局</button>';
  document.getElementById('againBtn').onclick = () => {
    m.innerHTML = '';
    m.classList.add('off');
    startGame();
  };
}

/* ============================================================
   输入
   ============================================================ */
const MOVE = ['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'];

document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if(MOVE.includes(k)){ keys[k] = true; e.preventDefault(); }
  if(k === ' '){ keys[' '] = true; e.preventDefault(); }
  if(k === 'escape'){ togglePause(); e.preventDefault(); return; }
  if(G.state === 'play'){
    if(k>='1' && k<='4'){ answer(parseInt(k)-1); e.preventDefault(); }
  }
  if(k === 'm') Sound.toggle();
});
document.addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  if(MOVE.includes(k)) keys[k] = false;
  if(k === ' ') keys[' '] = false;
});

cv.addEventListener('mousemove', e => {
  const r = cv.getBoundingClientRect();
  mouse.x = e.clientX - r.left;
  mouse.y = e.clientY - r.top;
});
cv.addEventListener('mousedown', e => { mouse.down = true; e.preventDefault(); });
window.addEventListener('mouseup', () => { mouse.down = false; });

function saveSetting(k, v){
  try{
    const s = JSON.parse(localStorage.getItem('qz:settings') || '{}');
    s[k] = v;
    localStorage.setItem('qz:settings', JSON.stringify(s));
  }catch(e){}
}

function syncSeg(id, v){
  const box = document.getElementById(id);
  if(!box) return;
  box.querySelectorAll('button').forEach(b => {
    b.classList.toggle('on', b.dataset.v === v);
  });
}

function loadSettings(){
  try{
    const s = JSON.parse(localStorage.getItem('qz:settings') || '{}');
    if(s.fireMode) G.fireMode = s.fireMode;
    if(s.qOrder) G.qOrder = s.qOrder;
    if(s.size && SIZES[s.size]) G.size = s.size;
    if(s.diff && DIFFS[s.diff]) G.diff = s.diff;
    if(s.sound === 'off') Sound.setMuted(true);
  }catch(e){}
  syncSeg('segSize', G.size);
  syncSeg('segDiff', G.diff);
  syncSeg('segFire', G.fireMode);
  syncSeg('segOrder', G.qOrder);
}

function bindSeg(id, key){
  const box = document.getElementById(id);
  box.querySelectorAll('button').forEach(b => {
    b.onclick = () => {
      box.querySelectorAll('button').forEach(x => x.classList.remove('on'));
      b.classList.add('on');
      G[key] = b.dataset.v;
      saveSetting(key, b.dataset.v);
    };
  });
}
bindSeg('segSize', 'size');
bindSeg('segDiff', 'diff');
bindSeg('segFire', 'fireMode');
bindSeg('segOrder', 'qOrder');

// 暂停面板
document.getElementById('resumeBtn').onclick = () => togglePause();
document.getElementById('restartBtn').onclick = () => {
  document.getElementById('pauseMenu').classList.add('off');
  G.state = 'play';
  startLevel(G.level);
};
document.getElementById('quitBtn').onclick = () => {
  location.href = 'hub.html?subject=ds&chapter=' + G.chapter;
};
document.getElementById('pauseFire').querySelectorAll('button').forEach(b => {
  b.onclick = () => {
    G.fireMode = b.dataset.v;
    saveSetting('fireMode', b.dataset.v);
    syncSeg('pauseFire', b.dataset.v);
  };
});
document.getElementById('pauseSound').querySelectorAll('button').forEach(b => {
  b.onclick = () => {
    Sound.setMuted(b.dataset.v === 'off');
    saveSetting('sound', b.dataset.v);
    syncSeg('pauseSound', b.dataset.v);
  };
});

document.getElementById('wavebar').onclick = () => {
  if(G.state === 'play' && G.waveState === 'gap'){
    G.waveTimer = 0;
    G.waveBonus = 1.25;
    updateWaveUI();
  }
};

document.getElementById('startBtn').onclick = startGame;

/* ============================================================
   启动
   ============================================================ */
fitCanvas();
loadSettings();
updateHud();
requestAnimationFrame(loop);

  setTimeout(() => {
    startGame();
    G.t = 1400;
    const p = G.player;
    for(let i=0;i<6;i++){
      const a = i/6 * Math.PI * 2 + 0.3;
      const d = 210 + (i%3)*60;
      let x = p.x + Math.cos(a)*d, y = p.y + Math.sin(a)*d;
      x = Math.max(TILE*2, Math.min(G.worldW-TILE*2, x));

        cd: 9999, fireGap: 120
      });

    // demo 预设几个特性，方便验收

    updateTraitsUI();

    G.cam.x = p.x - G.viewW/2;
    G.cam.y = p.y - G.viewH/2;
    updateHud();
    render();
  }, 260);
}
